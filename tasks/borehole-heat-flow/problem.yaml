# problem.yaml: one per task folder. File paths are relative to this folder.

domain: earth

subfield: "Geothermics: borehole heat flow from minimum-curvature trajectories, layered conduction and paleoclimate correction"

tags:
  - heat flow
  - borehole temperature
  - paleoclimate correction
  - minimum curvature
  - thermal conductivity
  - least squares
  - inverse Laplace transform
  - Canadian Shield

expert_time_estimate_hours: 10

relevant_experience: "TODO(author): describe your own relevant experience truthfully before upload"

author: "Ayoub Bousfiha"
affiliation: "Independent Researcher"

difficulty_explanation: >-
  Each of the first four steps hides a standard mistake of heat-flow work: the minimum-curvature true vertical
  depth must be exact between stations and for very small but non-zero doglegs on long segments (the ratio
  factor and the partial arc of a point inside a segment, without cancellation), the thermal resistance of a
  layered column is a harmonic and not an arithmetic average, the paleoclimate perturbation needs times in
  seconds and the factor 2 in the erfc argument, and the glacial amplitude has to be estimated jointly with
  T0 and q0 by least squares with the unbiased residual variance and a stated resolvability test. The
  integration step adds the order of operations (layer tops converted with the same trajectory, the z_min cut
  applied to vertical depth and inclusive) and the error contract of the whole chain. Step 5 is the hardest:
  in a layered column the erfc formula no longer applies, and the required 1e-8 K per kelvin of the largest
  surface departure, for up to 50 layers, strong conductivity contrasts and histories from centuries to more
  than 100 kyr, needs an exact Laplace-domain solution of the layered diffusion problem written without
  overflow or cancellation and an accurate numerical inverse Laplace transform. Gaver-Stehfest inversion in
  double precision (errors of about 3e-6 K per K) and erfc responses with a mean or local diffusivity (0.04 to
  0.2 K per K in the test columns) miss that requirement by orders of magnitude.

solution_explanation: >-
  Step 1 accumulates the closed-form minimum-curvature increments 0.5 dMD (cos I1 + cos I2) RF(beta), with the
  dogleg from atan2(|t1 x t2|, t1 . t2) and the ratio factor tan(beta/2)/(beta/2) from its Taylor series for
  small half-angles; a point inside a segment uses the great-circle tangent written with sinc functions and
  the ratio factor of the partial arc. Step 2 sums the exact layer contributions (b - a)/k and
  (b^2 - a^2)/(2k). Step 3 superposes differences of erfc step responses with times converted with the Julian
  year. Step 4 checks resolvability with the singular values of the column-normalized design [1, R, P], solves
  the normal equations for y = T + A S and takes the covariance s^2 (G^T G)^-1 with s^2 = RSS/(n - 3). Step 5
  Laplace-transforms the layered problem: in each layer the transform is a e^{-qz} + b e^{qz} with
  q = sqrt(s/kappa_i), the admittance k F'/F is carried up from the bottom half-space with a tanh recursion,
  F is assembled in logarithms from e^{-2qh} factors only, F/s is inverted on a fixed 32-node Talbot contour
  (Abate and Valko 2004) and the step responses of the history are superposed. Step 6 converts the readings
  and layer tops to vertical depth, applies the inclusive z_min cut and calls steps 2-4.

verification_explanation: >-
  Independent targets come from closed forms (straight and constant-build holes, a constant-azimuth segment
  with inclination linear in MD, hand-computed layer sums, erfc forms evaluated with math.erfc, the
  Carslaw-Jaeger image series for a layer over a half-space), from independent computations inside the tests
  (adaptive quadrature of the arc tangent and of 1/k and z/k with scipy.integrate.quad, numpy.linalg.lstsq
  with the OLS covariance), from 90-digit mpmath values for two multilayer columns stored inline
  (transfer-matrix transform and mpmath's Talbot inversion; five of them were recomputed in the latest
  revision by a forward transfer-matrix propagation at 40 digits and agree to 5e-17 K), and, for the whole
  task, from synthetic
  boreholes regenerated in each case forward from known q0, T0 and g (Gauss-Legendre TVD, exact layer sums,
  math.erfc, seeded noise), with the noisy-hole targets recomputed by least squares on the generator's own
  model terms. The second solution uses different methods (Gauss-Legendre integration of the arc tangent,
  adaptive quadrature for R and S, Duhamel convolution in log-time for the half-space perturbation, QR least
  squares, and one global linear system per Laplace node with the Weideman-Trefethen hyperbolic contour for
  the layered column) and passes every test case. Each step has named scientific mutants (linear TVD
  interpolation, balanced tangential, arithmetic-mean conductivity, missing 1/2 in S, years not converted,
  missing factor 2, reversed interval sign, wrong heat-production sign, RSS/n, erfc with a mean or local
  diffusivity, Gaver-Stehfest in double precision, MD used as depth, no paleoclimate term, one mean
  conductivity, z_min cut on MD) and four whole-task mutants, and each fails at least one case of its target
  tests. Every case was run alone in a fresh process with tools/crown_check.py for the per-step references,
  solution.py, the second solution, the mutants, the all-None and all-zero controls (which pass no case) and
  with every reference output scaled by 1 +- 1e-12 (all cases still pass).

required_dependencies: |-
  import numpy as np
  import math
  from scipy.integrate import quad

problem_description_main: |-
  An exploration diamond-drill hole in the Canadian Shield has been logged for temperature after thermal
  re-equilibration. From its deviation survey, the lithology-based conductivity column, the known uniform
  radiogenic heat production and a prescribed shape of the last-glacial ground-surface temperature history,
  estimate the steady-state surface heat flow q0, the reference surface temperature T0 and the amplitude g of
  the glacial history, with their 1-sigma standard errors.

  Conventions used throughout. Depth z is true vertical depth (TVD, m, positive down) below the collar. The
  borehole path between survey stations is the minimum-curvature arc (constant-rate rotation of the unit
  tangent on the great circle joining the station directions), and the TVD at any measured depth (MD) along
  the hole, including between stations, is taken on that arc. Layer boundaries are horizontal and are logged
  in MD along the hole; their depth is the TVD of the contact. Heat transport is one-dimensional conduction in
  a laterally homogeneous ground: with a uniform heat production A the heat flow is q(z) = q0 - A z and
  dT/dz = q(z) / k(z), so the steady geotherm is T_ss(z) = T0 + q0 R(z) - A S(z) with R(0) = S(0) = 0. The
  transient paleoclimate signal comes from a piecewise-constant ground-surface history: interval 0 runs from
  the present back to t_years[0], interval i from t_years[i-1] back to t_years[i] (years before present,
  1 year = 365.25 x 86400 s); during interval i the surface departed from T0 by g times the shape value of the
  interval, and before the last interval end the ground was in steady state. For the heat-flow estimate the
  perturbation is that of a homogeneous half-space with diffusivity kappa. The observation model is
  T_obs = T0 + q0 R - A S + g P + noise, where P is the perturbation of the unit-amplitude history; T0, q0 and
  g are estimated jointly by ordinary least squares, with standard errors from the noise variance
  RSS / (n_used - 3), using only the readings with TVD >= z_min.

  Steps 1-4 build the pieces: TVD by minimum curvature (step 1), the depth functions R and S of the layered
  column (step 2), the half-space paleoclimate perturbation (step 3) and the joint least-squares estimate
  (step 4). Step 5 computes the paleoclimate perturbation in the layered conductivity column itself, where the
  glacial signal is refracted at every conductivity contrast. Step 6 (surface_heat_flow) chains steps 1-4 into
  the complete workflow and is the top-level function of the task.

problem_io: |-
  def surface_heat_flow(survey_md, survey_inc, survey_azi, log_md, log_temp,
                        layer_top_md, layer_k, heat_production, kappa,
                        hist_t_years, hist_dT_shape, z_min):
      """Paleoclimate-corrected surface heat flow from an inclined borehole.

      Parameters
      ----------
      survey_md, survey_inc, survey_azi : deviation survey as in step 1:
          station MD (m, first 0 at the collar, strictly increasing),
          inclination from vertical (degrees, 0 = straight down) and azimuth
          (degrees clockwise from north).
      log_md, log_temp : 1-D arrays of equal length, MD of each reading (m,
          within the survey) and its equilibrium temperature (deg C).
      layer_top_md, layer_k : MD of the top of each horizontal layer (m, first
          0, strictly increasing, within the survey; the last layer extends
          below the hole) and its conductivity (W m^-1 K^-1, > 0).
      heat_production : uniform radiogenic heat production A (W m^-3), >= 0.
      kappa : thermal diffusivity of the ground (m^2 s^-1), > 0.
      hist_t_years, hist_dT_shape : ends of the history intervals (years
          before present, positive, strictly increasing) and the surface
          departure of the unit-amplitude history during each interval (K per
          unit amplitude; the departure is g * hist_dT_shape[i]).
      z_min : readings with TVD >= z_min (m) are used, shallower ones excluded.

      Workflow
      --------
      1. TVD of every reading and every layer top (step 1).
      2. Keep readings with TVD >= z_min.
      3. R and S at the kept depths (step 2); P of the unit-amplitude history (step 3).
      4. Joint least-squares estimate of T0, q0 and g (step 4).

      Returns
      -------
      dict: "T0" (deg C), "q0" (W m^-2), "amplitude" (g, K), "sigma_T0",
      "sigma_q0", "sigma_amplitude" (1-sigma standard errors, same units),
      "rms_residual" (K, sqrt(RSS/n_used)) as Python floats, and "n_used"
      (int, number of readings used).
      Accuracy: for temperatures that follow the model exactly, T0, q0 and g
      within 1e-5 K, 1e-8 W m^-2 and 1e-4 K of the generating values and
      rms_residual below 1e-6 K; for noisy temperatures, T0, q0 and g within
      5e-4 K, 2e-6 W m^-2 and 2e-3 K of the exact least-squares solution, the
      three standard errors within 2 % and rms_residual within 1 % (relative);
      n_used exact.

      Raises
      ------
      ValueError if log_md and log_temp are not 1-D of equal length, if any
      earlier step raises (invalid survey, layer tops or log depths beyond the
      last survey station, invalid conductivities, history or kappa,
      heat_production negative or non-finite), if fewer than 4 readings remain
      after the z_min cut, or if T0, q0 and g are not separately resolvable
      (criterion of step 4, e.g. an all-zero hist_dT_shape).
      """

general_tests: tests/general.py

second_solution: second_solution.py

