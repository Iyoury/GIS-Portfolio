  description: |
    The equilibrium temperatures follow the observation model T = T0 + q0 R - A S + g P + noise. At each reading, R and S come from layer_integrals (step 2) and P is the perturbation of the unit-amplitude paleoclimate history from paleoclimate_perturbation (step 3); true_vertical_depth (step 1) gives the depths at which they are evaluated. The heat production A (W m^-3) is known. The unknowns are the surface temperature T0 (deg C), the surface heat flow q0 (W m^-2) and the amplitude g (K) of the history.
