    heat_production: uniform radiogenic heat production A, W m^-3, >= 0 (known)
    kappa: thermal diffusivity of the ground, m^2 s^-1 (homogeneous)
    hist_t_years: ends of the surface-history intervals, years before present, positive, strictly increasing
    hist_dT_shape: shape of the surface-temperature departure during each interval, K per unit amplitude
    z_min: readings with true vertical depth shallower than z_min (m) are excluded from the fit
  outputs:
    type: dict
    keys:
      T0: reference (long-term) ground-surface temperature, deg C
      q0: steady-state surface heat flow, W m^-2
      amplitude: multiplier g of hist_dT_shape (K), e.g. g = 6.5 means a glacial departure of -6.5 K for shape -1
      sigma_T0: 1-sigma of T0
