# On a new version of an uploaded task only, what kind of edit it is.
edit_label: grading_fix

sub_steps:
  - step_number: 1
    scaffold: steps/step_1.py
    solution: solution/step_1.py
    tests: tests/step_1.py
    step_description_prompt: |-
      Compute the true vertical depth (TVD, m, positive down) at arbitrary measured depths (MD) along a
      borehole from its deviation survey, using the minimum-curvature model of the well path.
      At each survey station the inclination I is given in degrees from vertical (0 = straight down) and the
      azimuth A in degrees clockwise from north. The unit tangent of the path at a station is
      t = (sin I cos A, sin I sin A, cos I) in (north, east, down) coordinates.
      Minimum-curvature model: between two consecutive stations the path is the circular arc on which the unit
      tangent turns at a constant rate (per metre of MD) along the great circle from t1 to t2. The total
      turning angle over the segment is the dogleg beta, with cos beta = t1 . t2; only for beta exactly 0 is
      the segment straight. The accuracy below must hold for every dogleg, including very small non-zero
      doglegs on long segments. A query point inside a segment lies on that same arc, at the distance
      (MD - MD1) along it from the first station.
      The TVD of any point is the integral, along the path from the collar (MD = 0, TVD = 0), of the down
      component of the unit tangent. Derive the TVD of the stations and of points inside a segment from this
      model; linear interpolation of TVD, of the angles or of the tangent between stations is not allowed.
      Returns: a Python float for a scalar md_query, otherwise a numpy float array with the shape of md_query.
      Absolute accuracy: 1e-6 m.
      Errors: ValueError if the survey arrays are not 1-D of equal length with >= 2 stations, contain a
      non-finite value, do not start at MD 0 or do not increase strictly, if any inclination is outside
      [0, 180), if the dogleg between two consecutive stations is within 1e-6 rad of 180 degrees (opposite
      directions: the arc is not defined), or if a query depth is non-finite or outside [0, survey_md[-1]].
    function_header: |-
      def true_vertical_depth(survey_md, inc_deg, azi_deg, md_query):
          """True vertical depth (m, positive down) at measured depths md_query.

          Parameters
          ----------
          survey_md : 1-D array_like, measured depth of survey stations (m); first
              station at 0 (collar), strictly increasing, at least 2 stations.
          inc_deg : 1-D array_like, inclination from vertical at each station
              (degrees, 0 = straight down), 0 <= inc < 180.
          azi_deg : 1-D array_like, azimuth at each station (degrees clockwise from
              north).
          md_query : float or array_like, measured depths (m) with
              0 <= md_query <= survey_md[-1].

          Returns
          -------
          Python float for scalar md_query, otherwise a numpy float array with the
          shape of md_query. Absolute accuracy 1e-6 m (the minimum-curvature path
          is exact; no approximation between stations is permitted).

          Raises
          ------
          ValueError if the survey arrays are not 1-D of equal length, have fewer
          than 2 stations, contain a non-finite value, do not start at MD 0 or do
          not increase strictly, if any inclination is outside [0, 180), if the
          dogleg between two consecutive stations is within 1e-6 rad of 180 degrees
          (opposite directions: the arc is undefined), or if any query depth is
          non-finite or outside [0, survey_md[-1]].
          """
    return_line: "    return tvd"
    step_background: |-
      A deviation survey gives the inclination and azimuth of the hole at stations along it. The
      minimum-curvature method is the industry standard (Sawaryn and Thorogood 2005); its closed form contains
      the ratio factor tan(beta/2)/(beta/2). Linear interpolation of TVD or of the angles between stations and
      the balanced-tangential method (no ratio factor) are not the minimum-curvature path, and treating MD as
      depth in an inclined hole lowers the apparent temperature gradient by cos I.
    n_test_cases: 22
    contract:
      quantity: "True vertical depth (m) at measured depths along a borehole, from its deviation survey, by the minimum-curvature method."
      assumptions: "Between stations the unit tangent rotates at a constant rate per metre of MD on the great circle joining the station directions; TVD is the integral of the down component of the tangent from the collar (MD 0, TVD 0)."
      result_kind: exact
      valid_input_ranges: "At least 2 stations, MD starting at 0 and strictly increasing, 0 <= inclination < 180 degrees, any azimuth, no dogleg within 1e-6 rad of 180 degrees; 0 <= md_query <= survey_md[-1]."
      units: "MD and TVD in m; inclination and azimuth in degrees."
      output_shape: "Python float for a scalar md_query, otherwise a numpy float array with the shape of md_query."
      step_dependencies: []
    mutants:
      - name: linear_tvd_between_stations
        description: "TVD between survey stations interpolated linearly in measured depth instead of on the minimum-curvature arc."
        file: mutants/step_1_linear_tvd_between_stations.py
      - name: balanced_tangential
        description: "Ratio factor omitted (balanced-tangential method): the arc is replaced by two straight half-segments."
        file: mutants/step_1_balanced_tangential.py

  - step_number: 2
    scaffold: steps/step_2.py
    solution: solution/step_2.py
    tests: tests/step_2.py
    step_description_prompt: |-
      A column of horizontal layers has a constant thermal conductivity k_i (W m^-1 K^-1) inside each layer.
      The top of layer i is at depth z_i (m): the first top is 0, the tops increase strictly, and the last
      layer extends to infinite depth.
      In steady one-dimensional conduction with a uniform radiogenic heat production A (W m^-3), the upward
      heat flow decreases with depth as q(z) = q0 - A z, where q0 is the surface heat flow, and Fourier's law
      gives dT/dz = q(z) / k(z), with T(0) = T0. The steady temperature can therefore be written as
      T(z) = T0 + q0 R(z) - A S(z), where R(z) (thermal resistance, m^2 K W^-1) and S(z) (m^3 K W^-1) depend
      only on the conductivity column and are zero at z = 0. Return R(z) and S(z) at each requested depth z
      (m) for the given layers.
      Returns: tuple (R, S); two Python floats for a scalar z, otherwise two numpy float arrays with the shape
      of z. Relative accuracy: 1e-9 (absolute 1e-12 at z = 0, where R = S = 0).
      Errors: ValueError if the layer arrays are not 1-D of equal length, any top is non-finite, the first
      top is not 0 or tops do not increase strictly, any conductivity is non-finite or <= 0, or any depth is
      non-finite or negative.
    function_header: |-
      def layer_integrals(layer_top_tvd, layer_k, z):
          """Depth functions R(z), S(z) of the steady layered geotherm T = T0 + q0 R - A S.

          Parameters
          ----------
          layer_top_tvd : 1-D array_like, depth (m) of the top of each layer; the
              first is 0, strictly increasing. The last layer extends to infinity.
          layer_k : 1-D array_like, thermal conductivity of each layer (W m^-1 K^-1), > 0.
          z : float or array_like, depths (m) >= 0.

          Returns
          -------
          (R, S) : R in m^2 K W^-1, S in m^3 K W^-1; two Python floats for scalar
          z, otherwise two numpy float arrays with the shape of z. Relative
          accuracy 1e-9 (absolute 1e-12 at z = 0, where R = S = 0).

          Raises
          ------
          ValueError if the layer arrays are not 1-D of equal length, if any top is
          non-finite, if the first top is not 0 or tops do not increase strictly,
          if any conductivity is non-finite or <= 0, or if any depth is non-finite
          or negative.
          """
    return_line: "    return (R, S)"
    step_background: |-
      In the Bullard (1939) method the temperature is plotted against the thermal resistance R(z) between the
      surface and depth z. Resistances add in series, so the effective conductivity of a stack of layers is
      the thickness-weighted harmonic mean; an arithmetic mean or a single average conductivity biases both
      q0 and the curvature of the profile. Without heat production and transients the Bullard plot is a
      straight line.
    n_test_cases: 11
    contract:
      quantity: "Thermal resistance R(z) = integral of 1/k and heat-production depth function S(z) = integral of z'/k from 0 to z in a layered column."
      assumptions: "Horizontal layers of constant conductivity, the last layer extending to infinite depth; steady one-dimensional conduction with uniform heat production, T = T0 + q0 R - A S."
      result_kind: exact
      valid_input_ranges: "Layer tops finite, starting at 0 and strictly increasing; conductivities finite and > 0; depths z >= 0."
      units: "R in m^2 K W^-1, S in m^3 K W^-1; depths in m; conductivities in W m^-1 K^-1."
      output_shape: "Tuple (R, S) of two Python floats for a scalar z, otherwise of two numpy float arrays with the shape of z."
      step_dependencies: []
    mutants:
      - name: arithmetic_conductivity
        description: "Thermal resistance computed with the arithmetic mean conductivity of all layers instead of summing the layer resistances in series."
        file: mutants/step_2_arithmetic_conductivity.py
      - name: heat_production_integral_missing_half
        description: "S(z) integrated as (b^2 - a^2)/k instead of (b^2 - a^2)/(2k)."
        file: mutants/step_2_heat_production_integral_missing_half.py

  - step_number: 3
    scaffold: steps/step_3.py
    solution: solution/step_3.py
    tests: tests/step_3.py
    step_description_prompt: |-
      Return the present-day departure (K) of subsurface temperature from the steady state caused by a past
      ground-surface temperature history. The ground is a homogeneous conducting half-space z >= 0
      (z = depth, m) with thermal diffusivity kappa (m^2 s^-1) and no internal heat sources: the departure
      obeys the one-dimensional heat equation, and at the surface it equals the surface-temperature departure.
      History: interval 0 runs from the present back to t_years[0], interval i from t_years[i-1] back to
      t_years[i] (years before present). During interval i the ground-surface temperature differed from the
      long-term reference by dT[i] (K). Before t_years[-1] the surface stayed at the reference long enough for
      the departure to be zero at all depths. Convert years to seconds with 1 year = 365.25 x 86400 s. At
      z = 0 the result is the present surface departure dT[0].
      Returns: a Python float for a scalar z, otherwise a numpy float array with the shape of z (any number of
      dimensions). Absolute accuracy: 1e-6 K per kelvin of the largest |dT[i]|.
      Errors: ValueError if t_years and dT are not 1-D of equal length, contain a non-finite value,
      t_years[0] <= 0 or t_years does not increase strictly, kappa is non-finite or <= 0, or any depth is
      non-finite or negative.
    function_header: |-
      def paleoclimate_perturbation(z, t_years, dT, kappa):
          """Present-day temperature perturbation (K) at depth z.

          History convention: interval 0 runs from the present back to t_years[0],
          interval i runs from t_years[i-1] back to t_years[i]. During interval i
          the ground-surface temperature differed from the long-term reference
          surface temperature by dT[i] (K). Before t_years[-1] the surface stayed
          at the reference temperature long enough for the ground to be in steady
          state. The subsurface is a homogeneous conductive half-space with thermal
          diffusivity kappa. Times in years are converted with SECONDS_PER_YEAR.

          Parameters
          ----------
          z : float or array_like, depth (m) >= 0.
          t_years : 1-D array_like, positive, strictly increasing ends of the
              history intervals (years before present).
          dT : 1-D array_like, same length, departure during each interval (K).
          kappa : float, thermal diffusivity (m^2 s^-1), > 0.

          Returns
          -------
          Python float for scalar z, else a numpy float array with the shape of z.
          Absolute accuracy 1e-6 K per kelvin of the largest |dT|.

          Raises
          ------
          ValueError if t_years and dT are not 1-D of equal length, if they
          contain a non-finite value, if t_years[0] <= 0 or t_years does not
          increase strictly, if kappa is non-finite or <= 0, or if any depth is
          non-finite or negative.
          """
    return_line: "    return dT_z"
    step_background: |-
      A step change of the surface temperature of a homogeneous half-space produces the present-day
      perturbation dT erfc(z / (2 sqrt(kappa t))), and a piecewise-constant history is a superposition of such
      responses (Birch 1948; Beck 1977). On the Canadian Shield the last glaciation still leaves the upper
      1-2 km several kelvin out of equilibrium; the shape of the history comes from paleoclimate proxies,
      while its amplitude is poorly known and is estimated from the borehole itself.
    n_test_cases: 11
    contract:
      quantity: "Present-day temperature departure from the steady state caused by a piecewise-constant ground-surface temperature history in a homogeneous half-space."
      assumptions: "Homogeneous conducting half-space with diffusivity kappa and no internal sources; surface departure dT[i] during interval i and zero before t_years[-1]; superposition of erfc step responses; 1 year = 365.25 x 86400 s."
      result_kind: exact
      valid_input_ranges: "z >= 0 and finite; t_years positive and strictly increasing; dT finite; kappa finite and > 0."
      units: "Departure in K; depth in m; history times in years before present; kappa in m^2 s^-1."
      output_shape: "Python float for a scalar z, otherwise a numpy float array with the shape of z."
      step_dependencies: []
    mutants:
      - name: years_not_converted
        description: "History times used in years instead of seconds in the diffusion length sqrt(kappa t)."
        file: mutants/step_3_years_not_converted.py
      - name: erfc_missing_factor_2
        description: "Diffusion argument written z/sqrt(kappa t) instead of z/(2 sqrt(kappa t))."
        file: mutants/step_3_erfc_missing_factor_2.py
      - name: interval_sign_reversed
        description: "Each interval contributes erfc(new) - erfc(old) instead of erfc(old) - erfc(new) (warming read as cooling)."
        file: mutants/step_3_interval_sign_reversed.py

  - step_number: 4
    scaffold: steps/step_4.py
    solution: solution/step_4.py
    tests: tests/step_4.py
    step_description_prompt: |-
      The equilibrium temperatures follow the observation model T = T0 + q0 R - A S + g P + noise. In the
      workflow, R and S are the depth functions of layer_integrals (step 2) and P is the perturbation of the
      unit-amplitude paleoclimate history from paleoclimate_perturbation (step 3), all evaluated at the true
      vertical depths of the readings (step 1); this function receives them as arrays. The heat production A
      (W m^-3) is known. The unknowns are the surface temperature T0 (deg C), the surface heat flow q0
      (W m^-2) and the amplitude g (K) of the history.
      Estimate T0, q0 and g by ordinary (unweighted) least squares. Report their 1-sigma standard errors from
      the least-squares parameter covariance, with the noise variance estimated without bias from the
      residuals (residual sum of squares RSS divided by n - 3), and the root-mean-square residual
      sqrt(RSS / n).
      The three unknowns are separately determined only if the data resolve the constant, R and P: scale each
      of the three columns 1, R and P to unit Euclidean length; if one of them is all zero (for example P
      identically zero) or the smallest singular value of the scaled n x 3 matrix is below 1e-8 (for example
      P proportional to R), raise ValueError. Any n >= 4 with a resolvable design is valid.
      Returns: dict with keys T0, q0, amplitude, sigma_T0, sigma_q0, sigma_amplitude, rms_residual, each value
      a Python float.
      Accuracy: T0 and g within 1e-9 K and q0 within 1e-12 W m^-2 of the exact least-squares solution, the
      three standard errors within a relative 1e-6, and rms_residual within 1e-9 K.
      Errors: ValueError for unequal lengths, n < 4, non-finite values, A < 0 or non-finite, or an
      unresolvable design as defined above.
    function_header: |-
      def fit_heat_flow(T, R, S, P, A):
          """Least-squares fit of  T = T0 + q0 R - A S + g P.

          Parameters
          ----------
          T : (n,) observed temperatures (deg C), n >= 4
          R : (n,) thermal resistance at the observation depths (m^2 K W^-1)
          S : (n,) heat-production integral at the observation depths (m^3 K W^-1)
          P : (n,) paleoclimate perturbation for a unit-amplitude history (K per K)
          A : float, uniform radiogenic heat production (W m^-3), >= 0 (known)

          Returns
          -------
          dict with keys T0 (deg C), q0 (W m^-2), amplitude (g, K), sigma_T0,
          sigma_q0, sigma_amplitude (1-sigma standard errors of ordinary least
          squares, noise variance estimated as RSS/(n-3)) and rms_residual (K,
          sqrt(RSS/n)); every value a Python float. Accuracy: T0 and g within
          1e-9 K, q0 within 1e-12 W m^-2 of the exact least-squares solution,
          the standard errors within a relative 1e-6, rms_residual within 1e-9 K.

          Raises
          ------
          ValueError for unequal lengths, n < 4, non-finite values, A < 0 or
          non-finite, or an unresolvable design: one of the columns 1, R, P is all
          zero, or the smallest singular value of the n x 3 matrix [1, R, P] with
          each column scaled to unit length is below 1e-8 (e.g. P proportional to R).
          """
    return_line: "    return result"
    step_background: |-
      With R, S and the unit-amplitude perturbation P evaluated at every reading, the observation model is
      linear in T0, q0 and g. The heat production is known from geochemistry on core, so the term A S is
      moved to the left side and the three parameters follow from ordinary least squares on the design
      [1, R, P], with the usual parameter covariance and the unbiased residual variance RSS/(n - 3).
    n_test_cases: 7
    contract:
      quantity: "Ordinary least-squares estimates of T0, q0 and g in T = T0 + q0 R - A S + g P, their 1-sigma standard errors and the rms residual."
      assumptions: "Known heat production A; unweighted least squares; noise variance RSS/(n - 3); design [1, R, P] resolvable (no zero column and smallest singular value of the column-normalized design >= 1e-8)."
      result_kind: exact
      valid_input_ranges: "n >= 4 readings with finite T, R, S, P of equal length; A finite and >= 0; resolvable design."
      units: "T0 in deg C, q0 in W m^-2, g in K, standard errors in the same units, rms_residual in K."
      output_shape: "dict of seven Python floats: T0, q0, amplitude, sigma_T0, sigma_q0, sigma_amplitude, rms_residual."
      step_dependencies: []
    mutants:
      - name: heat_production_sign
        description: "Heat-production term entered with the wrong sign (T = T0 + q0 R + A S + g P)."
        file: mutants/step_4_heat_production_sign.py
      - name: dof_n
        description: "Residual variance divided by n instead of n - 3 degrees of freedom."
        file: mutants/step_4_dof_n.py

  - step_number: 5
    scaffold: steps/step_5.py
    solution: solution/step_5.py
    tests: tests/step_5.py
    step_description_prompt: |-
      The half-space formula of step 3 gives the whole ground one diffusivity. In the borehole the
      conductivity changes from layer to layer (the column of layer_integrals, step 2: tops in m, the first at
      0, the last layer extending to infinite depth), and with a uniform volumetric heat capacity rho_c
      (J m^-3 K^-1) layer i has the diffusivity kappa_i = k_i / rho_c. Return the present-day departure (K) of
      the temperature from the steady state at depths z (m) in this layered ground for a piecewise-constant
      surface history with the convention of step 3: interval 0 runs from the present back to t_years[0],
      interval i from t_years[i-1] back to t_years[i] (years before present, 1 year = 365.25 x 86400 s); dT[i]
      is the surface departure during interval i, and before t_years[-1] the departure was zero at all depths.
      In every layer the departure theta obeys rho_c d(theta)/dt = d/dz (k d(theta)/dz); theta and the heat
      flux k d(theta)/dz are continuous at every layer top, theta at z = 0 equals the surface departure, and
      theta vanishes at infinite depth. At z = 0 the result is dT[0].
      Returns: a Python float for a scalar z, otherwise a numpy float array with the shape of z. Absolute
      accuracy: 1e-8 K per kelvin of the largest |dT[i]|, at every depth and for every history, layering and
      conductivity contrast. It must handle up to 1000 depths, 50 layers and 20 history intervals in one call.
      Errors: ValueError if the layer arrays are not 1-D of equal length with at least one layer, any top is
      non-finite, the first top is not 0 or the tops do not increase strictly, any conductivity is non-finite
      or <= 0, rho_c is non-finite or <= 0, t_years and dT are not 1-D of equal length, contain a non-finite
      value, t_years[0] <= 0 or t_years does not increase strictly, or any depth is non-finite or negative.
    function_header: |-
      def layered_paleoclimate_perturbation(z, layer_tops, layer_k, rho_c, t_years, dT):
          """Present-day temperature perturbation (K) at depth z in a layered column.

          History convention as in paleoclimate_perturbation (step 3). The ground
          is a column of horizontal layers (tops layer_tops, the first at 0, the
          last layer extending to infinite depth) with conductivities layer_k and a
          uniform volumetric heat capacity rho_c; temperature and heat flux are
          continuous at the layer tops.

          Parameters
          ----------
          z : float or array_like, depth (m) >= 0.
          layer_tops : 1-D array_like, layer tops (m), first 0, strictly increasing.
          layer_k : 1-D array_like, same length, conductivities (W m^-1 K^-1) > 0.
          rho_c : float, volumetric heat capacity (J m^-3 K^-1) > 0.
          t_years : 1-D array_like, positive, strictly increasing ends of the
              history intervals (years before present).
          dT : 1-D array_like, same length, departure during each interval (K).

          Returns
          -------
          Python float for scalar z, else a numpy float array with the shape of z.
          Absolute accuracy 1e-8 K per kelvin of the largest |dT|; up to 1000
          depths, 50 layers and 20 history intervals per call.

          Raises
          ------
          ValueError for invalid layers (not 1-D of equal length, no layer, a
          non-finite top, first top not 0, tops not strictly increasing,
          non-finite or non-positive conductivity), rho_c non-finite or <= 0, an
          invalid history (as in step 3), or a depth that is non-finite or
          negative.
          """
    return_line: "    return dT_z"
    step_background: |-
      For a single homogeneous half-space the response to a step change of the surface temperature is the
      error function complement (Birch 1948). Real Shield columns alternate volcanics, intrusions and
      metasediments with conductivities from about 2 to 5 W m^-1 K^-1, and the glacial signal is refracted at
      each contrast: the diffusion is faster in conductive layers, and the heat flux, not the temperature
      gradient, is continuous across an interface (Carslaw and Jaeger 1959, ch. 12, give the image series for
      a layer over a half-space). Paleoclimate corrections in layered ground therefore differ from the
      half-space formula by up to tens of percent near strong contrasts (Beck 1977; Clauser 1984).
    n_test_cases: 8
    contract:
      quantity: "Present-day temperature departure from the steady state in a horizontally layered conductivity column for a piecewise-constant ground-surface temperature history."
      assumptions: "One-dimensional conduction rho_c d(theta)/dt = d/dz (k d(theta)/dz) with uniform volumetric heat capacity, temperature and heat flux continuous at the layer tops, the last layer a half-space, theta vanishing at infinite depth; superposition of step responses; 1 year = 365.25 x 86400 s."
      result_kind: approximate
      valid_input_ranges: "z >= 0 and finite; at least one layer, tops finite, starting at 0 and strictly increasing; conductivities finite and > 0; rho_c finite and > 0; t_years positive and strictly increasing; dT finite; up to 1000 depths, 50 layers and 20 history intervals per call."
      units: "Departure in K; depths in m; conductivities in W m^-1 K^-1; rho_c in J m^-3 K^-1; history times in years before present."
      output_shape: "Python float for a scalar z, otherwise a numpy float array with the shape of z."
      step_dependencies: []
    mutants:
      - name: mean_diffusivity_halfspace
        description: "Uses the erfc half-space response with the mean diffusivity of the layers, ignoring the refraction of the signal at the interfaces."
        file: mutants/step_5_mean_diffusivity_halfspace.py
      - name: local_diffusivity_halfspace
        description: "Uses the erfc half-space response with the diffusivity of the layer that contains each depth."
        file: mutants/step_5_local_diffusivity_halfspace.py
      - name: stehfest_double_precision
        description: "Inverts the exact Laplace-domain solution with the Gaver-Stehfest formula in double precision, whose cancellation limits the accuracy to far above 1e-8 K per K."
        file: mutants/step_5_stehfest_double_precision.py

  - step_number: 6
    scaffold: steps/step_6.py
    solution: solution/step_6.py
    tests: tests/step_6.py
    step_description_prompt: |-
      Run the complete workflow on one borehole with the functions of steps 1-4:
      (1) convert the MD of every log reading and of every layer top to TVD with true_vertical_depth (step 1);
      (2) keep only the readings with TVD >= z_min (the cut is applied to vertical depth, not to MD; a reading
      exactly at z_min is kept);
      (3) evaluate R(z) and S(z) with layer_integrals (step 2), using the layer tops in TVD, and
      P(z) = paleoclimate_perturbation(z, hist_t_years, hist_dT_shape, kappa) (step 3), the perturbation of the
      unit-amplitude history;
      (4) estimate T0, q0 and g in T = T0 + q0 R - A S + g P with fit_heat_flow (step 4), A = heat_production.
      Inputs: survey_md, survey_inc, survey_azi: the deviation survey of step 1 (station MD in m, starting at
      0 at the collar and strictly increasing; inclination from vertical in degrees, 0 = straight down;
      azimuth in degrees clockwise from north). log_md, log_temp: 1-D arrays of equal length with the MD (m,
      within the survey) of each reading and its equilibrium temperature (deg C). layer_top_md, layer_k: MD
      (m) of the top of each horizontal layer (first 0, strictly increasing, within the survey; the last layer
      extends below the hole) and its conductivity (W m^-1 K^-1, > 0). heat_production: uniform A (W m^-3,
      >= 0, known). kappa: thermal diffusivity of the ground (m^2 s^-1, > 0). hist_t_years, hist_dT_shape:
      ends of the history intervals (years before present, positive, strictly increasing) and the shape of
      the surface departure during each interval (K per unit amplitude; the departure is
      g * hist_dT_shape[i], so g = 4 with a shape value of -1 is a glacial departure of -4 K). z_min (m).
      The model is valid for conduction only, horizontal layers and a laterally homogeneous ground, in holes
      up to a few km deep with inclinations below 90 degrees.
      Returns: dict with keys "T0" (deg C), "q0" (W m^-2), "amplitude" (g, K), "sigma_T0", "sigma_q0",
      "sigma_amplitude" (1-sigma standard errors, same units) and "rms_residual" (K, sqrt(RSS / n_used)) as
      Python floats, and "n_used" (int, the number of readings used).
      Accuracy: for temperatures that follow the model exactly (no noise), T0, q0 and g within 1e-5 K,
      1e-8 W m^-2 and 1e-4 K of the generating values and rms_residual below 1e-6 K; for noisy temperatures,
      T0, q0 and g within 5e-4 K, 2e-6 W m^-2 and 2e-3 K of the exact least-squares solution of the model,
      the three standard errors within 2 % and rms_residual within 1 % (relative); n_used exact.
      Errors: ValueError if log_md and log_temp are not 1-D arrays of equal length, if any earlier step raises
      (invalid survey, layer tops or log depths beyond the last survey station, invalid conductivities,
      invalid history or kappa, heat_production negative or non-finite), if fewer than 4 readings remain after
      the cut, or if T0, q0 and g are not separately resolvable (the criterion of step 4, for example an
      all-zero hist_dT_shape).
    function_header: |-
      def surface_heat_flow(survey_md, survey_inc, survey_azi, log_md, log_temp,
                            layer_top_md, layer_k, heat_production, kappa,
                            hist_t_years, hist_dT_shape, z_min):
          """Paleoclimate-corrected surface heat flow from an inclined borehole.

          Parameters
          ----------
          survey_md, survey_inc, survey_azi : deviation survey as in step 1:
              station MD (m, first 0 at the collar, strictly increasing),
              inclination from vertical (degrees, 0 = straight down) and azimuth
              (degrees clockwise from north).
          log_md, log_temp : 1-D arrays of equal length, MD of each reading (m,
              within the survey) and its equilibrium temperature (deg C).
          layer_top_md, layer_k : MD of the top of each horizontal layer (m, first
              0, strictly increasing, within the survey; the last layer extends
              below the hole) and its conductivity (W m^-1 K^-1, > 0).
          heat_production : uniform radiogenic heat production A (W m^-3), >= 0.
          kappa : thermal diffusivity of the ground (m^2 s^-1), > 0.
          hist_t_years, hist_dT_shape : ends of the history intervals (years
              before present, positive, strictly increasing) and the surface
              departure of the unit-amplitude history during each interval (K per
              unit amplitude; the departure is g * hist_dT_shape[i]).
          z_min : readings with TVD >= z_min (m) are used, shallower ones excluded.

          Workflow
          --------
          1. TVD of every reading and every layer top (step 1).
          2. Keep readings with TVD >= z_min.
          3. R and S at the kept depths (step 2); P of the unit-amplitude history (step 3).
          4. Joint least-squares estimate of T0, q0 and g (step 4).

          Returns
          -------
          dict: "T0" (deg C), "q0" (W m^-2), "amplitude" (g, K), "sigma_T0",
          "sigma_q0", "sigma_amplitude" (1-sigma standard errors, same units),
          "rms_residual" (K, sqrt(RSS/n_used)) as Python floats, and "n_used"
          (int, number of readings used).
          Accuracy: for temperatures that follow the model exactly, T0, q0 and g
          within 1e-5 K, 1e-8 W m^-2 and 1e-4 K of the generating values and
          rms_residual below 1e-6 K; for noisy temperatures, T0, q0 and g within
          5e-4 K, 2e-6 W m^-2 and 2e-3 K of the exact least-squares solution, the
          three standard errors within 2 % and rms_residual within 1 % (relative);
          n_used exact.

          Raises
          ------
          ValueError if log_md and log_temp are not 1-D of equal length, if any
          earlier step raises (invalid survey, layer tops or log depths beyond the
          last survey station, invalid conductivities, history or kappa,
          heat_production negative or non-finite), if fewer than 4 readings remain
          after the z_min cut, or if T0, q0 and g are not separately resolvable
          (criterion of step 4, e.g. an all-zero hist_dT_shape).
          """
    return_line: "    return result"
    step_background: |-
      On the Canadian Shield most heat-flow determinations come from inclined mineral-exploration
      diamond-drill holes left to re-equilibrate after drilling (Jessop et al. 1984; Mareschal and Jaupart
      2004). Producing a heat-flow value takes three corrections: depth along the hole to vertical depth,
      thermal resistance through the layered column, and removal of the paleoclimatic transient. Readings
      shallower than a cut-off depth are excluded because recent warming and ground-water circulation in
      fractured near-surface rock disturb them. Ignoring the glacial correction underestimates the heat flow
      of holes shallower than about 1 km by several mW m^-2.
    n_test_cases: 7
    contract:
      quantity: "Paleoclimate-corrected steady surface heat flow q0, reference surface temperature T0 and glacial amplitude g of an inclined borehole, with their 1-sigma standard errors, the rms residual and the number of readings used."
      assumptions: "Minimum-curvature trajectory; horizontal layers logged in MD; one-dimensional conduction with uniform heat production; half-space paleoclimate perturbation with diffusivity kappa; ordinary least squares with noise variance RSS/(n_used - 3) on the readings with TVD >= z_min."
      result_kind: exact
      valid_input_ranges: "Survey, layers and history as in steps 1-3 with layer tops and log depths within the survey; heat_production finite and >= 0; at least 4 readings with TVD >= z_min and a resolvable design; holes up to a few km with inclinations below 90 degrees."
      units: "T0 in deg C, q0 in W m^-2, g in K, standard errors in the same units, rms_residual in K, n_used dimensionless."
      output_shape: "dict with seven Python floats (T0, q0, amplitude, sigma_T0, sigma_q0, sigma_amplitude, rms_residual) and the int n_used."
      step_dependencies: [1, 2, 3, 4]
    mutants:
      - name: measured_depth_as_depth
        description: "Measured depth along the inclined hole used as depth (no trajectory correction) for the readings and the layer tops."
        file: mutants/step_6_measured_depth_as_depth.py
      - name: no_paleoclimate_correction
        description: "Paleoclimate term omitted: T0 and q0 fitted to a steady geotherm only (amplitude reported as 0)."
        file: mutants/step_6_no_paleoclimate_correction.py
      - name: single_mean_conductivity
        description: "Layered column replaced by one layer with the arithmetic mean conductivity."
        file: mutants/step_6_single_mean_conductivity.py
      - name: z_min_on_measured_depth
        description: "Shallow-reading cut applied to measured depth instead of true vertical depth."
        file: mutants/step_6_z_min_on_measured_depth.py
