      sigma_amplitude: 1-sigma of amplitude
      rms_residual: sqrt(RSS/n_used) of the fit, K
      n_used: number of readings used (int)
  conventions:
  - Depth z is true vertical depth (TVD, m, positive down) below the collar; collar elevation is the datum. The
    borehole path between survey stations is the minimum-curvature arc (constant-rate rotation of the unit tangent
    on the great circle joining the station directions); TVD at any measured depth, including between stations,
    is taken on that arc.
  - Layer boundaries are given in measured depth along the hole and are horizontal; convert them to TVD with the
    same trajectory.
  - 'Steady conduction with uniform heat production A in the layered column: the heat flow is q(z) = q0 - A z and
    dT/dz = q/k, so T_ss(z) = T0 + q0 R(z) - A S(z) with R(0) = S(0) = 0.'
  - 'Transient paleoclimate signal: the surface temperature departed from T0 by g * hist_dT_shape[i] during interval
    i (interval 0 is [0, hist_t_years[0]] years before present, interval i is [hist_t_years[i-1], hist_t_years[i]]),
    and was at T0 before hist_t_years[-1] long enough for steady state. The present-day perturbation is computed
    for a homogeneous half-space with diffusivity kappa. One year = 365.25 days.'
  - 'Observation model: T_obs(z) = T0 + q0 R(z) - A S(z) + g P(z) + noise, where P is the perturbation of the unit-amplitude
    history. T0, q0 and g are estimated jointly by ordinary (unweighted) least squares; their 1-sigma standard errors
    use the noise variance RSS/(n_used - 3).'
  - Only readings with TVD >= z_min are used (the shallow part of logs is affected by recent climate and ground-water
    flow).
  assumptions_and_ranges:
  - Conduction only, horizontal layering, 1-D heat flow; the ground is laterally homogeneous.
  - Holes up to a few km, inclinations below 90 degrees, temperatures 0-80 deg C.
  errors:
  - Raise ValueError if log_md and log_temp are not 1-D arrays of equal length; if any survey, layer or history
    input violates the ranges of steps 1-3 (including layer tops or log depths beyond the last survey station);
    if heat_production is negative or non-finite; if fewer than 4 readings remain after the z_min cut; or if T0,
    q0 and the amplitude are not separately resolvable (for example an all-zero hist_dT_shape).
  accuracy_and_tolerances:
  - The estimator is deterministic; the result is exact up to numerical precision.
  - For a noise-free synthetic hole q0 must be reproduced within 1e-8 W m^-2, T0 within 1e-5 K and g within 1e-4
    K.
  - For noisy holes q0 must agree with the exact least-squares solution within 2e-6 W m^-2, T0 within 5e-4 K, g
    within 2e-3 K; the three sigmas within 2 % and rms_residual within 1 %; n_used exactly.
  exactness: exact (deterministic least squares on closed-form model terms)
