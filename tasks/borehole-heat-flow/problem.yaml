  name: Bullard thermal resistance and heat-production integral
  function: layer_integrals(layer_top_tvd, layer_k, z)
  description: |
    A column of horizontal layers has a constant thermal conductivity k_i (W m^-1 K^-1) inside each layer. The top of layer i is at depth z_i (m): the first top is 0, the tops increase strictly, and the last layer extends to infinite depth.
    In steady one-dimensional conduction with a uniform radiogenic heat production A (W m^-3), the upward heat flow decreases with depth as q(z) = q0 - A z, where q0 is the surface heat flow, and Fourier's law gives dT/dz = q(z) / k(z), with T(0) = T0. The steady temperature can therefore be written as T(z) = T0 + q0 R(z) - A S(z), where R(z) (thermal resistance, m^2 K W^-1) and S(z) (m^3 K W^-1) depend only on the conductivity column and are zero at z = 0. Return R(z) and S(z) at each requested depth z (m) for the given layers.
    Returns: tuple (R, S); floats for a scalar z, otherwise numpy arrays with the shape of z. Relative accuracy: 1e-9.
    Errors: ValueError if the layer arrays are not 1-D of equal length, any top is non-finite, the first top is not 0 or tops do not increase strictly, any conductivity is non-finite or <= 0, or any depth is non-finite or negative.
  depends_on: []
