  name: Paleoclimate perturbation in a layered conductivity column
  function: layered_paleoclimate_perturbation(z, layer_tops, layer_k, rho_c, t_years, dT)
  description: 'The half-space formula of step 3 gives the whole ground one diffusivity. In the borehole the conductivity changes from layer to layer (the column of layer_integrals, step 2: tops in m, the first at 0, the last layer extending to infinite depth), and with a uniform volumetric heat capacity rho_c (J m^-3 K^-1) layer i has the diffusivity kappa_i = k_i / rho_c. Return the present-day departure (K) of the temperature from the steady state at depths z (m) in this layered ground for a piecewise-constant surface history with the convention of step 3: interval 0 runs from the present back to t_years[0], interval i from t_years[i-1] back to t_years[i] (years before present, 1 year = 365.25 x 86400 s); dT[i] is the surface departure during interval i, and before t_years[-1] the departure was zero at all depths.

    In every layer the departure theta obeys rho_c d(theta)/dt = d/dz (k d(theta)/dz); theta and the heat flux k d(theta)/dz are continuous at every layer top, theta at z = 0 equals the surface departure, and theta vanishes at infinite depth. At z = 0 the result is dT[0].

    Returns: float for a scalar z, otherwise a numpy array with the shape of z. Absolute accuracy: 1e-8 K per kelvin of the largest |dT[i]|, at every depth and for every history, layering and conductivity contrast. Each call must finish within 10 s on one CPU core for up to 1000 depths, 50 layers and 20 history intervals.

    Errors: ValueError if the layer arrays are not 1-D of equal length with at least one layer, any top is non-finite, the first top is not 0 or the tops do not increase strictly, any conductivity is non-finite or <= 0, rho_c is non-finite or <= 0, t_years and dT are not 1-D of equal length, contain a non-finite value, t_years[0] <= 0 or t_years does not increase strictly, or any depth is non-finite or negative.

    '
  depends_on: []
  function_header: "def layered_paleoclimate_perturbation(z, layer_tops, layer_k, rho_c, t_years, dT):\n    \"\"\"Present-day temperature perturbation (K) at depth z in a layered column.\n\n    History convention as in paleoclimate_perturbation (step 3). The ground\n    is a column of horizontal layers (tops layer_tops, the first at 0, the\n    last layer extending to infinite depth) with conductivities layer_k and a\n    uniform volumetric heat capacity rho_c; temperature and heat flux are\n    continuous at the layer tops.\n\n    Parameters\n    ----------\n    z : float or array_like, depth (m) >= 0.\n    layer_tops : 1-D array_like, layer tops (m), first 0, strictly increasing.\n    layer_k : 1-D array_like, same length, conductivities (W m^-1 K^-1) > 0.\n    rho_c : float, volumetric heat capacity (J m^-3 K^-1) > 0.\n    t_years : 1-D array_like, positive, strictly increasing ends of the\n        history intervals (years before present).\n    dT : 1-D array_like, same length, departure during each interval (K).\n\n    Returns\n    -------\n    float for scalar z, else ndarray with the shape of z. Absolute accuracy\n    1e-8 K per kelvin of the largest |dT|; within 10 s for up to 1000 depths,\n    50 layers and 20 history intervals.\n\n    Raises\n    ------\n    ValueError for invalid layers (not 1-D of equal length, first top not 0,\n    tops not strictly increasing, non-finite or non-positive conductivity),\n    rho_c non-finite or <= 0, an invalid history (as in step 3), or a depth\n    that is non-finite or negative.\n    \"\"\"\n"
  return_line: '    return dT_z'
  step_description_prompt: 'The half-space formula of step 3 gives the whole ground one diffusivity. In the borehole the conductivity changes from layer to layer (the column of layer_integrals, step 2: tops in m, the first at 0, the last layer extending to infinite depth), and with a uniform volumetric heat capacity rho_c (J m^-3 K^-1) layer i has the diffusivity kappa_i = k_i / rho_c. Return the present-day departure (K) of the temperature from the steady state at depths z (m) in this layered ground for a piecewise-constant surface history with the convention of step 3: interval 0 runs from the present back to t_years[0], interval i from t_years[i-1] back to t_years[i] (years before present, 1 year = 365.25 x 86400 s); dT[i] is the surface departure during interval i, and before t_years[-1] the departure was zero at all depths.

    In every layer the departure theta obeys rho_c d(theta)/dt = d/dz (k d(theta)/dz); theta and the heat flux k d(theta)/dz are continuous at every layer top, theta at z = 0 equals the surface departure, and theta vanishes at infinite depth. At z = 0 the result is dT[0].

    Returns: float for a scalar z, otherwise a numpy array with the shape of z. Absolute accuracy: 1e-8 K per kelvin of the largest |dT[i]|, at every depth and for every history, layering and conductivity contrast. Each call must finish within 10 s on one CPU core for up to 1000 depths, 50 layers and 20 history intervals.

    Errors: ValueError if the layer arrays are not 1-D of equal length with at least one layer, any top is non-finite, the first top is not 0 or the tops do not increase strictly, any conductivity is non-finite or <= 0, rho_c is non-finite or <= 0, t_years and dT are not 1-D of equal length, contain a non-finite value, t_years[0] <= 0 or t_years does not increase strictly, or any depth is non-finite or negative.

    '
  step_background: 'For a single homogeneous half-space the response to a step change of the surface temperature is the error function complement (Birch 1948). Real Shield columns alternate volcanics, intrusions and metasediments with conductivities from about 2 to 5 W m^-1 K^-1, and the glacial signal is refracted at each contrast: the diffusion is faster in conductive layers, and the heat flux, not the temperature gradient, is continuous across an interface (Carslaw and Jaeger 1959, ch. 12, give the image series for a layer over a half-space). Paleoclimate corrections in layered ground therefore differ from the half-space formula by up to tens of percent near strong contrasts (Beck 1977; Clauser 1984).

    '
  inputs:
