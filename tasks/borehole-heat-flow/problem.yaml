    layer_tops: layer tops (m), first 0, strictly increasing
    layer_k: conductivities (W m^-1 K^-1) > 0
    rho_c: volumetric heat capacity (J m^-3 K^-1) > 0
    t_years: interval ends (years before present), positive, strictly increasing
