# problem.yaml: one per task folder. File paths are relative to this folder.

domain: physics

metadata:
  author_name: "Ayoub Bousfiha"
  author_email: "iyoury.ab@gmail.com"
  author_organization: "Independent Researcher"
  relevant_experience: "B.Sc. in Georesources and Environment (FST Fes, 2016), known as Geological Engineering in Canada, and a graduate certificate in geomatics from Université Laval (reference frames, rotations, least-squares adjustment). GIS analyst at Morocco's Ministry of Energy and Mines (2016-2018) on exploration databases, and now running an independent geospatial consultancy (Craton Géodonnées) in Quebec that works with the drilling databases of Abitibi exploration programs."
  subfield: "Geothermics: regional borehole paleoclimate inversion, layered transient conduction, maximum likelihood, AR(1) noise"
  tags:
    - heat flow
    - borehole temperature
    - paleoclimate
    - deglaciation timing
    - minimum curvature
    - thermal conductivity
    - maximum likelihood
    - Fisher information
    - likelihood-ratio interval
    - autoregressive noise
    - exact likelihood
    - inverse Laplace transform
    - Canadian Shield
  expert_time_estimate_hours: 22
  difficulty_explanation: >-
    The final step is a regional maximum-likelihood inverse problem of borehole paleoclimatology with serially
    correlated noise. Several boreholes share the glacial amplitude g and the time t_end at which the last
    glaciation ended; each hole has its own steady geotherm (T0, q0), layered column (the step 5 perturbation with
    its own volumetric heat capacity), cut-off depth and log noise, a stationary AR(1) sequence along its readings
    ordered by measured depth with unknown lag-one correlation phi and innovation standard deviation s. The prompt
    states the model and the definitions of the estimators, not the likelihood formula or an algorithm. The agent
    has to derive the exact AR(1) likelihood (stationary variance of the first reading, hence the log-determinant
    term (1/2) log(1 - phi^2)), order the readings by MD (one test log is listed as two logging runs and a whole-
    task check permutes a log), concentrate over T0, q0 and s, maximize jointly over g, every phi and t_end,
    globally in t_end (a local search ends in the wrong basin in two test regions, and in one of them the statistic
    falls below the quantile again outside the nearest-crossing interval), form the expected Fisher information with
    the correlated covariance, bound the likelihood-ratio interval with phi and s re-maximized at every t_end under
    the stated end-point and containment rules, and report the exact log-likelihood with its constants. Plausible
    shortcuts fail measurably: independent errors (g 42 % off in the strongly correlated region), the conditional
    likelihood (g 7.5 becomes 6.19 in the hole with phi = 0.9 and 37 readings), the likelihood without the log-
    determinant term, two-stage or pooled noise parameters, readings in input order, independent-error or observed
    information, and phi or s held fixed in the profile. Step 6 is the single-hole least-squares version (joint Wald
    covariance with n_used - 4 degrees of freedom, F-calibrated profile interval). The earlier steps hide the
    standard mistakes of heat-flow work: exact minimum-curvature TVD between stations and for tiny doglegs, series
    (harmonic) thermal resistance, times in seconds and the factor 2 in the erfc argument, the unbiased residual
    variance with a resolvability test, and an exact, overflow-free Laplace-domain layered solution with an accurate
    inversion (double-precision Gaver-Stehfest errs by 2e-6 to 7e-6 K per K and erfc with a mean or local
    diffusivity by 0.04 to 0.3 K per K, against the required 1e-8 K per K).
  solution_explanation: >-
    Step 1 accumulates the closed-form minimum-curvature increments 0.5 dMD (cos I1 + cos I2) RF(beta), with the
    dogleg from atan2(|t1 x t2|, t1 . t2) and the ratio factor tan(beta/2)/(beta/2) from its Taylor series for small
    half-angles; a point inside a segment uses the great-circle tangent written with sinc functions. Step 2 sums the
    exact layer terms (b - a)/k and (b - a)(b + a)/(2k). Step 3 superposes differences of erfc step responses with
    times in seconds (Julian year). Step 4 checks resolvability with the singular values of the column-normalized
    [1, R, P], solves for y = T + A S and takes the covariance s^2 (G^T G)^-1 with s^2 = RSS/(n - 3). Step 5
    Laplace-transforms the layered problem (a e^{-qz} + b e^{qz} per layer, q = sqrt(s/kappa_i)), carries the
    admittance k F'/F up from the bottom half-space with a tanh recursion, assembles F in logarithms from e^{-2qh}
    factors only and inverts F/s on a fixed 32-node Talbot contour (Abate and Valko 2004). Step 6 converts the
    readings and layer tops to TVD, applies the inclusive z_min cut and writes P(z; t) = P_fix(z) + (s_0 - s_1) U(z,
    t), so that RSS(t) is linear least squares on [1, R, P(t)] (variable projection); a 121-point logarithmic scan
    with bounded Brent refinement of every grid minimum (end cells included) and a Gauss-Newton polish gives the
    global minimum; dP/dt_end comes from a fourth-order central difference; the Wald covariance is s^2 (J^T J)^-1
    with J = [1, R, P, g dP/dt_end] and s^2 = RSS_min/(n - 4); the interval ends at RSS_min (1 + F_0.95(1, n - 4)/(n
    - 4)) are bracketed outward and located with Brent's method. Step 7 orders the used readings of every hole by
    MD. With the Prais-Winsten matrix L(phi) (det L = sqrt(1 - phi^2)) a hole contributes -(n/2) log(2 pi s^2) +
    (1/2) log(1 - phi^2) - |L r|^2/(2 s^2), whose maximum over T0, q0 and s is -(n/2)(log(2 pi Q/n) + 1) + (1/2)
    log(1 - phi^2), Q the generalized least-squares residual on [1, R], quadratic in g with coefficients from a 4 x
    4 Gram matrix that is a quadratic polynomial in phi. The profile in g (every phi on a 399-point grid refined by
    bounded Brent) and l_p(t) (121 logarithmic times, Brent refinement, end cells included) are maximized globally;
    T0 and q0 are the generalized least-squares values and s^2 = |L r|^2/n; the expected information sum_h J_h^T
    L_h^T L_h J_h / s_h^2 is inverted after diagonal scaling (dP/dt_end by a fourth-order central difference with
    step 1e-2 t_end); the interval ends where l_p = l_max - chi2.ppf(0.95, 1)/2 are bracketed outward and located
    with Brent's method.
  verification_explanation: >-
    Targets of steps 1-5 come from closed forms (straight and constant-build holes, a constant-azimuth segment with
    inclination linear in MD, hand-computed layer sums, R = z/k1 and S = z^2/(2 k1) at shallow depths under a deep
    stack, erfc forms with math.erfc down to centimetre depths, the Carslaw-Jaeger image series for a layer over a
    half-space), from independent computations in the tests (adaptive quadrature of the arc tangent and of 1/k and
    z/k, numpy.linalg.lstsq) and from mpmath values stored inline for three multilayer columns (90-digit transfer-
    matrix transforms with mpmath's Talbot inversion; the 50-layer column at 270 to 390 digits with Talbot and
    Gaver-Stehfest inversion). Steps 6 and 7 build every borehole forward (64-point Gauss-Legendre TVD, exact layer
    sums) and take P and dP/dt_end from an oracle shared with neither solution, the branch-cut (real-axis) form of
    the Laplace inversion of the layered column with real transfer matrices, which reproduces the stored 90-digit
    values to 9e-16 K and erfc to 7e-16 (a uniform column uses math.erfc). Step 6 data are the model at the
    generating T0, q0, g, t_end plus a seeded residual orthogonal to the Jacobian [1, R, P, g dP/dt_end], so these
    values are the exact least-squares solution with RSS_min = |r|^2; the Wald errors follow from the oracle
    Jacobian, the F quantile from the Student t density, and the interval ends are the oracle profile's nearest
    crossings. Step 7 data are built in whitened space, u_h = L(phi_h) r_h = b_h + c_h, with b_h orthogonal to the
    whitened oracle Jacobian and turned on its sphere until the phi_h score vanishes and c_h closing the shared
    scores, so that every score of the exact log-likelihood vanishes at the generating values (central differences:
    below 6e-9 standard deviations); dense scans of the oracle profile (600 logarithmic times over the bounds of
    every region and 101 near t_end, a grid over g and every phi, then a Newton polish) find no value above l_max
    (largest excess 5.5e-12). The standard errors come from the expected information of the whitened oracle
    Jacobians, l_max from the generating residuals, the chi-square quantile from math.erf; the interval ends are
    checked on the oracle profile (maximum over g on a 4001-point grid between the holes' own optima refined by
    bounded Brent, over the phi_h by Nelder-Mead from the nearest solved t): a threshold crossing lies within a
    relative 5e-4 of each returned end and the profile stays above the threshold at 5 interior points on each side.
    The cases cover several regimes and log qualities, short glaciations with a second profile maximum, uniform
    columns with the collar reading at z_min = 0, end-point maxima with near-boundary valid controls, uncontained
    intervals, a log listed as two runs, the smallest valid hole with 33 invalid inputs, a strongly correlated log
    (phi = 0.9) and, in the whole-task cases, offset, hole-order and reading-order invariances and a region whose
    statistic falls below the quantile again outside the interval. The second solution uses different methods
    throughout (circular-arc TVD, ramp sums and integration by parts for R and S, Duhamel quadrature, QR least
    squares, one global linear system per node with the Weideman-Trefethen contour, Levenberg-Marquardt for step 6,
    the innovations decomposition with Fisher scoring for step 7), copies no test oracle and passes every case. The
    tolerances of steps 6 and 7 come from error budgets: with P in error by 1e-8 K per K (smooth, irregular, or
    aligned with the residual sign), the TVD by 1e-6 m and R, S by a relative 1e-9, the reference stays within a
    third of every step 6 limit (half at rms_residual = 1e-4 K) and within 0.61 of every step 7 limit on the test
    regions (0.72 of the log-likelihood limit for the aligned pattern on the precise region, 0.77 on regions rebuilt
    at the ends of the domain); errors smooth in depth stay below 0.023 of every limit, while the aligned pattern is
    adversarial and was measured on these regions only. Along the amplitude-timing ridge of the short-glaciation
    regions the g limit binds before the t_end limit (effective t_end accuracy about 1e-3), so the limits are
    justified by the combined budget. With exact inputs the reference reaches at most 3.2e-3 of a step 6 limit and
    0.014 of a step 7 limit, the second solution 3.2e-4 and 0.006. Named mutants (linear TVD between stations;
    arithmetic-mean conductivity; years not converted; heat-production sign; erfc with the mean diffusivity and
    Gaver-Stehfest in double precision; for step 6 the half-space perturbation, standard errors without the t_end
    column and a local search without scan; for step 7 independent errors and the conditional likelihood; whole-task
    MD as depth and independent errors) each fail at least one case of their target tests. Every case was run alone
    in a fresh process with tools/crown_check.py for the references, solution.py, the second solution, the mutants,
    the all-None and all-zero controls (no case passes) and every reference output scaled by 1 +- 1e-12 (all cases
    pass).

required_dependencies: |-
  import numpy as np
  import math
  from scipy.integrate import quad
  from scipy import stats
  from scipy.optimize import brentq, minimize_scalar
problem_description_main: |-
  Exploration diamond-drill holes in one region of the Canadian Shield have been logged for temperature after
  thermal re-equilibration. From each hole's deviation survey, its lithology-based conductivity column, its known
  uniform radiogenic heat production and volumetric heat capacity, and the shape of the last-glacial
  ground-surface temperature history common to the region, estimate the time t_end at which the last glaciation
  ended and the glacial amplitude g, together with the steady-state surface heat flow q0, the reference surface
  temperature T0 and the noise parameters of every log, with standard errors and a likelihood-ratio 95 % interval
  for t_end.

  Conventions used throughout. Depth z is true vertical depth (TVD, m, positive down) below the collar. The
  borehole path between survey stations is the minimum-curvature arc (constant-rate rotation of the unit
  tangent on the great circle joining the station directions), and the TVD at any measured depth (MD) along
  the hole, including between stations, is taken on that arc. Layer boundaries are horizontal and are logged
  in MD along the hole; their depth is the TVD of the contact. Heat transport is one-dimensional conduction in
  a laterally homogeneous ground: with a uniform heat production A the heat flow is q(z) = q0 - A z and
  dT/dz = q(z) / k(z), so the steady geotherm is T_ss(z) = T0 + q0 R(z) - A S(z) with R(0) = S(0) = 0. The
  transient paleoclimate signal comes from a piecewise-constant ground-surface history: interval 0 runs from
  the present back to t_years[0], interval i from t_years[i-1] back to t_years[i] (years before present,
  1 year = 365.25 x 86400 s); during interval i the surface departed from T0 by g times the shape value of the
  interval, and before the last interval end the ground was in steady state. The observation model of a hole is
  T_obs = T0 + q0 R - A S + g P + noise, where P is the present-day perturbation of the unit-amplitude
  history, using only the readings with TVD >= z_min.

  Steps 1-4 build the pieces: TVD by minimum curvature (step 1), the depth functions R and S of the layered
  column (step 2), the classical half-space paleoclimate perturbation (step 3) and the joint least-squares
  estimate of T0, q0 and g for a given P (step 4). Step 5 computes the paleoclimate perturbation in the layered
  conductivity column itself, where the glacial signal is refracted at every conductivity contrast. Step 6
  (deglaciation_heat_flow_inversion) inverts one log for T0, q0, g and the end of the glaciation t_end by
  nonlinear least squares, with Wald standard errors and the profile-likelihood interval of t_end. Step 7
  (regional_deglaciation_inversion) is the top-level function of the task: it combines several holes that share g
  and t_end but differ in geotherm, column and log quality, by maximum likelihood with serially correlated
  (first-order autoregressive) noise of unknown parameters in every hole, and reports the standard errors from the
  expected Fisher information and the likelihood-ratio interval of t_end.
problem_io: |-
  def regional_deglaciation_inversion(holes, hist_t_years, hist_dT_shape, t_end_bounds):
      """Regional maximum-likelihood estimate of the glacial amplitude g and the end of the glaciation t_end
      with serially correlated (AR(1)) noise in every log.

      Parameters
      ----------
      holes : list of H >= 2 dicts, one per borehole, each with exactly the keys
          "survey_md", "survey_inc", "survey_azi", "log_md", "log_temp",
          "layer_top_md", "layer_k", "heat_production", "rho_c" and "z_min",
          with the meanings, units and rules of the arguments of the same names
          of deglaciation_heat_flow_inversion (step 6); log_md need not be sorted.
      hist_t_years, hist_dT_shape, t_end_bounds : the glacial history of step 6,
          shared by every hole: the m - 1 known interval ends (years before
          present, positive, strictly increasing), the m >= 2 shape values
          s_0 ... s_(m-1) (K per unit amplitude) and (t_lo, t_hi) in years with
          0 < t_lo < t_hi < hist_t_years[0].

      Model: in hole h the readings with TVD z >= z_min_h, numbered i = 1 ... n_h
      by increasing MD (readings at equal MD in input order), obey
      T = T0_h + q0_h R_h(z) - A_h S_h(z) + g P_h(z; t_end)
      + e_i, with P_h(z; t_end) = layered_paleoclimate_perturbation(z, the hole's
      layer tops in TVD, its layer_k, its rho_c, [t_end, *hist_t_years],
      hist_dT_shape) (step 5). The errors are a stationary Gaussian AR(1)
      sequence in i: e_1 ~ N(0, s_h^2 / (1 - phi_h^2)), e_i = phi_h e_(i-1) + w_i
      with independent w_i ~ N(0, s_h^2); phi_h (|phi_h| < 1) and s_h > 0 are
      unknown, the holes independent. Every parameter is estimated by maximum
      likelihood (exact joint density of all used readings, the first reading of
      every hole included); t_end is the global maximizer over [t_lo, t_hi] of
      the profile log-likelihood l_p(t) (maximum over all other parameters at
      t_end = t, g over the whole real line) and l_max = l_p(t_end).

      Returns
      -------
      dict: "g" (K), "t_end" (years), "sigma_g", "sigma_t_end" (standard errors:
      square roots of the diagonal of the inverse of the expected Fisher
      information of the regression parameters T0_h, q0_h, g, t_end at the
      estimates, phi_h and s_h held at their estimates; t_end in years),
      "t_end_low", "t_end_high" (years: points nearest to t_end below and above
      it where 2 (l_max - l_p(t)) = scipy.stats.chi2.ppf(0.95, 1)) and
      "log_likelihood" (l_max, natural logarithm of the joint normal density of
      all used readings) as Python floats, and "holes": a list, in the input
      order, of dicts with "T0" (deg C), "q0" (W m^-2), "sigma_T0", "sigma_q0"
      (standard errors), "phi" (maximum-likelihood phi_h), "innovation_sd"
      (maximum-likelihood s_h, K) as Python floats and "n_used" (int, readings
      used in the hole).
      Domain: at least 8 used readings per hole; maximum-likelihood s_h from
      1e-3 K to 0.03 K and phi_h from -0.9 to 0.95 in every hole.
      Accuracy: g and t_end within a relative 2e-3; every q0 within a relative
      5e-4; every T0 within 2e-3 K; the standard errors within a relative 1e-2;
      t_end_low and t_end_high within a relative 5e-4; every phi within 2e-3;
      every innovation_sd within a relative 3e-3; log_likelihood within 0.1;
      n_used exact. These limits include the errors propagated from the stated
      accuracies of steps 1, 2 and 5.

      Raises
      ------
      ValueError if holes is not a list or tuple of at least 2 dicts with exactly
      these keys; for a hole with log arrays that are not 1-D of equal length, a
      non-finite temperature, a negative or non-finite heat production, any error
      of an earlier step, fewer than 8 readings with TVD >= z_min, or T0_h and
      q0_h not separately resolvable (smallest singular value of the n_h x 2
      matrix [1, R_h] with unit-length columns below 1e-8); for an invalid
      history or invalid bounds (rules of step 6, including hist_dT_shape[0] ==
      hist_dT_shape[1]); if the maximum of l_p over [t_lo, t_hi] is attained at
      t_lo or t_hi; or if a nearest crossing does not exist inside [t_lo, t_hi].
      """
general_tests: tests/general.py

second_solution: second_solution.py

