# problem.yaml: one per task folder. File paths are relative to this folder.

domain: earth

subfield: "Geothermics: regional borehole paleoclimate inversion, layered transient conduction, maximum likelihood, AR(1) noise"

tags:
  - heat flow
  - borehole temperature
  - paleoclimate
  - deglaciation timing
  - minimum curvature
  - thermal conductivity
  - maximum likelihood
  - Fisher information
  - likelihood-ratio interval
  - autoregressive noise
  - exact likelihood
  - inverse Laplace transform
  - Canadian Shield

expert_time_estimate_hours: 22

relevant_experience: "B.Sc. in Georesources and Environment (FST Fes, 2016), known as Geological Engineering in Canada, and a graduate certificate in geomatics from Université Laval (reference frames, rotations, least-squares adjustment). GIS analyst at Morocco's Ministry of Energy and Mines (2016-2018) on exploration databases, and now running an independent geospatial consultancy (Craton Géodonnées) in Quebec that works with the drilling databases of Abitibi exploration programs."

author: "Ayoub Bousfiha"
affiliation: "Independent Researcher"

difficulty_explanation: >-
  The final step is a regional maximum-likelihood inverse problem of borehole paleoclimatology with serially correlated
  noise: several boreholes share the glacial amplitude g and the time t_end at which the last glaciation ended, while
  every hole has its own steady geotherm (T0, q0), its own layered column (the step 5 perturbation with its own
  volumetric heat capacity), its own cut-off depth and its own log noise, a stationary first-order autoregressive
  (AR(1)) sequence along its readings ordered by measured depth with an unknown lag-one correlation phi and innovation
  standard deviation s, so every likelihood evaluation needs the layered Laplace-domain solution in every hole. The
  prompt states the statistical model and the definitions of the estimators, not the likelihood formula or an algorithm.
  The agent has to derive the exact likelihood of the AR(1) model (the stationary variance s^2/(1 - phi^2) of the first
  reading, which brings the log-determinant term (1/2) log(1 - phi^2), and the decorrelation of the following readings),
  order the readings by MD (one test log is listed as two logging runs, down then up, and a whole-task check permutes a
  log), concentrate the likelihood over T0, q0 and s, and maximize jointly over g, every phi and t_end, globally in
  t_end on a profile that can have a second maximum (a local search over the bounds ends in the wrong basin in two test
  regions, and in one of them the statistic falls below the quantile again around the second maximum, a region that the
  nearest-crossing rule leaves out of the interval); form the expected Fisher information with the correlated
  covariance; bound the likelihood-ratio interval with phi and s re-maximized at every t_end, with the stated rules for
  an end-point maximum (precise logs with the maximum 77 years inside either bound, where the end value is higher than
  the nearest points of a 121-point scan, must return the estimate) or an interval not contained in the bounds; and
  report the exact log-likelihood with its normalizing constants. Plausible shortcuts fail measurably on the test
  regions: independent errors (the previous estimator; g 42 % off in the strongly correlated region), the conditional
  likelihood that drops the first reading (in the test hole with phi = 0.9 and 37 readings it moves g from 7.5 to 6.19),
  the exact likelihood without the log-determinant term (g 0.8 % and phi 0.023 off there), phi from the lag-one
  autocorrelation of independent-error residuals, noise parameters taken from single-hole fits, one common noise model
  for all holes, readings left in the input order, independent-error information with the AR(1) variance (standard
  errors of g 15 to 58 % too small), the observed information, |u|^2/(n - 2) or separately inverted blocks in the
  information, and phi alone or phi and s held at their estimates in the likelihood-ratio profile. Step 6 is the
  single-hole least-squares version, with the joint Wald covariance (n_used - 4 degrees of freedom) and the F-calibrated
  profile interval. The earlier steps hide the standard mistakes of heat-flow work: the minimum-curvature true vertical
  depth must be exact between stations and for tiny doglegs on long segments, the thermal resistance of a layered column
  is a harmonic and not an arithmetic average, the half-space perturbation needs times in seconds and the factor 2 in
  the erfc argument, the joint fit of T0, q0 and g needs the unbiased residual variance and a stated resolvability test,
  and the layered perturbation (step 5) needs an exact Laplace-domain solution written without overflow or cancellation
  and an accurate numerical inversion: Gaver-Stehfest inversion in double precision (errors of 2e-6 to 7e-6 K per K in
  the test columns) and erfc responses with a mean or local diffusivity (0.04 to 0.3 K per K) miss the required 1e-8 K
  per K by orders of magnitude.
solution_explanation: >-
  Step 1 accumulates the closed-form minimum-curvature increments 0.5 dMD (cos I1 + cos I2) RF(beta), with the dogleg
  from atan2(|t1 x t2|, t1 . t2) and the ratio factor tan(beta/2)/(beta/2) from its Taylor series for small
  half-angles; a point inside a segment uses the great-circle tangent written with sinc functions and the ratio factor
  of the partial arc. Step 2 sums the exact layer contributions (b - a)/k and (b - a)(b + a)/(2k), factored so that
  the layers below z add exactly zero. Step 3 superposes differences of erfc step responses with times converted with
  the Julian year. Step 4 checks resolvability with the singular values of the column-normalized design [1, R, P],
  solves the normal equations for y = T + A S and takes the covariance s^2 (G^T G)^-1 with s^2 = RSS/(n - 3). Step 5
  Laplace-transforms the layered problem: in each layer the transform is a e^{-qz} + b e^{qz} with q =
  sqrt(s/kappa_i), the admittance k F'/F is carried up from the bottom half-space with a tanh recursion, F is
  assembled in logarithms from e^{-2qh} factors only, F/s is inverted on a fixed 32-node Talbot contour (Abate and
  Valko 2004) and the step responses of the history are superposed. Step 6 converts the readings and the layer tops to
  TVD, applies the inclusive z_min cut and evaluates R and S; it writes P(z; t) = P_fix(z) + (s_0 - s_1) U(z, t), with
  U the layered step response (step 5 with a one-interval history) and P_fix the history with intervals 0 and 1
  merged, so that the profile RSS(t) is the linear least squares of y = T + A S on [1, R, P(t)] (variable projection);
  a 121-point logarithmic scan with bounded Brent refinement of every grid minimum (over the end cell for an end value
  not above its neighbour, where the minimum can still be interior) and a Gauss-Newton polish gives the global
  minimum, dP/dt_end comes from a fourth-order central difference with step 1e-3 t, the Wald covariance is s^2 (J^T
  J)^-1 with J = [1, R, P, g dP/dt_end] and s^2 = RSS_min/(n - 4), and the interval ends at the threshold RSS_min (1 +
  F_0.95(1, n - 4)/(n - 4)) are bracketed outward from the estimate and located with Brent's root finder. Step 7
  prepares every hole in the same way and orders its used readings by MD. With L(phi) the Prais-Winsten matrix (first
  row sqrt(1 - phi^2) e_1, then e_i - phi e_(i-1)) the AR(1) covariance is s^2 (L^T L)^-1 with det L = sqrt(1 -
  phi^2), so a hole contributes -(n/2) log(2 pi s^2) + (1/2) log(1 - phi^2) - |L r|^2/(2 s^2); its maximum over T0, q0
  and s at fixed (g, phi, t) is -(n/2)(log(2 pi Q/n) + 1) + (1/2) log(1 - phi^2), with Q the generalized least-squares
  residual of the hole on [1, R], a quadratic in g whose coefficients are Schur complements of the 4 x 4 Gram matrix
  of L[q1, q2, y_c, P_perp] (q1, q2 orthonormal on [1, R]; y and P projected off it, y centred by the hole's own
  least-squares amplitude); every Gram entry is a quadratic polynomial in phi (C0 - phi C1 + phi^2 C2), so Q costs
  O(1) per phi. At fixed t the stationary points in g lie between the extreme holes' own amplitudes over phi; the
  profile in g, every phi maximized on a 399-point grid, is scanned on a grid refined around every hole's optimum, and
  every grid maximum is refined by bounded Brent in g with each phi refined by bounded Brent around its best grid
  point. l_p is scanned at 121 logarithmically spaced times and every grid maximum is refined with bounded Brent (an
  end value not below its neighbour over the end cell); T0 and q0 are the generalized least-squares values at the
  estimate and s^2 = |L r|^2/n; the expected information sum_h J_h^T L_h^T L_h J_h / s_h^2 of the regression
  parameters (block diagonal against phi and s) is inverted after diagonal scaling, with dP/dt_end from a fourth-order
  central difference with step 1e-2 t_end; the interval ends where l_p = l_max - chi2.ppf(0.95, 1)/2 are bracketed by
  stepping outward from the estimate and located with Brent's root finder.
verification_explanation: >-
  Independent targets for steps 1-5 come from closed forms (straight and constant-build holes, a constant-azimuth
  segment with inclination linear in MD, hand-computed layer sums, R = z/k1 and S = z^2/(2 k1) at shallow depths under a
  deep layer stack, erfc forms evaluated with math.erfc, including depths of a few centimetres to metres, the
  Carslaw-Jaeger image series for a layer over a half-space), from independent computations inside the tests (adaptive
  quadrature of the arc tangent and of 1/k and z/k with scipy.integrate.quad, numpy.linalg.lstsq with the pseudo-inverse
  covariance) and from mpmath values stored inline for three multilayer columns (90-digit transfer-matrix transforms
  with mpmath's Talbot inversion; the 50-layer column at 270 to 390 digits with fixed-Talbot inversion of degree 60 and
  90 and Gaver-Stehfest inversion with 60 terms). Steps 6 and 7 build every borehole forward (64-point Gauss-Legendre
  TVD, exact layer sums) and take P and dP/dt_end from an oracle shared with neither solution: the branch-cut
  (real-axis) form of the Laplace inversion of the layered column, U = 1 + (2/pi) int exp(-w^2) Im F+(w^2/t)/w dw on the
  upper side of the cut, with real transfer matrices and Gauss-Legendre quadrature; it reproduces the stored 90-digit
  mpmath values of the step 5 tests to 3e-16 K (five-layer column), 9e-16 K (contrasted column) and 4e-16 K (50 layers),
  and erfc and its time derivative to 7e-16; a uniform column uses math.erfc and its closed-form derivative. For step 6
  the temperatures are the model at the generating T0, q0, g and t_end plus a seeded residual orthogonal to the four
  Jacobian columns 1, R, P, g dP/dt_end, so these values are a stationary point with RSS_min = |r|^2; the Wald errors
  follow from the oracle Jacobian, the F quantile from the Student t density, and the interval ends are the oracle
  profile's nearest crossings; the cases cover an inclined seven-layer hole, a short contrasted hole (F against
  chi-square), a uniform column with the collar reading at z_min = 0, a short glaciation with a second minimum,
  end-point minima, near-boundary valid controls (a precise log whose minimum lies 55 years inside either bound),
  uncontained intervals, five readings (valid) and four (ValueError) and invalid inputs. For step 7 the residual of
  every hole is built in whitened space, u_h = L(phi_h) r_h with the readings ordered by MD: u_h = b_h + c_h, c_h in the
  span of the projections of L P_h and L g dP_h/dt_end off L[1, R_h] (stated coefficients for every hole but one, whose
  c_h is solved in closed form, a quadratic equation, so that the weighted shared scores sum_h (n_h/|u_h|^2) [., .]^T
  u_h vanish), and b_h, orthogonal to the four whitened oracle Jacobian columns with |b_h|^2 = n_h noise_h^2, moved on
  its sphere from a seeded vector along great circles through the gradient of the phi score until that score, n
  (sum_(i>=2) u_i r_(i-1) + phi r_1^2) - |u|^2 phi/(1 - phi^2), vanishes: with s_h^2 = |u_h|^2/n_h every score of the
  exact log-likelihood is zero at the generating values (fourth-order central differences in all 4H + 2 parameters give
  scores below 6e-9 standard deviations on every region). Dense global scans of the oracle profile log-likelihood (600
  logarithmically spaced times over the bounds of every region and 101 within 4 standard errors of t_end; at each time a
  grid search over g and every phi using their separability at fixed g, then a Newton polish) find no value above l_max
  (largest excess 5.5e-12); the second maxima are listed in source.md. Two design failures were found and removed this
  way (a short precise hole that reached a higher maximum with phi near 1, and an eight-reading hole whose phi-score
  root was a minimum for phi = 0.2 and 0.3). The standard errors come from the expected information of the oracle
  Jacobians whitened with phi_h and divided by s_h^2, l_max from the generating residuals with the term (1/2) log(1 -
  phi_h^2), the chi-square quantile from math.erf, and the interval ends are checked against the oracle profile (maximum
  over g by sign changes of its derivative between the holes' own optima and bisection, over the phi_h by damped Newton
  steps): a threshold crossing lies within a relative 5e-4 of each returned end and the profile stays above the
  threshold at 5 interior points on each side. The step 7 cases cover three holes with distinct noise and correlation
  (0.35, 0.7, 0.85; output types), a short precise hole with a negative correlation and a long noisy log listed as two
  logging runs, uniform columns with the erfc oracle and the collar reading at z_min = 0, a short glaciation whose
  profile has a second maximum inside the bounds, end-point maxima with bounds around the estimate and near-boundary
  valid controls (precise logs whose maximum lies 77 years inside either bound), uncontained intervals, a hole with
  exactly eight readings (valid), seven (ValueError) and 33 other invalid inputs, and a strongly correlated log (phi =
  0.9, 37 readings) where the exact and conditional likelihoods differ measurably; the whole-task cases call the final
  function on a deep three-hole region, on a two-hole region with the invariance of the shared results to a constant
  offset of one log (only that hole's T0 moves), to the order of the holes and to the order of the readings of a log,
  and on a second short-glaciation region whose second profile maximum lies only 1.25 below l_max, so that the statistic
  falls below the quantile again around it, outside the interval (nearest crossings; a candidate returning the outermost
  crossings fails there). The second solution uses different methods throughout (circular-arc geometry of each segment
  for the TVD; R as a sum of ramps and S by integration by parts; Duhamel convolution integrated by adaptive quadrature
  in the similarity variable for the half-space perturbation; QR least squares; one global linear system per Laplace
  node and the Weideman-Trefethen hyperbolic contour for the layered column; for step 6, Levenberg-Marquardt on the four
  parameters from the minima of a coarse profile scan, dP/dt_end from the impulse response, covariance from the QR
  factor of J, the Student t quantile and Illinois regula falsi; for step 7, the innovations (prediction-error)
  decomposition of the exact AR(1) likelihood and Fisher scoring with Levenberg damping on all parameters, phi and s
  included, with the expected information of that decomposition, from several starts at every point of a coarse profile
  scan, dP/dt_end from the impulse response, standard errors from the inverse of the whole information matrix, the
  chi-square quantile as the squared normal quantile and Illinois regula falsi), copies no test oracle and passes every
  test case. The tolerances of steps 6 and 7 come from error budgets: with P in error by 1e-8 K per K (smooth in depth
  and time, irregular in both, or aligned with the sign of the residual), the TVD in error by 1e-6 m and R, S by a
  relative 1e-9, the reference stays within a third of every step 6 limit on the step 6 boreholes (half at rms_residual
  = 1e-4 K); on the step 7 and whole-task regions it stays within 0.61 of every stated step 7 limit (0.72 of the
  log-likelihood limit for the pattern aligned with the residual sign on the precise region) and within 0.77 on regions
  rebuilt at the ends of the stated domain (s_h = 1e-3 K and 0.03 K, phi from -0.9 to 0.95). At s_h = 1e-4 K the
  irregular pattern moved phi by 3.5 times its limit and the aligned one the log-likelihood by 4 times, which sets the
  floor of the domain at 1e-3 K. In the short-glaciation regions the standard errors change with t_end with an
  elasticity up to 5.2 (up to 22 for the q0 error of one hole at t_end = 11.5 ka, which is why these regions sit at
  t_end = 11.1 and 11.07 ka). Along the amplitude-timing ridge (d ln g / d ln t_end about 2.05 in these regions, about
  1.1 in the region of step case 0) the g limit binds before the t_end limit: t_end moved by its full limit, the other
  parameters re-maximized, moves g by twice its limit and sigma_g by 1.03 to 1.07 %, so the effective t_end accuracy
  there is about 1e-3. The set of limits is therefore justified by the combined error budget above, not limit by limit.
  The pattern aligned with the residual sign is adversarial and grows roughly with |g| sum_h n_h (1 + |phi_h|) / s_h,
  which the domain does not bound: for that pattern the statement that the limits include the propagated errors of steps
  1, 2 and 5 rests on the regions above, while errors smooth in depth stayed below 0.023 of every limit on all of them.
  With exact inputs the reference reaches at most 3.2e-3 of a step 6 limit and 0.014 of a step 7 limit (0.019 on the
  rebuilt regions), and the second solution 3.2e-4 and 0.006. Each step has named scientific mutants (linear TVD
  interpolation, balanced tangential, arithmetic-mean conductivity, missing 1/2 in S, years not converted, missing
  factor 2, reversed interval sign, wrong heat-production sign, RSS/n, erfc with a mean or local diffusivity,
  Gaver-Stehfest in double precision; for step 6 the half-space perturbation, conditional standard errors, the
  chi-square quantile, n - 3 degrees of freedom, a t_end column without g, a local search, an interval bracketed to the
  bound, MD as depth, a z_min cut on MD or a strict cut, one mean conductivity; for step 7 independent errors, the
  conditional likelihood, the log-determinant term left out, phi from the lag-one autocorrelation of independent-error
  residuals, noise parameters from single-hole fits, one common noise model, readings in the input order,
  independent-error information with the AR(1) variance, |u|^2/(n - 2), the observed information or separately inverted
  blocks in the standard errors, phi or phi and s held fixed in the likelihood-ratio profile, the threshold without the
  factor 2, the log-likelihood without its constants, a local search without a scan, the first hole's rho_c for every
  hole, the half-space perturbation, MD as depth, a z_min cut on MD or a strict cut) and eight whole-task mutants of the
  final function (among them an interval taken as the outermost crossings), and each fails at least one case of its
  target tests. Every case was run alone in a fresh process with tools/crown_check.py for the per-step references,
  solution.py, the second solution, the mutants, the all-None and all-zero controls (which pass no case) and with every
  reference output scaled by 1 +- 1e-12 (every evaluated function at once in the whole-task cases; all cases still
  pass).
required_dependencies: |-
  import numpy as np
  import math
  from scipy.integrate import quad
  from scipy import stats
  from scipy.optimize import brentq, minimize_scalar
problem_description_main: |-
  Exploration diamond-drill holes in one region of the Canadian Shield have been logged for temperature after
  thermal re-equilibration. From each hole's deviation survey, its lithology-based conductivity column, its known
  uniform radiogenic heat production and volumetric heat capacity, and the shape of the last-glacial
  ground-surface temperature history common to the region, estimate the time t_end at which the last glaciation
  ended and the glacial amplitude g, together with the steady-state surface heat flow q0, the reference surface
  temperature T0 and the noise parameters of every log, with standard errors and a likelihood-ratio 95 % interval
  for t_end.

  Conventions used throughout. Depth z is true vertical depth (TVD, m, positive down) below the collar. The
  borehole path between survey stations is the minimum-curvature arc (constant-rate rotation of the unit
  tangent on the great circle joining the station directions), and the TVD at any measured depth (MD) along
  the hole, including between stations, is taken on that arc. Layer boundaries are horizontal and are logged
  in MD along the hole; their depth is the TVD of the contact. Heat transport is one-dimensional conduction in
  a laterally homogeneous ground: with a uniform heat production A the heat flow is q(z) = q0 - A z and
  dT/dz = q(z) / k(z), so the steady geotherm is T_ss(z) = T0 + q0 R(z) - A S(z) with R(0) = S(0) = 0. The
  transient paleoclimate signal comes from a piecewise-constant ground-surface history: interval 0 runs from
  the present back to t_years[0], interval i from t_years[i-1] back to t_years[i] (years before present,
  1 year = 365.25 x 86400 s); during interval i the surface departed from T0 by g times the shape value of the
  interval, and before the last interval end the ground was in steady state. The observation model of a hole is
  T_obs = T0 + q0 R - A S + g P + noise, where P is the present-day perturbation of the unit-amplitude
  history, using only the readings with TVD >= z_min.

  Steps 1-4 build the pieces: TVD by minimum curvature (step 1), the depth functions R and S of the layered
  column (step 2), the classical half-space paleoclimate perturbation (step 3) and the joint least-squares
  estimate of T0, q0 and g for a given P (step 4). Step 5 computes the paleoclimate perturbation in the layered
  conductivity column itself, where the glacial signal is refracted at every conductivity contrast. Step 6
  (deglaciation_heat_flow_inversion) inverts one log for T0, q0, g and the end of the glaciation t_end by
  nonlinear least squares, with Wald standard errors and the profile-likelihood interval of t_end. Step 7
  (regional_deglaciation_inversion) is the top-level function of the task: it combines several holes that share g
  and t_end but differ in geotherm, column and log quality, by maximum likelihood with serially correlated
  (first-order autoregressive) noise of unknown parameters in every hole, and reports the standard errors from the
  expected Fisher information and the likelihood-ratio interval of t_end.
problem_io: |-
  def regional_deglaciation_inversion(holes, hist_t_years, hist_dT_shape, t_end_bounds):
      """Regional maximum-likelihood estimate of the glacial amplitude g and the end of the glaciation t_end
      with serially correlated (AR(1)) noise in every log.

      Parameters
      ----------
      holes : list of H >= 2 dicts, one per borehole, each with exactly the keys
          "survey_md", "survey_inc", "survey_azi", "log_md", "log_temp",
          "layer_top_md", "layer_k", "heat_production", "rho_c" and "z_min",
          with the meanings, units and rules of the arguments of the same names
          of deglaciation_heat_flow_inversion (step 6); log_md need not be sorted.
      hist_t_years, hist_dT_shape, t_end_bounds : the glacial history of step 6,
          shared by every hole: the m - 1 known interval ends (years before
          present, positive, strictly increasing), the m >= 2 shape values
          s_0 ... s_(m-1) (K per unit amplitude) and (t_lo, t_hi) in years with
          0 < t_lo < t_hi < hist_t_years[0].

      Model: in hole h the readings with TVD z >= z_min_h, numbered i = 1 ... n_h
      by increasing MD (readings at equal MD in input order), obey
      T = T0_h + q0_h R_h(z) - A_h S_h(z) + g P_h(z; t_end)
      + e_i, with P_h(z; t_end) = layered_paleoclimate_perturbation(z, the hole's
      layer tops in TVD, its layer_k, its rho_c, [t_end, *hist_t_years],
      hist_dT_shape) (step 5). The errors are a stationary Gaussian AR(1)
      sequence in i: e_1 ~ N(0, s_h^2 / (1 - phi_h^2)), e_i = phi_h e_(i-1) + w_i
      with independent w_i ~ N(0, s_h^2); phi_h (|phi_h| < 1) and s_h > 0 are
      unknown, the holes independent. Every parameter is estimated by maximum
      likelihood (exact joint density of all used readings, the first reading of
      every hole included); t_end is the global maximizer over [t_lo, t_hi] of
      the profile log-likelihood l_p(t) (maximum over all other parameters at
      t_end = t, g over the whole real line) and l_max = l_p(t_end).

      Returns
      -------
      dict: "g" (K), "t_end" (years), "sigma_g", "sigma_t_end" (standard errors:
      square roots of the diagonal of the inverse of the expected Fisher
      information of the regression parameters T0_h, q0_h, g, t_end at the
      estimates, phi_h and s_h held at their estimates; t_end in years),
      "t_end_low", "t_end_high" (years: points nearest to t_end below and above
      it where 2 (l_max - l_p(t)) = scipy.stats.chi2.ppf(0.95, 1)) and
      "log_likelihood" (l_max, natural logarithm of the joint normal density of
      all used readings) as Python floats, and "holes": a list, in the input
      order, of dicts with "T0" (deg C), "q0" (W m^-2), "sigma_T0", "sigma_q0"
      (standard errors), "phi" (maximum-likelihood phi_h), "innovation_sd"
      (maximum-likelihood s_h, K) as Python floats and "n_used" (int, readings
      used in the hole).
      Domain: at least 8 used readings per hole; maximum-likelihood s_h from
      1e-3 K to 0.03 K and phi_h from -0.9 to 0.95 in every hole.
      Accuracy: g and t_end within a relative 2e-3; every q0 within a relative
      5e-4; every T0 within 2e-3 K; the standard errors within a relative 1e-2;
      t_end_low and t_end_high within a relative 5e-4; every phi within 2e-3;
      every innovation_sd within a relative 3e-3; log_likelihood within 0.1;
      n_used exact. These limits include the errors propagated from the stated
      accuracies of steps 1, 2 and 5.

      Raises
      ------
      ValueError if holes is not a list or tuple of at least 2 dicts with exactly
      these keys; for a hole with log arrays that are not 1-D of equal length, a
      non-finite temperature, a negative or non-finite heat production, any error
      of an earlier step, fewer than 8 readings with TVD >= z_min, or T0_h and
      q0_h not separately resolvable (smallest singular value of the n_h x 2
      matrix [1, R_h] with unit-length columns below 1e-8); for an invalid
      history or invalid bounds (rules of step 6, including hist_dT_shape[0] ==
      hist_dT_shape[1]); if the maximum of l_p over [t_lo, t_hi] is attained at
      t_lo or t_hi; or if a nearest crossing does not exist inside [t_lo, t_hi].
      """
general_tests: tests/general.py

second_solution: second_solution.py

mutants:
  - name: whole_task_iid_noise_model
    description: "Independent errors in every hole (lag-one correlation fixed at 0: the round-2 estimator with one variance per hole) instead of the stationary AR(1) noise model; phi is reported as 0."
    file: mutants/whole_task_iid_noise_model.py
  - name: whole_task_readings_in_input_order
    description: "Readings taken in the order of the input arrays instead of by increasing MD for the AR(1) sequence."
    file: mutants/whole_task_readings_in_input_order.py
  - name: whole_task_halfspace_mean_diffusivity
    description: "Glacial signal from the half-space erfc perturbation (step 3) with the mean diffusivity of each hole's layers instead of the layered column (step 5)."
    file: mutants/whole_task_halfspace_mean_diffusivity.py
  - name: whole_task_measured_depth_as_depth
    description: "Measured depth along the inclined holes used as depth (no trajectory correction) for the readings and the layer tops."
    file: mutants/whole_task_measured_depth_as_depth.py
  - name: whole_task_z_min_on_measured_depth
    description: "Shallow-reading cut applied to measured depth instead of true vertical depth."
    file: mutants/whole_task_z_min_on_measured_depth.py
  - name: whole_task_local_search_without_scan
    description: "t_end from one local bounded Brent search of the profile over [t_lo, t_hi] without a global scan: a local maximum in another basin can be returned."
    file: mutants/whole_task_local_search_without_scan.py
  - name: whole_task_interval_outermost_crossings
    description: "Likelihood-ratio interval taken as the hull of the set where the statistic is below the chi-square quantile (outermost crossings, bracketed on the 121-point scan grid) instead of the crossings nearest to t_end."
    file: mutants/whole_task_interval_outermost_crossings.py
  - name: whole_task_first_hole_rho_c_for_all
    description: "The volumetric heat capacity of the first hole used in the glacial perturbation of every hole."
    file: mutants/whole_task_first_hole_rho_c_for_all.py

# On a new version of an uploaded task only, what kind of edit it is.
edit_label: difficulty_increase

sub_steps:
  - step_number: 1
    scaffold: steps/step_1.py
    solution: solution/step_1.py
    tests: tests/step_1.py
    step_description_prompt: |-
      Compute the true vertical depth (TVD, m, positive down) at arbitrary measured depths (MD) along a
      borehole from its deviation survey, using the minimum-curvature model of the well path.
      At each survey station the inclination I is given in degrees from vertical (0 = straight down) and the
      azimuth A in degrees clockwise from north. The unit tangent of the path at a station is
      t = (sin I cos A, sin I sin A, cos I) in (north, east, down) coordinates.
      Minimum-curvature model: between two consecutive stations the path is the circular arc on which the unit
      tangent turns at a constant rate (per metre of MD) along the great circle from t1 to t2. The total
      turning angle over the segment is the dogleg beta, with cos beta = t1 . t2; only for beta exactly 0 is
      the segment straight. The accuracy below must hold for every dogleg, including very small non-zero
      doglegs on long segments. A query point inside a segment lies on that same arc, at the distance
      (MD - MD1) along it from the first station.
      The TVD of any point is the integral, along the path from the collar (MD = 0, TVD = 0), of the down
      component of the unit tangent. Derive the TVD of the stations and of points inside a segment from this
      model; linear interpolation of TVD, of the angles or of the tangent between stations is not allowed.
      Returns: a Python float for a scalar md_query, otherwise a numpy float array with the shape of md_query.
      Absolute accuracy: 1e-6 m.
      Errors: ValueError if the survey arrays are not 1-D of equal length with >= 2 stations, contain a
      non-finite value, do not start at MD 0 or do not increase strictly, if any inclination is outside
      [0, 180), if the dogleg between two consecutive stations is within 1e-6 rad of 180 degrees (opposite
      directions: the arc is not defined), or if a query depth is non-finite or outside [0, survey_md[-1]].
    function_header: |-
      def true_vertical_depth(survey_md, inc_deg, azi_deg, md_query):
          """True vertical depth (m, positive down) at measured depths md_query.

          Parameters
          ----------
          survey_md : 1-D array_like, measured depth of survey stations (m); first
              station at 0 (collar), strictly increasing, at least 2 stations.
          inc_deg : 1-D array_like, inclination from vertical at each station
              (degrees, 0 = straight down), 0 <= inc < 180.
          azi_deg : 1-D array_like, azimuth at each station (degrees clockwise from
              north).
          md_query : float or array_like, measured depths (m) with
              0 <= md_query <= survey_md[-1].

          Returns
          -------
          Python float for scalar md_query, otherwise a numpy float array with the
          shape of md_query. Absolute accuracy 1e-6 m (the minimum-curvature path
          is exact; no approximation between stations is permitted).

          Raises
          ------
          ValueError if the survey arrays are not 1-D of equal length, have fewer
          than 2 stations, contain a non-finite value, do not start at MD 0 or do
          not increase strictly, if any inclination is outside [0, 180), if the
          dogleg between two consecutive stations is within 1e-6 rad of 180 degrees
          (opposite directions: the arc is undefined), or if any query depth is
          non-finite or outside [0, survey_md[-1]].
          """
    return_line: "    return tvd"
    step_background: |-
      A deviation survey gives the inclination and azimuth of the hole at stations along it. The
      minimum-curvature method is the industry standard (Sawaryn and Thorogood 2005); its closed form contains
      the ratio factor tan(beta/2)/(beta/2). Linear interpolation of TVD or of the angles between stations and
      the balanced-tangential method (no ratio factor) are not the minimum-curvature path, and treating MD as
      depth in an inclined hole lowers the apparent temperature gradient by cos I.
    n_test_cases: 22
    contract:
      quantity: "True vertical depth (m) at measured depths along a borehole, from its deviation survey, by the minimum-curvature method."
      assumptions: "Between stations the unit tangent rotates at a constant rate per metre of MD on the great circle joining the station directions; TVD is the integral of the down component of the tangent from the collar (MD 0, TVD 0)."
      result_kind: exact
      valid_input_ranges: "At least 2 stations, MD starting at 0 and strictly increasing, 0 <= inclination < 180 degrees, any azimuth, no dogleg within 1e-6 rad of 180 degrees; 0 <= md_query <= survey_md[-1]."
      units: "MD and TVD in m; inclination and azimuth in degrees."
      output_shape: "Python float for a scalar md_query, otherwise a numpy float array with the shape of md_query."
      step_dependencies: []
    mutants:
      - name: linear_tvd_between_stations
        description: "TVD between survey stations interpolated linearly in measured depth instead of on the minimum-curvature arc."
        file: mutants/step_1_linear_tvd_between_stations.py
      - name: balanced_tangential
        description: "Ratio factor omitted (balanced-tangential method): the arc is replaced by two straight half-segments."
        file: mutants/step_1_balanced_tangential.py

  - step_number: 2
    scaffold: steps/step_2.py
    solution: solution/step_2.py
    tests: tests/step_2.py
    step_description_prompt: |-
      A column of horizontal layers has a constant thermal conductivity k_i (W m^-1 K^-1) inside each layer.
      The top of layer i is at depth z_i (m): the first top is 0, the tops increase strictly, and the last
      layer extends to infinite depth.
      In steady one-dimensional conduction with a uniform radiogenic heat production A (W m^-3), the upward
      heat flow decreases with depth as q(z) = q0 - A z, where q0 is the surface heat flow, and Fourier's law
      gives dT/dz = q(z) / k(z), with T(0) = T0. The steady temperature can therefore be written as
      T(z) = T0 + q0 R(z) - A S(z), where R(z) (thermal resistance, m^2 K W^-1) and S(z) (m^3 K W^-1) depend
      only on the conductivity column and are zero at z = 0. Return R(z) and S(z) at each requested depth z
      (m) for the given layers.
      Returns: tuple (R, S); two Python floats for a scalar z, otherwise two numpy float arrays with the shape
      of z. Relative accuracy: 1e-9 (absolute 1e-12 at z = 0, where R = S = 0).
      Errors: ValueError if the layer arrays are not 1-D of equal length, any top is non-finite, the first
      top is not 0 or tops do not increase strictly, any conductivity is non-finite or <= 0, or any depth is
      non-finite or negative.
    function_header: |-
      def layer_integrals(layer_top_tvd, layer_k, z):
          """Depth functions R(z), S(z) of the steady layered geotherm T = T0 + q0 R - A S.

          Parameters
          ----------
          layer_top_tvd : 1-D array_like, depth (m) of the top of each layer; the
              first is 0, strictly increasing. The last layer extends to infinity.
          layer_k : 1-D array_like, thermal conductivity of each layer (W m^-1 K^-1), > 0.
          z : float or array_like, depths (m) >= 0.

          Returns
          -------
          (R, S) : R in m^2 K W^-1, S in m^3 K W^-1; two Python floats for scalar
          z, otherwise two numpy float arrays with the shape of z. Relative
          accuracy 1e-9 (absolute 1e-12 at z = 0, where R = S = 0).

          Raises
          ------
          ValueError if the layer arrays are not 1-D of equal length, if any top is
          non-finite, if the first top is not 0 or tops do not increase strictly,
          if any conductivity is non-finite or <= 0, or if any depth is non-finite
          or negative.
          """
    return_line: "    return (R, S)"
    step_background: |-
      In the Bullard (1939) method the temperature is plotted against the thermal resistance R(z) between the
      surface and depth z. Resistances add in series, so the effective conductivity of a stack of layers is
      the thickness-weighted harmonic mean; an arithmetic mean or a single average conductivity biases both
      q0 and the curvature of the profile. Without heat production and transients the Bullard plot is a
      straight line.
    n_test_cases: 12
    contract:
      quantity: "Thermal resistance R(z) = integral of 1/k and heat-production depth function S(z) = integral of z'/k from 0 to z in a layered column."
      assumptions: "Horizontal layers of constant conductivity, the last layer extending to infinite depth; steady one-dimensional conduction with uniform heat production, T = T0 + q0 R - A S."
      result_kind: exact
      valid_input_ranges: "Layer tops finite, starting at 0 and strictly increasing; conductivities finite and > 0; depths z >= 0."
      units: "R in m^2 K W^-1, S in m^3 K W^-1; depths in m; conductivities in W m^-1 K^-1."
      output_shape: "Tuple (R, S) of two Python floats for a scalar z, otherwise of two numpy float arrays with the shape of z."
      step_dependencies: []
    mutants:
      - name: arithmetic_conductivity
        description: "Thermal resistance computed with the arithmetic mean conductivity of all layers instead of summing the layer resistances in series."
        file: mutants/step_2_arithmetic_conductivity.py
      - name: heat_production_integral_missing_half
        description: "S(z) integrated as (b^2 - a^2)/k instead of (b^2 - a^2)/(2k)."
        file: mutants/step_2_heat_production_integral_missing_half.py

  - step_number: 3
    scaffold: steps/step_3.py
    solution: solution/step_3.py
    tests: tests/step_3.py
    step_description_prompt: |-
      Return the present-day departure (K) of subsurface temperature from the steady state caused by a past
      ground-surface temperature history. The ground is a homogeneous conducting half-space z >= 0
      (z = depth, m) with thermal diffusivity kappa (m^2 s^-1) and no internal heat sources: the departure
      obeys the one-dimensional heat equation, and at the surface it equals the surface-temperature departure.
      History: interval 0 runs from the present back to t_years[0], interval i from t_years[i-1] back to
      t_years[i] (years before present). During interval i the ground-surface temperature differed from the
      long-term reference by dT[i] (K). Before t_years[-1] the surface stayed at the reference long enough for
      the departure to be zero at all depths. Convert years to seconds with 1 year = 365.25 x 86400 s. At
      z = 0 the result is the present surface departure dT[0].
      Returns: a Python float for a scalar z, otherwise a numpy float array with the shape of z (any number of
      dimensions). Absolute accuracy: 1e-6 K per kelvin of the largest |dT[i]|.
      Errors: ValueError if t_years and dT are not 1-D of equal length, contain a non-finite value,
      t_years[0] <= 0 or t_years does not increase strictly, kappa is non-finite or <= 0, or any depth is
      non-finite or negative.
    function_header: |-
      def paleoclimate_perturbation(z, t_years, dT, kappa):
          """Present-day temperature perturbation (K) at depth z.

          History convention: interval 0 runs from the present back to t_years[0],
          interval i runs from t_years[i-1] back to t_years[i]. During interval i
          the ground-surface temperature differed from the long-term reference
          surface temperature by dT[i] (K). Before t_years[-1] the surface stayed
          at the reference temperature long enough for the ground to be in steady
          state. The subsurface is a homogeneous conductive half-space with thermal
          diffusivity kappa. Times in years are converted with 1 year = 365.25 x
          86400 s.

          Parameters
          ----------
          z : float or array_like, depth (m) >= 0.
          t_years : 1-D array_like, positive, strictly increasing ends of the
              history intervals (years before present).
          dT : 1-D array_like, same length, departure during each interval (K).
          kappa : float, thermal diffusivity (m^2 s^-1), > 0.

          Returns
          -------
          Python float for scalar z, else a numpy float array with the shape of z.
          Absolute accuracy 1e-6 K per kelvin of the largest |dT|.

          Raises
          ------
          ValueError if t_years and dT are not 1-D of equal length, if they
          contain a non-finite value, if t_years[0] <= 0 or t_years does not
          increase strictly, if kappa is non-finite or <= 0, or if any depth is
          non-finite or negative.
          """
    return_line: "    return dT_z"
    step_background: |-
      A step change of the surface temperature of a homogeneous half-space produces the present-day
      perturbation dT erfc(z / (2 sqrt(kappa t))), and a piecewise-constant history is a superposition of such
      responses (Birch 1948; Beck 1977). On the Canadian Shield the last glaciation still leaves the upper
      1-2 km several kelvin out of equilibrium; the shape of the history comes from paleoclimate proxies,
      while its amplitude is poorly known and is estimated from the borehole itself.
    n_test_cases: 12
    contract:
      quantity: "Present-day temperature departure from the steady state caused by a piecewise-constant ground-surface temperature history in a homogeneous half-space."
      assumptions: "Homogeneous conducting half-space with diffusivity kappa and no internal sources; surface departure dT[i] during interval i and zero before t_years[-1]; superposition of erfc step responses; 1 year = 365.25 x 86400 s."
      result_kind: exact
      valid_input_ranges: "z >= 0 and finite; t_years positive and strictly increasing; dT finite; kappa finite and > 0."
      units: "Departure in K; depth in m; history times in years before present; kappa in m^2 s^-1."
      output_shape: "Python float for a scalar z, otherwise a numpy float array with the shape of z."
      step_dependencies: []
    mutants:
      - name: years_not_converted
        description: "History times used in years instead of seconds in the diffusion length sqrt(kappa t)."
        file: mutants/step_3_years_not_converted.py
      - name: erfc_missing_factor_2
        description: "Diffusion argument written z/sqrt(kappa t) instead of z/(2 sqrt(kappa t))."
        file: mutants/step_3_erfc_missing_factor_2.py
      - name: interval_sign_reversed
        description: "Each interval contributes erfc(new) - erfc(old) instead of erfc(old) - erfc(new) (warming read as cooling)."
        file: mutants/step_3_interval_sign_reversed.py

  - step_number: 4
    scaffold: steps/step_4.py
    solution: solution/step_4.py
    tests: tests/step_4.py
    step_description_prompt: |-
      The equilibrium temperatures follow the observation model T = T0 + q0 R - A S + g P + noise. In the
      workflow, R and S are the depth functions of layer_integrals (step 2) and P is the perturbation of the
      unit-amplitude paleoclimate history from paleoclimate_perturbation (step 3), all evaluated at the true
      vertical depths of the readings (step 1); this function receives them as arrays. The heat production A
      (W m^-3) is known. The unknowns are the surface temperature T0 (deg C), the surface heat flow q0
      (W m^-2) and the amplitude g (K) of the history.
      Estimate T0, q0 and g by ordinary (unweighted) least squares. Report their 1-sigma standard errors from
      the least-squares parameter covariance, with the noise variance estimated without bias from the
      residuals (residual sum of squares RSS divided by n - 3), and the root-mean-square residual
      sqrt(RSS / n).
      The three unknowns are separately determined only if the data resolve the constant, R and P: scale each
      of the three columns 1, R and P to unit Euclidean length; if one of them is all zero (for example P
      identically zero) or the smallest singular value of the scaled n x 3 matrix is below 1e-8 (for example
      P proportional to R), raise ValueError. Any n >= 4 with a resolvable design is valid.
      Returns: dict with keys T0, q0, amplitude, sigma_T0, sigma_q0, sigma_amplitude, rms_residual, each value
      a Python float.
      Accuracy: T0 and g within 1e-9 K and q0 within 1e-12 W m^-2 of the exact least-squares solution, the
      three standard errors within a relative 1e-6, and rms_residual within 1e-9 K.
      Errors: ValueError for unequal lengths, n < 4, non-finite values, A < 0 or non-finite, or an
      unresolvable design as defined above.
    function_header: |-
      def fit_heat_flow(T, R, S, P, A):
          """Least-squares fit of  T = T0 + q0 R - A S + g P.

          Parameters
          ----------
          T : (n,) observed temperatures (deg C), n >= 4
          R : (n,) thermal resistance at the observation depths (m^2 K W^-1)
          S : (n,) heat-production integral at the observation depths (m^3 K W^-1)
          P : (n,) paleoclimate perturbation for a unit-amplitude history (K per K)
          A : float, uniform radiogenic heat production (W m^-3), >= 0 (known)

          Returns
          -------
          dict with keys T0 (deg C), q0 (W m^-2), amplitude (g, K), sigma_T0,
          sigma_q0, sigma_amplitude (1-sigma standard errors of ordinary least
          squares, noise variance estimated as RSS/(n-3)) and rms_residual (K,
          sqrt(RSS/n)); every value a Python float. Accuracy: T0 and g within
          1e-9 K, q0 within 1e-12 W m^-2 of the exact least-squares solution,
          the standard errors within a relative 1e-6, rms_residual within 1e-9 K.

          Raises
          ------
          ValueError for unequal lengths, n < 4, non-finite values, A < 0 or
          non-finite, or an unresolvable design: one of the columns 1, R, P is all
          zero, or the smallest singular value of the n x 3 matrix [1, R, P] with
          each column scaled to unit length is below 1e-8 (e.g. P proportional to R).
          """
    return_line: "    return result"
    step_background: |-
      With R, S and the unit-amplitude perturbation P evaluated at every reading, the observation model is
      linear in T0, q0 and g. The heat production is known from geochemistry on core, so the term A S is
      moved to the left side and the three parameters follow from ordinary least squares on the design
      [1, R, P], with the usual parameter covariance and the unbiased residual variance RSS/(n - 3).
    n_test_cases: 7
    contract:
      quantity: "Ordinary least-squares estimates of T0, q0 and g in T = T0 + q0 R - A S + g P, their 1-sigma standard errors and the rms residual."
      assumptions: "Known heat production A; unweighted least squares; noise variance RSS/(n - 3); design [1, R, P] resolvable (no zero column and smallest singular value of the column-normalized design >= 1e-8)."
      result_kind: exact
      valid_input_ranges: "n >= 4 readings with finite T, R, S, P of equal length; A finite and >= 0; resolvable design."
      units: "T0 in deg C, q0 in W m^-2, g in K, standard errors in the same units, rms_residual in K."
      output_shape: "dict of seven Python floats: T0, q0, amplitude, sigma_T0, sigma_q0, sigma_amplitude, rms_residual."
      step_dependencies: []
    mutants:
      - name: heat_production_sign
        description: "Heat-production term entered with the wrong sign (T = T0 + q0 R + A S + g P)."
        file: mutants/step_4_heat_production_sign.py
      - name: dof_n
        description: "Residual variance divided by n instead of n - 3 degrees of freedom."
        file: mutants/step_4_dof_n.py

  - step_number: 5
    scaffold: steps/step_5.py
    solution: solution/step_5.py
    tests: tests/step_5.py
    step_description_prompt: |-
      The half-space formula of step 3 gives the whole ground one diffusivity. In the borehole the
      conductivity changes from layer to layer (the column of layer_integrals, step 2: tops in m, the first at
      0, the last layer extending to infinite depth), and with a uniform volumetric heat capacity rho_c
      (J m^-3 K^-1) layer i has the diffusivity kappa_i = k_i / rho_c. Return the present-day departure (K) of
      the temperature from the steady state at depths z (m) in this layered ground for a piecewise-constant
      surface history with the convention of step 3: interval 0 runs from the present back to t_years[0],
      interval i from t_years[i-1] back to t_years[i] (years before present, 1 year = 365.25 x 86400 s); dT[i]
      is the surface departure during interval i, and before t_years[-1] the departure was zero at all depths.
      In every layer the departure theta obeys rho_c d(theta)/dt = d/dz (k d(theta)/dz); theta and the heat
      flux k d(theta)/dz are continuous at every layer top, theta at z = 0 equals the surface departure, and
      theta vanishes at infinite depth. At z = 0 the result is dT[0].
      Returns: a Python float for a scalar z, otherwise a numpy float array with the shape of z. Absolute
      accuracy: 1e-8 K per kelvin of the largest |dT[i]|, at every depth and for every history, layering and
      conductivity contrast. It must handle up to 1000 depths, 50 layers and 20 history intervals in one call.
      Errors: ValueError if the layer arrays are not 1-D of equal length with at least one layer, any top is
      non-finite, the first top is not 0 or the tops do not increase strictly, any conductivity is non-finite
      or <= 0, rho_c is non-finite or <= 0, t_years and dT are not 1-D of equal length, contain a non-finite
      value, t_years[0] <= 0 or t_years does not increase strictly, or any depth is non-finite or negative.
    function_header: |-
      def layered_paleoclimate_perturbation(z, layer_tops, layer_k, rho_c, t_years, dT):
          """Present-day temperature perturbation (K) at depth z in a layered column.

          History convention as in paleoclimate_perturbation (step 3). The ground
          is a column of horizontal layers (tops layer_tops, the first at 0, the
          last layer extending to infinite depth) with conductivities layer_k and a
          uniform volumetric heat capacity rho_c; temperature and heat flux are
          continuous at the layer tops.

          Parameters
          ----------
          z : float or array_like, depth (m) >= 0.
          layer_tops : 1-D array_like, layer tops (m), first 0, strictly increasing.
          layer_k : 1-D array_like, same length, conductivities (W m^-1 K^-1) > 0.
          rho_c : float, volumetric heat capacity (J m^-3 K^-1) > 0.
          t_years : 1-D array_like, positive, strictly increasing ends of the
              history intervals (years before present).
          dT : 1-D array_like, same length, departure during each interval (K).

          Returns
          -------
          Python float for scalar z, else a numpy float array with the shape of z.
          Absolute accuracy 1e-8 K per kelvin of the largest |dT|; up to 1000
          depths, 50 layers and 20 history intervals per call.

          Raises
          ------
          ValueError for invalid layers (not 1-D of equal length, no layer, a
          non-finite top, first top not 0, tops not strictly increasing,
          non-finite or non-positive conductivity), rho_c non-finite or <= 0, an
          invalid history (as in step 3), or a depth that is non-finite or
          negative.
          """
    return_line: "    return dT_z"
    step_background: |-
      For a single homogeneous half-space the response to a step change of the surface temperature is the
      error function complement (Birch 1948). Real Shield columns alternate volcanics, intrusions and
      metasediments with conductivities from about 2 to 5 W m^-1 K^-1, and the glacial signal is refracted at
      each contrast: the diffusion is faster in conductive layers, and the heat flux, not the temperature
      gradient, is continuous across an interface (Carslaw and Jaeger 1959, ch. 12, give the image series for
      a layer over a half-space). Near strong contrasts the paleoclimate perturbation of layered ground
      therefore differs from the half-space formula by up to tens of percent of the surface departure.
    n_test_cases: 8
    contract:
      quantity: "Present-day temperature departure from the steady state in a horizontally layered conductivity column for a piecewise-constant ground-surface temperature history."
      assumptions: "One-dimensional conduction rho_c d(theta)/dt = d/dz (k d(theta)/dz) with uniform volumetric heat capacity, temperature and heat flux continuous at the layer tops, the last layer a half-space, theta vanishing at infinite depth; superposition of step responses; 1 year = 365.25 x 86400 s."
      result_kind: approximate
      valid_input_ranges: "z >= 0 and finite; at least one layer, tops finite, starting at 0 and strictly increasing; conductivities finite and > 0; rho_c finite and > 0; t_years positive and strictly increasing; dT finite; up to 1000 depths, 50 layers and 20 history intervals per call."
      units: "Departure in K; depths in m; conductivities in W m^-1 K^-1; rho_c in J m^-3 K^-1; history times in years before present."
      output_shape: "Python float for a scalar z, otherwise a numpy float array with the shape of z."
      step_dependencies: []
    mutants:
      - name: mean_diffusivity_halfspace
        description: "Uses the erfc half-space response with the mean diffusivity of the layers, ignoring the refraction of the signal at the interfaces."
        file: mutants/step_5_mean_diffusivity_halfspace.py
      - name: local_diffusivity_halfspace
        description: "Uses the erfc half-space response with the diffusivity of the layer that contains each depth."
        file: mutants/step_5_local_diffusivity_halfspace.py
      - name: stehfest_double_precision
        description: "Inverts the exact Laplace-domain solution with the Gaver-Stehfest formula in double precision, whose cancellation limits the accuracy to far above 1e-8 K per K."
        file: mutants/step_5_stehfest_double_precision.py

  - step_number: 6
    scaffold: steps/step_6.py
    solution: solution/step_6.py
    tests: tests/step_6.py
    step_description_prompt: |-
      Invert one borehole temperature log jointly for the steady geotherm and the time at which the last glaciation
      ended.
      Inputs: survey_md, survey_inc, survey_azi: the deviation survey of step 1 (station MD in m, starting at 0 at
      the collar and strictly increasing; inclination from vertical in degrees, 0 = straight down; azimuth in degrees
      clockwise from north). log_md, log_temp: 1-D arrays of equal length with the MD (m, within the survey) of each
      reading and its equilibrium temperature (deg C). layer_top_md, layer_k: MD (m) of the top of each horizontal
      layer (first 0, strictly increasing, within the survey; the last layer extends below the hole) and its
      conductivity (W m^-1 K^-1, > 0). heat_production: uniform radiogenic heat production A (W m^-3, >= 0, known).
      rho_c: uniform volumetric heat capacity (J m^-3 K^-1, > 0). hist_dT_shape: m >= 2 shape values s_0 ... s_(m-1)
      (K per unit amplitude). hist_t_years: the m - 1 known interval ends (years before present, positive, strictly
      increasing). t_end_bounds: (t_lo, t_hi) in years with 0 < t_lo < t_hi < hist_t_years[0]. z_min (m).
      Surface history: with amplitude g (K), the ground surface departed from the reference surface temperature T0
      by g s_0 from the present back to t_end (interval 0, post-glacial), by g s_1 from t_end back to hist_t_years[0]
      (interval 1, the glaciation) and by g s_i from hist_t_years[i-2] back to hist_t_years[i-1] for i >= 2; before
      hist_t_years[-1] the ground was in steady state. The end of the glaciation t_end (years before present) is
      unknown. With the layer tops converted to TVD by true_vertical_depth (step 1), the present-day perturbation of
      the unit-amplitude history is P(z; t_end) = layered_paleoclimate_perturbation(z, layer tops in TVD, layer_k,
      rho_c, [t_end, hist_t_years[0], ..., hist_t_years[m-2]], hist_dT_shape) (step 5).
      Model: a reading is used if its TVD (step 1) is >= z_min (the cut is applied to vertical depth, not to MD, and a
      reading exactly at z_min is used); n_used is the number of used readings. A used reading at TVD z obeys
      T = T0 + q0 R(z) - A S(z) + g P(z; t_end) + noise, with R and S from layer_integrals (step 2) on the layer tops
      in TVD. The unknowns are T0 (deg C), q0 (W m^-2), g (K) and t_end (years).
      Estimate: (T0, q0, g, t_end) minimize the residual sum of squares over the used readings. The profile RSS(t) is
      the smallest residual sum of squares over T0, q0 and g with t_end fixed at t. t_end is the global minimizer of
      RSS(t) over the closed interval [t_lo, t_hi]; T0, q0 and g are the least-squares values at t_end, and RSS_min = RSS(t_end).
      Uncertainties: the standard errors of T0, q0, g and t_end are the linearized (Wald) ones, the square roots of
      the diagonal of s^2 (J^T J)^-1 with s^2 = RSS_min / (n_used - 4), where J is the n_used x 4 Jacobian of the
      model with respect to (T0, q0, g, t_end) at the estimate (t_end in years).
      The profile-likelihood 95 % interval [t_end_low, t_end_high] of t_end uses the threshold
      RSS_min (1 + F / (n_used - 4)), where F is the 0.95 quantile of the Fisher distribution with 1 and n_used - 4
      degrees of freedom (scipy.stats.f.ppf(0.95, 1, n_used - 4)); t_end_low and t_end_high are the points where
      RSS(t) crosses the threshold nearest to t_end below and above it (farther regions where RSS(t) falls below the
      threshold again are not part of the interval).
      Returns: dict with keys "T0", "q0", "amplitude" (g), "t_end", "sigma_T0", "sigma_q0", "sigma_amplitude",
      "sigma_t_end", "t_end_low", "t_end_high" (the t_end entries in years) and "rms_residual" (K,
      sqrt(RSS_min / n_used)), each a Python float, and "n_used" (int).
      Domain: conduction only, horizontal layers and a laterally homogeneous ground, holes up to a few km deep with
      inclinations below 90 degrees, and logs with measurement noise (rms_residual >= 1e-4 K).
      Accuracy, against the exact values for the given data: T0 within 2e-3 K; q0, g and t_end within a relative
      5e-4; the four standard errors within a relative 5e-3; t_end_low and t_end_high within a relative 5e-4;
      rms_residual within a relative 1e-3; n_used exact. These limits include the errors propagated from the stated
      accuracies of steps 1, 2 and 5.
      Errors: ValueError if log_md and log_temp are not 1-D arrays of equal length or log_temp contains a non-finite
      value; if hist_dT_shape is not 1-D with at least 2 entries, hist_t_years is not 1-D with exactly
      len(hist_dT_shape) - 1 entries, either contains a non-finite value, hist_t_years[0] <= 0 or hist_t_years does
      not increase strictly; if hist_dT_shape[0] == hist_dT_shape[1] (t_end then has no effect); if t_end_bounds is
      not two finite numbers with 0 < t_lo < t_hi < hist_t_years[0]; if heat_production is negative or non-finite; if
      any earlier step raises (invalid survey, layer tops or log depths beyond the last survey station, invalid
      conductivities or rho_c); if fewer than 5 readings have TVD >= z_min; if T0, q0 and g are not separately
      resolvable at t_end (criterion of step 4); if the minimum of RSS(t) over [t_lo, t_hi] is attained at t_lo or
      t_hi; or if a nearest threshold crossing does not exist inside [t_lo, t_hi].
      Earlier functions you may use: true_vertical_depth (step 1), layer_integrals (step 2), fit_heat_flow (step 4)
      and layered_paleoclimate_perturbation (step 5).
    function_header: |-
      def deglaciation_heat_flow_inversion(survey_md, survey_inc, survey_azi, log_md, log_temp,
                                           layer_top_md, layer_k, heat_production, rho_c,
                                           hist_t_years, hist_dT_shape, t_end_bounds, z_min):
          """Joint estimate of q0, T0, the glacial amplitude g and the end of the glaciation t_end.

          Parameters
          ----------
          survey_md, survey_inc, survey_azi : deviation survey as in step 1:
              station MD (m, first 0 at the collar, strictly increasing),
              inclination from vertical (degrees, 0 = straight down) and azimuth
              (degrees clockwise from north).
          log_md, log_temp : 1-D arrays of equal length, MD of each reading (m,
              within the survey) and its equilibrium temperature (deg C).
          layer_top_md, layer_k : MD of the top of each horizontal layer (m, first
              0, strictly increasing, within the survey; the last layer extends
              below the hole) and its conductivity (W m^-1 K^-1, > 0).
          heat_production : uniform radiogenic heat production A (W m^-3), >= 0.
          rho_c : uniform volumetric heat capacity (J m^-3 K^-1), > 0.
          hist_t_years : the m - 1 known interval ends (years before present,
              positive, strictly increasing).
          hist_dT_shape : the m >= 2 shape values s_0 ... s_(m-1) (K per unit
              amplitude). Interval 0 runs from the present back to t_end,
              interval 1 (the glaciation) from t_end back to hist_t_years[0],
              interval i >= 2 from hist_t_years[i-2] back to hist_t_years[i-1];
              the surface departure is g * s_i during interval i and zero before
              hist_t_years[-1]. P(z; t_end) = layered_paleoclimate_perturbation(
              z, layer tops in TVD, layer_k, rho_c, [t_end, *hist_t_years],
              hist_dT_shape) (step 5).
          t_end_bounds : (t_lo, t_hi) in years, 0 < t_lo < t_hi < hist_t_years[0].
          z_min : readings with TVD >= z_min (m) are used, shallower ones excluded.

          Model: T = T0 + q0 R(z) - A S(z) + g P(z; t_end) + noise at the TVD z of
          each used reading. t_end is the global minimizer over [t_lo, t_hi] of the
          profile RSS(t) (least squares in T0, q0, g at fixed t); T0, q0, g are the
          least-squares values at t_end and RSS_min = RSS(t_end).

          Returns
          -------
          dict: "T0" (deg C), "q0" (W m^-2), "amplitude" (g, K), "t_end" (years),
          "sigma_T0", "sigma_q0", "sigma_amplitude", "sigma_t_end" (Wald standard
          errors: s^2 (J^T J)^-1, s^2 = RSS_min / (n_used - 4), J the Jacobian of
          the model in (T0, q0, g, t_end) at the estimate, t_end in years), "t_end_low",
          "t_end_high" (years: crossings of RSS(t) with RSS_min (1 + F /
          (n_used - 4)), F = scipy.stats.f.ppf(0.95, 1, n_used - 4), nearest to
          t_end below and above it), "rms_residual" (K, sqrt(RSS_min / n_used)) as
          Python floats, and "n_used" (int, number of readings used).
          Accuracy (logs with rms_residual >= 1e-4 K): T0 within 2e-3 K; q0, g and
          t_end within a relative 5e-4; the standard errors within a relative 5e-3;
          t_end_low and t_end_high within a relative 5e-4; rms_residual within a
          relative 1e-3; n_used exact. These limits include the errors propagated
          from the stated accuracies of steps 1, 2 and 5.

          Raises
          ------
          ValueError for invalid log arrays or a non-finite temperature, an invalid
          history (hist_dT_shape 1-D with >= 2 entries, hist_t_years 1-D with one
          entry fewer, finite, positive, strictly increasing), hist_dT_shape[0] ==
          hist_dT_shape[1], invalid t_end_bounds, heat_production negative or
          non-finite, any error of an earlier step, fewer than 5 readings with TVD
          >= z_min, T0, q0 and g not separately resolvable at t_end (criterion of
          step 4), a minimum of RSS(t) over [t_lo, t_hi] attained at t_lo or t_hi,
          or a nearest threshold crossing that does not exist inside [t_lo, t_hi].
          """
    return_line: "    return result"
    step_background: |-
      Borehole paleoclimatology reads the ground-surface temperature history from the curvature of the upper
      temperature profile. With the layered perturbation the model is
      linear in T0, q0 and g but not in the end of the glaciation t_end, so t_end is estimated from the profile of
      the residual sum of squares. The linearized (Wald) standard error ignores the curvature of the model in t_end;
      the profile-likelihood interval, a likelihood-ratio test calibrated with the F distribution because the noise
      variance is estimated from the same residuals, does not, and is asymmetric when the model is nonlinear. A short
      glaciation lets amplitude trade against timing, and the profile can then have several minima. Readings
      shallower than a cut-off depth are excluded because recent warming and ground-water circulation in fractured
      near-surface rock disturb them.
    n_test_cases: 7
    contract:
      quantity: "Joint least-squares estimate of the surface heat flow q0, reference surface temperature T0, glacial amplitude g and end of the last glaciation t_end from one borehole log, with Wald standard errors, the profile-likelihood 95 % interval of t_end, the rms residual and the number of readings used."
      assumptions: "Minimum-curvature trajectory; horizontal layers logged in MD; one-dimensional conduction with uniform heat production and volumetric heat capacity; glacial signal from the layered-column perturbation (step 5) of a piecewise-constant history whose first boundary t_end is unknown; unweighted least squares on the readings with TVD >= z_min; t_end the global minimizer of the profile RSS on [t_lo, t_hi]; Wald covariance s^2 (J^T J)^-1 with J = [1, R, P, g dP/dt_end] and s^2 = RSS_min/(n_used - 4); interval from the F(1, n_used - 4) 0.95 quantile, bounded by the nearest crossings; the stated accuracy includes the propagated accuracies of steps 1, 2 and 5."
      result_kind: approximate
      valid_input_ranges: "Survey, layers and history as in steps 1, 2 and 5 with layer tops and log depths within the survey; heat_production finite and >= 0; m >= 2 shape values with s_0 != s_1 and m - 1 interval ends; 0 < t_lo < t_hi < hist_t_years[0]; at least 5 readings with TVD >= z_min; logs with rms_residual >= 1e-4 K; holes up to a few km with inclinations below 90 degrees (an end-point minimum or an interval not contained in the bounds raises ValueError)."
      units: "T0 in deg C, q0 in W m^-2, g in K, t_end, its standard error and interval in years, the other standard errors in the units of their parameters, rms_residual in K, n_used dimensionless."
      output_shape: "dict with eleven Python floats (T0, q0, amplitude, t_end, sigma_T0, sigma_q0, sigma_amplitude, sigma_t_end, t_end_low, t_end_high, rms_residual) and the int n_used."
      step_dependencies: [1, 2, 4, 5]
    mutants:
      - name: halfspace_mean_diffusivity
        description: "Glacial signal from the half-space erfc perturbation (step 3) with the mean diffusivity of the layers instead of the layered column (step 5)."
        file: mutants/step_6_halfspace_mean_diffusivity.py
      - name: wald_without_t_end_column
        description: "Standard errors of T0, q0 and g from the three-parameter least-squares covariance at fixed t_end (RSS/(n - 3)) and sigma_t_end with the other parameters held fixed: the t_end column is left out of the joint Wald covariance."
        file: mutants/step_6_wald_without_t_end_column.py
      - name: chi_square_threshold
        description: "Profile-likelihood threshold with the chi-square(1) quantile 3.841 instead of the F(1, n_used - 4) quantile."
        file: mutants/step_6_chi_square_threshold.py
      - name: threshold_dof_n_minus_3
        description: "Profile-likelihood threshold with n_used - 3 instead of n_used - 4 degrees of freedom."
        file: mutants/step_6_threshold_dof_n_minus_3.py
      - name: residual_variance_n_minus_3
        description: "Noise variance of the Wald covariance estimated as RSS_min/(n_used - 3) instead of RSS_min/(n_used - 4)."
        file: mutants/step_6_residual_variance_n_minus_3.py
      - name: jacobian_without_amplitude
        description: "Fourth Jacobian column dP/dt_end instead of g dP/dt_end."
        file: mutants/step_6_jacobian_without_amplitude.py
      - name: interval_end_bracketed_to_bound
        description: "Interval ends bracketed between t_end and the bound (profile taken as monotonic on each side): a profile below the threshold at the bound is reported as an uncontained interval."
        file: mutants/step_6_interval_end_bracketed_to_bound.py
      - name: measured_depth_as_depth
        description: "Measured depth along the inclined hole used as depth (no trajectory correction) for the readings and the layer tops."
        file: mutants/step_6_measured_depth_as_depth.py
      - name: z_min_on_measured_depth
        description: "Shallow-reading cut applied to measured depth instead of true vertical depth."
        file: mutants/step_6_z_min_on_measured_depth.py
      - name: z_min_cut_strict
        description: "Shallow-reading cut applied as TVD > z_min, so that a reading exactly at z_min is dropped."
        file: mutants/step_6_z_min_cut_strict.py
      - name: single_mean_conductivity
        description: "Layered column replaced by one layer with the arithmetic mean conductivity (in R, S and the glacial perturbation)."
        file: mutants/step_6_single_mean_conductivity.py
      - name: local_minimizer_without_scan
        description: "t_end from one local bounded Brent search of the profile over [t_lo, t_hi] without a global scan: a local minimum in another basin can be returned instead of the global minimizer."
        file: mutants/step_6_local_minimizer_without_scan.py

  - step_number: 7
    scaffold: steps/step_7.py
    solution: solution/step_7.py
    tests: tests/step_7.py
    step_description_prompt: |-
      Combine the temperature logs of several boreholes of one region into a single estimate of the glacial history.
      The holes share the ground-surface temperature history, so the glacial amplitude g (K) and the end of the
      glaciation t_end (years before present) are common to all of them, while every hole h has its own steady
      geotherm (T0_h, q0_h), its own column, heat production, rho_c and z_min, and its own measurement noise, which is
      serially correlated along the log (small-scale conductivity variations and fluid movement in the hole are not in
      the model).
      Inputs: holes: a list of H >= 2 dicts, one per borehole, each with exactly the keys "survey_md", "survey_inc",
      "survey_azi", "log_md", "log_temp", "layer_top_md", "layer_k", "heat_production", "rho_c" and "z_min", whose
      values have the meanings, units and validity rules of the arguments of the same names of
      deglaciation_heat_flow_inversion (step 6); log_md need not be sorted. hist_t_years, hist_dT_shape and
      t_end_bounds = (t_lo, t_hi): the history of step 6, shared by all holes (m >= 2 shape values s_0 ... s_(m-1) in K
      per unit amplitude; interval 0 from the present back to t_end, interval 1 from t_end back to hist_t_years[0],
      interval i >= 2 from hist_t_years[i-2] back to hist_t_years[i-1]; 0 < t_lo < t_hi < hist_t_years[0]).
      Statistical model: in hole h a reading is used if its TVD (step 1) is >= the hole's z_min (a reading exactly at
      z_min is used); n_h is the number of used readings, numbered i = 1, ..., n_h in the order of increasing MD (readings at equal MD in their input order). A used
      reading at TVD z obeys T = T0_h + q0_h R_h(z) - A_h S_h(z) + g P_h(z; t_end) + e_i, with R_h and S_h from
      layer_integrals (step 2) on the hole's layer tops in TVD, A_h its heat production and P_h(z; t_end) =
      layered_paleoclimate_perturbation(z, the hole's layer tops in TVD, its layer_k, its rho_c, [t_end,
      hist_t_years[0], ..., hist_t_years[m-2]], hist_dT_shape) (step 5). The errors of hole h are a stationary Gaussian
      first-order autoregressive sequence in the reading index i (whatever the spacing of the readings): e_1 is normal
      with mean 0 and variance s_h^2 / (1 - phi_h^2), and e_i = phi_h e_(i-1) + w_i for i >= 2, where the innovations
      w_i are independent of each other and of e_1 and normal with mean 0 and variance s_h^2. The lag-one correlation
      phi_h (|phi_h| < 1) and the innovation standard deviation s_h > 0 are unknown; the errors of different holes are
      independent.
      Estimates: maximum likelihood for all the parameters: T0_h, q0_h, phi_h and s_h of every hole, g on the whole real
      line and t_end in the closed interval [t_lo, t_hi]. The log-likelihood is the natural logarithm of the joint
      normal probability density of all the used temperatures of all holes (the exact likelihood: the first reading of
      every hole included, normalizing constants included). The profile log-likelihood l_p(t) is its maximum over all
      the other parameters with t_end fixed at t; t_end is the global maximizer of l_p over [t_lo, t_hi], the other
      estimates are the maximizers at that t_end, and l_max = l_p(t_end).
      The likelihood is unbounded when a hole can be fitted exactly; to keep it bounded with a margin and to leave
      readings for the two noise parameters, every hole must keep at least 8 used readings. The domain is that of noisy
      logs: maximum-likelihood s_h from 1e-3 K to 0.03 K and phi_h from -0.9 to 0.95 in every hole.
      Standard errors: the square roots of the diagonal of the inverse of the expected (Fisher) information matrix of the
      regression parameters (T0_h and q0_h of every hole, g and t_end, with t_end in years), evaluated at the
      maximum-likelihood estimates with the noise parameters phi_h and s_h held at their maximum-likelihood values;
      report those of g, t_end and of every T0_h and q0_h.
      Interval: the 95 % likelihood-ratio (profile-likelihood) interval of t_end. t_end_low and t_end_high are the points
      where 2 (l_max - l_p(t)) equals the 0.95 quantile of the chi-square distribution with 1 degree of freedom
      (scipy.stats.chi2.ppf(0.95, 1)) nearest to t_end below and above it (farther regions where the statistic falls
      below the quantile again are not part of the interval); l_p is maximized at every t over all the other parameters,
      the phi_h and s_h included.
      Returns: dict with keys "g", "t_end", "sigma_g", "sigma_t_end", "t_end_low", "t_end_high" (the t_end entries in
      years) and "log_likelihood" (l_max), each a Python float, and "holes": a list with one dict per input hole, in the
      input order, with keys "T0" (deg C), "q0" (W m^-2), "sigma_T0", "sigma_q0" (standard errors), "phi" (the
      maximum-likelihood phi_h), "innovation_sd" (the maximum-likelihood s_h, K), each a Python float, and "n_used"
      (int).
      Accuracy, against the exact values for the given data: g and t_end within a relative 2e-3; every q0 within a
      relative 5e-4; every T0 within 2e-3 K; the standard errors within a relative 1e-2; t_end_low and t_end_high within
      a relative 5e-4; every phi within 2e-3 (absolute); every innovation_sd within a relative 3e-3; log_likelihood
      within 0.1 (absolute); n_used exact. These limits include the errors propagated from the stated accuracies of
      steps 1, 2 and 5.
      Errors: ValueError if holes is not a list or tuple of at least 2 dicts that each have exactly the ten keys above;
      for any hole, if log_md and log_temp are not 1-D arrays of equal length, log_temp contains a non-finite value, the
      heat production is negative or non-finite, an earlier step raises (invalid survey, layer tops or log depths beyond
      the last survey station, invalid conductivities or rho_c), fewer than 8 readings have TVD >= z_min, or T0_h and
      q0_h are not separately resolvable (the smallest singular value of the n_h x 2 matrix [1, R_h] with each column
      scaled to unit length is below 1e-8, for example when all used readings are at one depth); for the history and the
      bounds, by the rules of step 6 (hist_dT_shape 1-D with at least 2 entries, hist_t_years 1-D with exactly
      len(hist_dT_shape) - 1 entries, both finite, hist_t_years[0] > 0 and strictly increasing, hist_dT_shape[0] !=
      hist_dT_shape[1], t_end_bounds two finite numbers with 0 < t_lo < t_hi < hist_t_years[0]); if the maximum of l_p
      over [t_lo, t_hi] is attained at t_lo or t_hi; or if a nearest crossing does not exist inside [t_lo, t_hi].
      Earlier functions you may use: true_vertical_depth (step 1), layer_integrals (step 2) and
      layered_paleoclimate_perturbation (step 5).
    function_header: |-
      def regional_deglaciation_inversion(holes, hist_t_years, hist_dT_shape, t_end_bounds):
          """Regional maximum-likelihood estimate of the glacial amplitude g and the end of the glaciation t_end
          with serially correlated (AR(1)) noise in every log.

          Parameters
          ----------
          holes : list of H >= 2 dicts, one per borehole, each with exactly the keys
              "survey_md", "survey_inc", "survey_azi", "log_md", "log_temp",
              "layer_top_md", "layer_k", "heat_production", "rho_c" and "z_min",
              with the meanings, units and rules of the arguments of the same names
              of deglaciation_heat_flow_inversion (step 6); log_md need not be sorted.
          hist_t_years, hist_dT_shape, t_end_bounds : the glacial history of step 6,
              shared by every hole: the m - 1 known interval ends (years before
              present, positive, strictly increasing), the m >= 2 shape values
              s_0 ... s_(m-1) (K per unit amplitude) and (t_lo, t_hi) in years with
              0 < t_lo < t_hi < hist_t_years[0].

          Model: in hole h the readings with TVD z >= z_min_h, numbered i = 1 ... n_h
          by increasing MD (readings at equal MD in input order), obey
          T = T0_h + q0_h R_h(z) - A_h S_h(z) + g P_h(z; t_end)
          + e_i, with P_h(z; t_end) = layered_paleoclimate_perturbation(z, the hole's
          layer tops in TVD, its layer_k, its rho_c, [t_end, *hist_t_years],
          hist_dT_shape) (step 5). The errors are a stationary Gaussian AR(1)
          sequence in i: e_1 ~ N(0, s_h^2 / (1 - phi_h^2)), e_i = phi_h e_(i-1) + w_i
          with independent w_i ~ N(0, s_h^2); phi_h (|phi_h| < 1) and s_h > 0 are
          unknown, the holes independent. Every parameter is estimated by maximum
          likelihood (exact joint density of all used readings, the first reading of
          every hole included); t_end is the global maximizer over [t_lo, t_hi] of
          the profile log-likelihood l_p(t) (maximum over all other parameters at
          t_end = t, g over the whole real line) and l_max = l_p(t_end).

          Returns
          -------
          dict: "g" (K), "t_end" (years), "sigma_g", "sigma_t_end" (standard errors:
          square roots of the diagonal of the inverse of the expected Fisher
          information of the regression parameters T0_h, q0_h, g, t_end at the
          estimates, phi_h and s_h held at their estimates; t_end in years),
          "t_end_low", "t_end_high" (years: points nearest to t_end below and above
          it where 2 (l_max - l_p(t)) = scipy.stats.chi2.ppf(0.95, 1)) and
          "log_likelihood" (l_max, natural logarithm of the joint normal density of
          all used readings) as Python floats, and "holes": a list, in the input
          order, of dicts with "T0" (deg C), "q0" (W m^-2), "sigma_T0", "sigma_q0"
          (standard errors), "phi" (maximum-likelihood phi_h), "innovation_sd"
          (maximum-likelihood s_h, K) as Python floats and "n_used" (int, readings
          used in the hole).
          Domain: at least 8 used readings per hole; maximum-likelihood s_h from
          1e-3 K to 0.03 K and phi_h from -0.9 to 0.95 in every hole.
          Accuracy: g and t_end within a relative 2e-3; every q0 within a relative
          5e-4; every T0 within 2e-3 K; the standard errors within a relative 1e-2;
          t_end_low and t_end_high within a relative 5e-4; every phi within 2e-3;
          every innovation_sd within a relative 3e-3; log_likelihood within 0.1;
          n_used exact. These limits include the errors propagated from the stated
          accuracies of steps 1, 2 and 5.

          Raises
          ------
          ValueError if holes is not a list or tuple of at least 2 dicts with exactly
          these keys; for a hole with log arrays that are not 1-D of equal length, a
          non-finite temperature, a negative or non-finite heat production, any error
          of an earlier step, fewer than 8 readings with TVD >= z_min, or T0_h and
          q0_h not separately resolvable (smallest singular value of the n_h x 2
          matrix [1, R_h] with unit-length columns below 1e-8); for an invalid
          history or invalid bounds (rules of step 6, including hist_dT_shape[0] ==
          hist_dT_shape[1]); if the maximum of l_p over [t_lo, t_hi] is attained at
          t_lo or t_hi; or if a nearest crossing does not exist inside [t_lo, t_hi].
          """
    return_line: "    return result"
    step_background: |-
      One log constrains the end of the glaciation weakly, and logs from neighbouring holes of a region record the same
      ground-surface history through different columns, depths and logging conditions, so regional studies combine
      them. The residuals of a temperature log about a conductive model are not independent from reading to reading:
      small-scale conductivity variations that the layer model does not resolve and movement of the borehole fluid
      give errors correlated over neighbouring readings. A stationary first-order autoregressive model with its own
      lag-one correlation and innovation variance in every hole is the simplest description of such noise, and
      maximum likelihood estimates these noise parameters together with the shared ones. Correlated noise carries
      less information on a smooth signal such as the glacial perturbation than independent noise of the same
      variance, which the expected information of the correlated model accounts for. The confidence interval of the
      nonlinear parameter t_end comes from the likelihood-ratio test of the profile likelihood, in which all other
      parameters, the noise parameters included, are re-maximized at every t_end; with a known distribution of the
      statistic (chi-square with one degree of freedom) it is asymmetric when the model is curved in t_end. A short
      glaciation lets amplitude trade against timing, and the profile can then have several maxima.
    n_test_cases: 8
    contract:
      quantity: "Regional exact maximum-likelihood estimate of the glacial amplitude g and of the end of the last glaciation t_end shared by several boreholes whose log noise is a stationary AR(1) sequence with its own lag-one correlation and innovation standard deviation in every hole, with every hole's T0, q0, phi and s, standard errors from the expected Fisher information, the 95 % likelihood-ratio interval of t_end and the maximized log-likelihood."
      assumptions: "Every hole as in step 6 (minimum-curvature trajectory, horizontal layers logged in MD, one-dimensional conduction with uniform heat production, the layered-column perturbation of step 5 with the hole's own rho_c, inclusive z_min cut on TVD); amplitude and history (shape, known interval ends, unknown t_end) shared by all holes; in every hole the used readings ordered by increasing MD (readings at equal MD in input order) carry a stationary Gaussian AR(1) error sequence in the reading index with unknown lag-one correlation phi_h and innovation standard deviation s_h, the holes independent; exact likelihood (first reading of every hole included) maximized with g unrestricted and t_end the global maximizer of the profile log-likelihood on [t_lo, t_hi]; standard errors from the inverse expected Fisher information of the regression parameters at the estimates with phi_h and s_h at their estimates; interval ends where 2 (l_max - l_p) equals the chi-square(1) 0.95 quantile, l_p re-maximized over all other parameters including the noise parameters, nearest crossings; the stated accuracy includes the propagated accuracies of steps 1, 2 and 5."
      result_kind: approximate
      valid_input_ranges: "At least 2 holes, each valid for step 6 with at least 8 readings with TVD >= z_min and a resolvable [1, R_h], log_md in any order (readings at equal MD taken in input order); history and bounds as in step 6; noisy logs with maximum-likelihood s_h from 1e-3 K to 0.03 K and phi_h from -0.9 to 0.95 in every hole; an end-point maximum or an interval not contained in the bounds raises ValueError."
      units: "g in K; t_end, its standard error and interval in years; T0 in deg C; q0 in W m^-2; standard errors in the units of their parameters; phi dimensionless; innovation_sd in K; log_likelihood dimensionless (natural logarithm of the joint density of the temperatures in deg C); n_used dimensionless."
      output_shape: "dict with seven Python floats (g, t_end, sigma_g, sigma_t_end, t_end_low, t_end_high, log_likelihood) and 'holes', a list in the input order of dicts with six Python floats (T0, q0, sigma_T0, sigma_q0, phi, innovation_sd) and the int n_used."
      step_dependencies: [1, 2, 5]
    mutants:
      - name: iid_noise_model
        description: "Independent errors in every hole (lag-one correlation fixed at 0: the round-2 estimator with one variance per hole) instead of the stationary AR(1) noise model; phi is reported as 0."
        file: mutants/step_7_iid_noise_model.py
      - name: conditional_likelihood
        description: "Conditional (Cochrane-Orcutt) likelihood: the first reading of each hole is conditioned on and dropped, so the likelihood has n_h - 1 innovations and no log(1 - phi^2) term, instead of the exact joint density of all readings."
        file: mutants/step_7_conditional_likelihood.py
      - name: determinant_term_omitted
        description: "Exact likelihood without the term (1/2) log(1 - phi_h^2) of the log-determinant of the AR(1) covariance (the first reading scaled but its variance factor left out of the density)."
        file: mutants/step_7_determinant_term_omitted.py
      - name: two_stage_phi_from_lag1_autocorrelation
        description: "Two-stage estimator: phi_h from the lag-one autocorrelation of the residuals of the fit with independent errors, then held fixed (feasible generalized least squares) instead of the joint maximum-likelihood phi_h."
        file: mutants/step_7_two_stage_phi_from_lag1_autocorrelation.py
      - name: two_stage_noise_parameters
        description: "Two-stage weighting: phi_h and s_h of each hole from its own single-hole maximum-likelihood fit (its own g and t_end), then held fixed in the joint fit, instead of the joint maximum-likelihood noise parameters."
        file: mutants/step_7_two_stage_noise_parameters.py
      - name: pooled_noise_model
        description: "One common lag-one correlation and one common innovation variance for all holes (pooled noise model) instead of a separate AR(1) model for every hole."
        file: mutants/step_7_pooled_noise_model.py
      - name: readings_in_input_order
        description: "Readings taken in the order of the input arrays instead of by increasing MD for the AR(1) sequence."
        file: mutants/step_7_readings_in_input_order.py
      - name: information_with_independent_errors
        description: "Fisher information with the errors treated as independent with the marginal AR(1) variance s_h^2 / (1 - phi_h^2) (J^T J divided by that variance), ignoring the correlation."
        file: mutants/step_7_information_with_independent_errors.py
      - name: information_variance_n_minus_2
        description: "Expected information evaluated with the innovation variance |u_h|^2/(n_h - 2) instead of the maximum-likelihood |u_h|^2/n_h."
        file: mutants/step_7_information_variance_n_minus_2.py
      - name: observed_information
        description: "Observed information (negative Hessian of the exact log-likelihood in all parameters, with the model curvature and the noise parameters) instead of the expected Fisher information."
        file: mutants/step_7_observed_information.py
      - name: information_blocks_inverted_separately
        description: "Nuisance parameters treated as known: the (g, t_end) block and each hole's (T0_h, q0_h) block of the information inverted separately instead of the whole matrix."
        file: mutants/step_7_information_blocks_inverted_separately.py
      - name: lr_profile_with_phi_fixed
        description: "Likelihood-ratio profile of t_end with every phi_h held at its global maximum-likelihood value (g and s_h re-maximized) instead of re-maximized at every t_end."
        file: mutants/step_7_lr_profile_with_phi_fixed.py
      - name: profile_with_fixed_noise_parameters
        description: "Likelihood-ratio profile of t_end with phi_h and s_h held at their maximum-likelihood values (estimated likelihood) instead of re-maximized at every t_end."
        file: mutants/step_7_profile_with_fixed_noise_parameters.py
      - name: lr_threshold_without_factor_2
        description: "Interval ends where l_max - l_p(t) equals the chi-square(1) quantile 3.84 instead of half of it (the factor 2 of the likelihood-ratio statistic left out)."
        file: mutants/step_7_lr_threshold_without_factor_2.py
      - name: log_likelihood_without_constant
        description: "Reported log-likelihood without the normalizing terms -(n_h/2)(log(2 pi) + 1) of the normal density."
        file: mutants/step_7_log_likelihood_without_constant.py
      - name: local_search_without_scan
        description: "t_end from one local bounded Brent search of the profile over [t_lo, t_hi] without a global scan: a local maximum in another basin can be returned."
        file: mutants/step_7_local_search_without_scan.py
      - name: first_hole_rho_c_for_all
        description: "The volumetric heat capacity of the first hole used in the glacial perturbation of every hole."
        file: mutants/step_7_first_hole_rho_c_for_all.py
      - name: halfspace_mean_diffusivity
        description: "Glacial signal from the half-space erfc perturbation (step 3) with the mean diffusivity of each hole's layers instead of the layered column (step 5)."
        file: mutants/step_7_halfspace_mean_diffusivity.py
      - name: measured_depth_as_depth
        description: "Measured depth along the inclined holes used as depth (no trajectory correction) for the readings and the layer tops."
        file: mutants/step_7_measured_depth_as_depth.py
      - name: z_min_on_measured_depth
        description: "Shallow-reading cut applied to measured depth instead of true vertical depth."
        file: mutants/step_7_z_min_on_measured_depth.py
      - name: z_min_cut_strict
        description: "Shallow-reading cut applied as TVD > z_min, so that a reading exactly at z_min is dropped."
        file: mutants/step_7_z_min_cut_strict.py
