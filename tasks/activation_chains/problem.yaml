# problem.yaml: one per task folder. File paths are relative to this folder.

domain: physics

subfield: "Nuclear physics: radioactive decay chains, neutron activation with burnup and flux-monitor analysis"

tags:
  - Bateman equations
  - radioactive decay chains
  - neutron activation
  - burnup
  - matrix exponential
  - flux monitor
  - uranium series

expert_time_estimate_hours: 12

relevant_experience: "B.Sc. in Georesources and Environment (FST Fes, 2016), known as Geological Engineering in Canada, and a graduate certificate in geomatics from Université Laval (reference frames, rotations, least-squares adjustment). GIS analyst at Morocco's Ministry of Energy and Mines (2016-2018) on exploration databases, and now running an independent geospatial consultancy (Craton Géodonnées) in Quebec that works with the drilling databases of Abitibi exploration programs."

author: "Ayoub Bousfiha"
affiliation: "Independent Researcher"

difficulty_explanation: >-
  The decay constants of natural chains span more than 20 decades (4.9e-18 to 4.2e3 per s in the 238U
  series), and every amount down to 1e-250 of the inventory (and not below 1e-300 atoms, which keeps it
  a normal double) must have a relative error below 1e-10, so both textbook methods fail: the Bateman sum cancels catastrophically for close decay constants and is
  undefined for equal ones, and a dense matrix exponential such as scipy.linalg.expm is accurate only
  relative to the largest entry. The solver has to recognise that the exact solution is a sum of
  nonnegative path contributions and build exp(tA) without subtractions, for example by scaling and
  squaring a shifted nonnegative Taylor series while resetting the exactly known diagonal exp(-lam t) at
  every squaring level; squaring the diagonal with the rest loses the 238U amounts completely. Steps 2 and
  3 add branching, constant production, neutron capture with burnup (barns converted to cm^2) and an
  acyclicity check of the combined decay and capture network, and the accuracy must hold for products
  reached only through low-probability branches or several successive captures at low flux. Step 4
  inverts a response that is not proportional to the flux (flux**m growth for an m-capture product, burnup
  turnover near 1.6e15 n / (cm^2 s) for 198Au) to a relative 1e-8 for activities of any size in the
  domain (about 2e-11 Bq for the two-capture product 199Au at low flux), with a closed-interval end rule
  whose tolerance band (1e-10 in ln) matches the stated accuracy of step 3, and a domain rule that must
  be evaluated in logarithms to avoid underflow.

solution_explanation: >-
  chain_inventory builds exp(tM) by scaling and squaring in nonnegative arithmetic: t is halved s times
  until tau max(lam) <= 1/2, exp(tau M) = exp(-c) exp(tau M + c I) with c = tau max(lam) is summed as the
  Taylor series of a nonnegative matrix, and each squaring E -> E E only adds nonnegative products while
  the diagonal is reset to its exact value exp(-lam tau 2**level). network_inventory applies the same
  scheme to the rate matrix augmented by one constant source state, after checking acyclicity with Kahn's
  algorithm. activation_inventory turns each period of the history into a branching network with total
  removal rates lam + sigma 1e-24 phi and fractions that combine decay branching and capture, and chains
  network_inventory over the periods. monitor_flux checks the domain rule
  x[k](flux_lo) >= max(1e-250 sum(n0), 1e-300) and the end rule |ln(activity / A(end))| <= 1e-9 (flux_lo first) in logarithms, then solves
  ln A(ln phi) = ln activity with brentq on the log-flux bracket, forming ln A as ln lam[k] + ln x[k] so
  that tiny activities cannot underflow.

verification_explanation: >-
  Independent targets are closed forms (single decay, Erlang amounts for equal decay constants,
  saturation with production, two-way branching, burnup exp(-sigma phi t) down to exp(-600), inventories
  of 1e-70 atoms on both sides of the floor 1e-300 of the relative rule, a combined rate of exactly 1e10
  per s), the Bateman sum evaluated in 600-digit mpmath arithmetic for linear chains
  with distinct constants (the 15-member 238U series at 1 y, 1e4 y, 3e5 y and 1e9 y, a 30-member chain of
  successive captures in step 3, and the 238U(n,gamma)239U -> 239Np -> 239Pu capture branch of the
  whole-task test), and mpmath's matrix exponential at 300 digits for branching networks with production
  and for every period of an irradiation history. The flux-inversion tests regenerate the activity from
  these 300-digit or 600-digit forward models (the flux is the input of the round trip), and the
  end-tolerance tests locate the boundary activities |ln(activity / A(end))| = 1e-9 -+ 1e-10 with 60-digit
  logarithms. Every case of tests/general.py calls monitor_flux: case 0 recovers the flux from the 239Np
  activity of the irradiated 238U series (once from the 600-digit target, once from an activity predicted
  with chain_inventory alone, compared with twice the single-output tolerance), case 1 from the 60Co
  activity of a cobalt network. The domain floor of step 4 is tested on both sides (a round trip with
  about 1e-294 atoms of the product at flux_lo, ValueError with about 1e-319). second_solution.py uses different methods and passes every test case: the
  generalized Bateman solution (each amount a sum of t**p exp(-a t) terms, built nuclide by nuclide in
  topological order with equal rates handled exactly) evaluated in mpmath with a running error bound
  (the magnitudes of the cancelling terms are carried along) and the precision raised until that bound
  is below 1e-14 of every amount or of the floor, instead of the reference's nonnegative scaling and
  squaring and of the tests' mpmath expm; and bisection on ln flux followed by secant steps instead of
  brentq. It agrees with the reference to 3.7e-14 on 120 random networks with production (2 to 30
  nuclides, including equal and nearly equal rates), to 2.8e-15 on 30 networks with inventories scaled
  to 1e-280 to 1e-50 and to 2.2e-16 on 30 networks over times of 1e-250 to 1e-20. Each step has named scientific mutants (Bateman sum in double precision, squared diagonal in
  scaling and squaring for the chain and for the network, transposed branching matrix, barns converted
  with 1e-28, activity assumed proportional to the flux), each the current reference with one mistake, and
  there is a whole-task barn-conversion mutant; each fails at least one case of its target tests (the
  whole-task mutant both general cases). The error budget of step 4 was checked by running its tests with
  the step-3 context perturbed by a relative +-9e-11 (also with opposite signs at the two ends): every case
  passes, while end cutoffs at 0.85e-9 and 1.15e-9 fail. tools/crown_check.py ran every test case alone in
  a fresh process (step k with the reference steps 1..k-1 as context, general cases with solution.py) for
  the reference, the second solution and the mutants, checked that perturbing every reference output by a
  relative +-1e-12 still passes every step case and that the general cases pass with every evaluated
  function so perturbed, and checked that all-None and all-zero controls pass no case. Both solutions were
  also run twice in clean processes on the same inputs and gave identical outputs.

required_dependencies: |-
  import numpy as np
  from scipy.optimize import brentq
  import mpmath as mp

problem_description_main: |-
  Radioactive nuclides decay into one another, and in a neutron flux they also capture neutrons and
  turn into heavier nuclides. The number of atoms of every nuclide then obeys a linear system
  dx/dt = A x (+ production), where A has the decay and capture rates off its diagonal and minus the
  total removal rates on it. Its solution is the matrix exponential, which Bateman wrote as a sum of
  exponentials for a linear chain. We compute inventories of decay chains, of branching networks with
  constant production and of materials under an irradiation history with neutron capture. We then
  invert a measured activation activity for the neutron flux, the analysis of a flux monitor. The
  rates span many decades (from 1e-18 to 1e4 per second in the uranium series), and the amounts of
  interest can be far below the rounding error of the largest ones. These amounts, down to the floor
  stated in each step, are required with a small relative error, so neither the Bateman sum in double
  precision nor a dense matrix exponential is good enough.

problem_io: |-
  def monitor_flux(lam, branching, sigma, capture_to, n0, t_irr, t_cool, k, activity, flux_lo, flux_hi):
      '''Neutron flux from the measured activity of an activation product (flux-monitor analysis).

      Inputs:
        lam: 1-D array of n decay constants in 1/s (1 <= n <= 30), 0 <= lam[i] <= 1e10.
        branching: (n, n) array, branching[j, i] = fraction of the decays of nuclide i that give nuclide j;
                   nonnegative, zero diagonal, column sums at most 1 + 1e-12.
        sigma: 1-D array of n radiative-capture cross sections in barns, sigma[i] = 0 or 1e-6 <= sigma[i] <= 1e7.
        capture_to: 1-D integer array of n entries, the nuclide made by a capture on nuclide i, or -1 if
                    it is not followed; never i itself.
        n0: 1-D array of n initial numbers of atoms, nonnegative, sum(n0) <= 1e100.
        All values finite; the combined decay and capture network must be acyclic, exactly as in
        activation_inventory (step 3).
        t_irr: irradiation time in s at a constant unknown flux, 0 < t_irr <= 1e9.
        t_cool: cooling time in s without flux after the irradiation, 0 <= t_cool <= 1e9.
        k: int, index of the measured nuclide, with lam[k] > 0.
        activity: measured activity lam[k] * x[k] of nuclide k at the end of the cooling, in Bq, > 0.
        flux_lo, flux_hi: the flux lies in [flux_lo, flux_hi], 1e-2 <= flux_lo < flux_hi <= 1e18, and the
             caller guarantees that the activity A(flux) is strictly increasing on this interval.

      Output:
        flux: Python float, the flux in neutrons / (cm^2 s) with A(flux) = activity, A computed with
              activation_inventory (step 3); relative error below 1e-8 wherever d ln A / d ln flux >= 0.5
              at the solution, for activities of any size within the domain.

      Raises:
        ValueError for nuclide data as in step 3, for times, k, activity or flux bounds outside these
        ranges (NaN and infinite values included), if A(flux_lo) < lam[k] * max(1e-250 * sum(n0), 1e-300)
        (at flux_lo the measured nuclide must hold at least 1e-250 of the initial atoms and at least 1e-300
        atoms; for x[k](flux_lo) within a relative 1e-10 of this bound, the accuracy of step 3,
        ValueError and a result are both correct), or if activity lies outside [A(flux_lo), A(flux_hi)]
        by more than a relative 1e-9.
        An activity with |ln(activity / A(end))| <= 1e-9 for an end of the interval, on either side of
        it, gives that end (flux_lo is checked first); the end is returned as the given bound itself, equal
        to it to a relative 1e-11. A is known to a relative 1e-10 (the accuracy of step 3), so the
        tolerance holds up to 1e-10 in ln: for 1e-9 - 1e-10 < |ln| <= 1e-9 + 1e-10 the end, the root and
        (outside the interval) ValueError are all correct.
      '''

general_tests: tests/general.py

second_solution: second_solution.py

mutants:
  - name: whole_task_barn_in_square_metres
    description: "Converts capture cross sections from barns with 1e-28 (m^2) instead of 1e-24 (cm^2), so every capture rate is 1e4 times too small."
    file: mutants/whole_task_barn_in_square_metres.py

# On a new version of an uploaded task only, what kind of edit it is.
edit_label: grading_fix

sub_steps:
  - step_number: 1
    scaffold: steps/step_1.py
    solution: solution/step_1.py
    tests: tests/step_1.py
    step_description_prompt: |-
      A linear decay chain has members 0, ..., n - 1. Member i decays with the constant lam[i] into member
      i + 1, and the last member decays out of the chain (lam = 0 means stable). With dx/dt = M x,
      M[i, i] = -lam[i] and M[i + 1, i] = lam[i], return x(t) = exp(t M) n0 for the initial numbers of
      atoms n0 (any members may be populated).

      Let S = sum(n0) and F = max(1e-250 * S, 1e-300). Every entry of x whose exact value is at least F
      must have a relative error below 1e-10, however small it is compared with the other entries. Every
      other entry, exact zeros included, must lie within F of the exact value. Decay constants may be
      equal or arbitrarily close to one another, and they may span more than 20 decades in one chain.
      Inputs: lam and n0, 1-D arrays of the same length n (1 <= n <= 30), with 0 <= lam[i] <= 1e10 and
      n0 >= 0 with sum(n0) <= 1e100; t with 0 <= t <= 1e20 (lam and t in consistent units).
      Errors: raise ValueError if lam and n0 are not 1-D arrays of the same length in [1, 30], if a decay
      constant is negative, above 1e10 or not finite, if an initial amount is negative or not finite, if
      sum(n0) > 1e100, or if t is not finite or outside [0, 1e20].
    function_header: |-
      def chain_inventory(lam, n0, t):
          '''Atoms of every member of a linear radioactive decay chain after a time t (Bateman problem).

          Inputs:
            lam: 1-D array of n decay constants (1 <= n <= 30), member i decays into member i + 1 at the
                 rate lam[i]; the last member decays out of the chain. 0 <= lam[i] <= 1e10 (per unit of time).
            n0: 1-D array of n initial numbers of atoms, nonnegative, sum(n0) <= 1e100.
            t: elapsed time, 0 <= t <= 1e20 (same unit of time).

          Output:
            x: numpy array of shape (n,), the numbers of atoms at time t. With S = sum(n0) and
               F = max(1e-250 * S, 1e-300): every entry whose exact value is at least F has a relative error
               below 1e-10; every other entry (exact zeros included) lies within F of the exact value.

          Raises:
            ValueError if lam and n0 are not 1-D arrays of the same length between 1 and 30, if an entry of
            lam is negative, above 1e10 or not finite, if an entry of n0 is negative or not finite, if
            sum(n0) > 1e100, or if t is not finite or outside [0, 1e20].
          '''
    return_line: return x
    step_background: |-
      Bateman (1910) solved the linear chain as x_k = n0 prod lam * sum_i exp(-lam_i t) /
      prod_{l != i} (lam_l - lam_i). In floating point this sum cancels catastrophically when decay
      constants are close, and it is undefined when two are equal. A dense matrix exponential is accurate
      only relative to the largest entry. The exact solution is a positive combination of positive terms
      (the off-diagonal entries of M are nonnegative), so methods that keep every operation nonnegative
      can keep the relative accuracy of every entry.
    n_test_cases: 7
    contract:
      quantity: "Numbers of atoms of the members of a linear radioactive decay chain after a time t."
      assumptions: "Constant decay constants, first-order kinetics, the last member decays out of the chain."
      result_kind: exact
      valid_input_ranges: "1 <= n <= 30; 0 <= lam <= 1e10; n0 >= 0, sum(n0) <= 1e100; 0 <= t <= 1e20; all values finite."
      units: "Atoms; lam and t in consistent units."
      output_shape: "numpy float array of shape (n,)."
      step_dependencies: []
    mutants:
      - name: float_bateman
        description: "Evaluates the Bateman sum in double precision (equal constants split by 1e-9), which cancels for close decay constants."
        file: mutants/step_1_float_bateman.py
      - name: chain_squared_diagonal
        description: "Squares the diagonal together with the rest in scaling and squaring, which doubles its rounding error at every level."
        file: mutants/step_1_squared_diagonal.py

  - step_number: 2
    scaffold: steps/step_2.py
    solution: solution/step_2.py
    tests: tests/step_2.py
    step_description_prompt: |-
      Generalize the linear chain of step 1 to a branching network with constant production.
      - Nuclide i decays at the rate lam[i].
      - A fraction branching[j, i] of its decays gives nuclide j. The column sums are at most 1 (sums up
        to 1 + 1e-12 are accepted as rounding of 1); the rest leaves the network.
      - Nuclide i is also produced at the constant rate source[i] (atoms per unit time).

      The equations are dx_j/dt = -lam[j] x_j + sum_i branching[j, i] lam[i] x_i + source[j]. Return
      x(t) for the initial amounts n0.

      The network given by the edges i -> j with branching[j, i] > 0 must be acyclic, as decay networks
      are; the nuclides may be given in any order. Let S = sum(n0) + t * sum(source) and
      F = max(1e-250 * S, 1e-300). Every entry of x whose exact value is at least F must have a relative
      error below 1e-10; every other entry, exact zeros included, must lie within F of the exact value.
      This includes amounts that are reached only through low-probability branches.
      Inputs: lam, source, n0 (1-D, length n, 1 <= n <= 30), branching (n x n), t; all entries nonnegative
      and finite, lam <= 1e10, 0 <= t <= 1e20, sum(n0) + t * sum(source) <= 1e100.
      Errors: raise ValueError if the shapes are wrong, if an entry is negative or not finite, if a decay
      constant exceeds 1e10, if a diagonal entry of branching is nonzero or a column sum exceeds
      1 + 1e-12, if the network has a cycle, if t is not finite or outside [0, 1e20], or if
      sum(n0) + t * sum(source) > 1e100.
    function_header: |-
      def network_inventory(lam, branching, source, n0, t):
          '''Atoms of every nuclide of a branching decay network with constant production after a time t.

          Inputs:
            lam: 1-D array of n decay constants (1 <= n <= 30), 0 <= lam[i] <= 1e10 (per unit of time).
            branching: (n, n) array, branching[j, i] = fraction of the decays of nuclide i that give nuclide j;
                       nonnegative, zero diagonal, column sums at most 1 + 1e-12 (1 up to rounding; the rest
                       leaves the network). The
                       directed graph with an edge i -> j wherever branching[j, i] > 0 must be acyclic.
            source: 1-D array of n constant production rates (atoms per unit of time), nonnegative.
            n0: 1-D array of n initial numbers of atoms, nonnegative.
            t: elapsed time, 0 <= t <= 1e20, with sum(n0) + t * sum(source) <= 1e100.

          Output:
            x: numpy array of shape (n,), the numbers of atoms at time t. With S = sum(n0) + t * sum(source)
               and F = max(1e-250 * S, 1e-300): every entry whose exact value is at least F has a relative error
               below 1e-10; every other entry (exact zeros included) lies within F of the exact value.

          Raises:
            ValueError if the arrays do not have these shapes (1 <= n <= 30), if an entry is negative or not
            finite, if a decay constant exceeds 1e10, if a diagonal entry of branching is nonzero or a column
            sum exceeds 1 + 1e-12, if the network has a cycle, if t is not finite or outside [0, 1e20], or if
            sum(n0) + t * sum(source) > 1e100.
          '''
    return_line: return x
    step_background: |-
      Real decay schemes branch (for example 214Bi decays to 214Po and in 0.02 % of cases to 210Tl), and
      nuclides are produced at constant rates in reactors, by cosmic rays or in accelerators. A source
      approaches the saturation amount source / lam.
    n_test_cases: 6
    contract:
      quantity: "Numbers of atoms in an acyclic branching decay network with constant production after a time t."
      assumptions: "First-order decay with branching fractions, constant production rates, acyclic network."
      result_kind: exact
      valid_input_ranges: "1 <= n <= 30; lam, branching, source, n0 nonnegative and finite; lam <= 1e10; branching with zero diagonal, column sums <= 1 + 1e-12 and an acyclic graph; 0 <= t <= 1e20; sum(n0) + t * sum(source) <= 1e100."
      units: "Atoms; rates and t in consistent units."
      output_shape: "numpy float array of shape (n,)."
      step_dependencies: []
    mutants:
      - name: transposed_branching
        description: "Reads branching[i, j] instead of branching[j, i] as the fraction of decays of i giving j."
        file: mutants/step_2_transposed_branching.py
      - name: network_squared_diagonal
        description: "Squares the diagonal together with the rest in scaling and squaring."
        file: mutants/step_2_squared_diagonal.py

  - step_number: 3
    scaffold: steps/step_3.py
    solution: solution/step_3.py
    tests: tests/step_3.py
    step_description_prompt: |-
      Neutron activation. A sample is irradiated according to a history of periods (duration in s,
      neutron flux phi in neutrons / (cm^2 s)); a period with phi = 0 is cooling.
      - During a period, nuclide i decays as in network_inventory (step 2), with constant lam[i] in 1/s
        and the given branching fractions.
      - It also captures neutrons at the rate sigma[i] * 1e-24 * phi, where sigma[i] is its
        radiative-capture cross section in barns.
      - A capture removes the atom (burnup) and makes nuclide capture_to[i], or a nuclide that is not
        followed if capture_to[i] = -1.

      Return the numbers of atoms at the end of the history for the initial amounts n0; use
      network_inventory (step 2) for the periods. Let S = sum(n0) and F = max(1e-250 * S, 1e-300). Every
      entry whose exact value is at least F must have a relative error below 1e-10; every other entry,
      exact zeros included, must lie within F of the exact value. This includes products of several
      successive captures at low flux. The branching matrix is checked as in step 2 even when the history
      is empty.
      Inputs:
        lam, sigma, n0: 1-D, length n with 1 <= n <= 30; 0 <= lam <= 1e10 per s, sigma = 0 or 1e-6 <= sigma <= 1e7 b,
                        n0 >= 0 with sum(n0) <= 1e100.
        branching: n x n, as in step 2.
        capture_to: integer array of length n.
        history: a list or tuple of (duration, flux) pairs, applied in order, with 0 <= duration <= 1e12 s and
                 0 <= flux <= 1e18.
      Errors: raise ValueError if:
        - the shapes or ranges above are violated, or a value is not finite;
        - capture_to is not an integer array with entries in [-1, n - 1], or capture_to[i] = i;
        - branching violates the conditions of step 2;
        - the combined network has a cycle (edges i -> j where branching[j, i] > 0, or where sigma[i] > 0
          and capture_to[i] = j);
        - history is not a list or tuple (unordered or one-shot containers such as sets and generators
          are rejected), or an entry is not a pair of numbers in range;
        - lam[i] + sigma[i] * 1e-24 * flux exceeds 1e10 per s in some period.
    function_header: |-
      def activation_inventory(lam, branching, sigma, capture_to, n0, history):
          '''Atoms of every nuclide after an irradiation history with neutron capture, decay and cooling.

          Inputs:
            lam: 1-D array of n decay constants in 1/s (1 <= n <= 30), 0 <= lam[i] <= 1e10.
            branching: (n, n) array of decay branching fractions as in network_inventory (step 2).
            sigma: 1-D array of n radiative-capture cross sections in barns (1 b = 1e-24 cm^2), sigma[i] = 0 or 1e-6 <= sigma[i] <= 1e7.
            capture_to: 1-D integer array of n entries; capture_to[i] = index of the nuclide made by a capture
                        on nuclide i, or -1 if that product is not followed.
            n0: 1-D array of n initial numbers of atoms, nonnegative, sum(n0) <= 1e100.
            history: list or tuple of (duration, flux) pairs applied in order; duration in s (0 <= duration <= 1e12),
                     flux in neutrons / (cm^2 s) (0 <= flux <= 1e18; flux 0 is a cooling period).

          Output:
            x: numpy array of shape (n,), the numbers of atoms at the end of the history. With S = sum(n0) and
               F = max(1e-250 * S, 1e-300): every entry whose exact value is at least F has a relative error
               below 1e-10; every other entry (exact zeros included) lies within F of the exact value.

          Raises:
            ValueError for inputs outside these ranges or of the wrong shape, for a capture_to entry that is not
            an integer in [-1, n - 1] or equals its own index, for branching as in step 2, or if the combined
            decay and capture network (edges where branching[j, i] > 0 or sigma[i] > 0 and capture_to[i] = j)
            has a cycle, or if lam[i] + sigma[i] * 1e-24 * flux exceeds 1e10 per s in some period.
          '''
    return_line: return x
    step_background: |-
      Neutron activation turns stable nuclides into radioactive ones. Its rate sigma * phi uses the cross
      section in cm^2: 1 barn = 1e-24 cm^2, and fluxes are in neutrons per cm^2 per second. At high fluence
      the target and the products are burnt up by further captures; 198Au, with a cross section of
      25100 b, is a well-known case.
    n_test_cases: 6
    contract:
      quantity: "Inventory of a sample after an irradiation history with neutron capture, burnup, decay and cooling."
      assumptions: "Constant flux within each period, one-group capture cross sections in barns, capture product capture_to[i], acyclic combined network."
      result_kind: exact
      valid_input_ranges: "1 <= n <= 30; 0 <= lam <= 1e10 per s; sigma = 0 or 1e-6 <= sigma <= 1e7 b; n0 >= 0 with sum(n0) <= 1e100; branching as in step 2; capture_to integers in [-1, n - 1] with capture_to[i] != i; acyclic combined decay and capture network; history a list or tuple of (duration, flux) pairs with 0 <= duration <= 1e12 s and 0 <= flux <= 1e18 n / (cm^2 s); lam + sigma * 1e-24 * flux <= 1e10 per s in every period; all values finite."
      units: "Atoms; s, barns, neutrons / (cm^2 s)."
      output_shape: "numpy float array of shape (n,)."
      step_dependencies: [2]
    mutants:
      - name: barn_in_square_metres
        description: "Converts barns to m^2 (1e-28) although the flux is per cm^2."
        file: mutants/step_3_barn_in_square_metres.py

  - step_number: 4
    scaffold: steps/step_4.py
    solution: solution/step_4.py
    tests: tests/step_4.py
    step_description_prompt: |-
      Flux-monitor analysis. A monitor sample with the nuclide data and initial amounts of
      activation_inventory (step 3) is irradiated for t_irr seconds at an unknown constant flux phi and
      then cooled for t_cool seconds. Afterwards the activity lam[k] * x[k] of nuclide k is measured.
      The predicted activity A(phi) is computed with activation_inventory (step 3).

      Return phi such that A(phi) equals the measured activity. The caller gives an
      interval [flux_lo, flux_hi] on which A is strictly increasing. It is not proportional to phi: a
      product of m successive captures grows like phi**m at low flux, and burnup of the target and of the
      product bends A over at high flux.

      The result must have a relative error below 1e-8 wherever d ln A / d ln phi >= 0.5 at the solution,
      for activities of any size within the domain below. The interval is closed, with a two-sided
      tolerance at its ends: if |ln(activity / A(flux_lo))| <= 1e-9 return flux_lo, else if
      |ln(activity / A(flux_hi))| <= 1e-9 return flux_hi (on either side of the end value). The end is
      returned as the given bound itself (not a root estimate), equal to it to a relative 1e-11.
      activation_inventory gives A only to a relative 1e-10, so this tolerance holds up to 1e-10 in ln:
      for 1e-9 - 1e-10 < |ln| <= 1e-9 + 1e-10 the end, the root and (outside the interval) ValueError are
      all correct. Positive cross sections are at least 1e-6 b. Domain: at flux_lo the measured nuclide
      must hold at least 1e-250 of the initial atoms and at least 1e-300 atoms, i.e.
      A(flux_lo) >= lam[k] * max(1e-250 * sum(n0), 1e-300) (the range in which step 3 gives x[k] to a
      relative 1e-10); otherwise raise ValueError. This holds as well when lam[k] is so small that
      lam[k] * max(1e-250 * sum(n0), 1e-300) is below the smallest positive double. Since step 3 gives
      x[k] only to a relative 1e-10, ValueError and a result are both correct when x[k](flux_lo) lies
      within a relative 1e-10 of max(1e-250 * sum(n0), 1e-300).
      Inputs:
        lam, sigma, n0: 1-D, length n with 1 <= n <= 30; 0 <= lam <= 1e10 per s, sigma = 0 or 1e-6 <= sigma <= 1e7 b,
                        n0 >= 0 with sum(n0) <= 1e100; all finite.
        branching: n x n, nonnegative, zero diagonal, column sums at most 1 + 1e-12.
        capture_to: integer array of length n with entries in [-1, n - 1] and capture_to[i] != i; the
                    combined decay and capture network must be acyclic (as in step 3).
        t_irr, t_cool: 0 < t_irr <= 1e9 s and 0 <= t_cool <= 1e9 s.
        k: an integer with lam[k] > 0.
        activity: > 0, in Bq.
        flux_lo, flux_hi: 1e-2 <= flux_lo < flux_hi <= 1e18.
      Errors: raise ValueError for:
        - nuclide data rejected by step 3;
        - times not finite or out of range;
        - k not an integer (bool is not accepted) or not the index of a radioactive nuclide;
        - activity not positive or not finite;
        - flux bounds not finite or out of range;
        - A(flux_lo) < lam[k] * max(1e-250 * sum(n0), 1e-300);
        - an activity outside [A(flux_lo), A(flux_hi)] by more than a relative 1e-9.
    function_header: |-
      def monitor_flux(lam, branching, sigma, capture_to, n0, t_irr, t_cool, k, activity, flux_lo, flux_hi):
          '''Neutron flux from the measured activity of an activation product (flux-monitor analysis).

          Inputs:
            lam: 1-D array of n decay constants in 1/s (1 <= n <= 30), 0 <= lam[i] <= 1e10.
            branching: (n, n) array, branching[j, i] = fraction of the decays of nuclide i that give nuclide j;
                       nonnegative, zero diagonal, column sums at most 1 + 1e-12.
            sigma: 1-D array of n radiative-capture cross sections in barns, sigma[i] = 0 or 1e-6 <= sigma[i] <= 1e7.
            capture_to: 1-D integer array of n entries, the nuclide made by a capture on nuclide i, or -1 if
                        it is not followed; never i itself.
            n0: 1-D array of n initial numbers of atoms, nonnegative, sum(n0) <= 1e100.
            All values finite; the combined decay and capture network must be acyclic, exactly as in
            activation_inventory (step 3).
            t_irr: irradiation time in s at a constant unknown flux, 0 < t_irr <= 1e9.
            t_cool: cooling time in s without flux after the irradiation, 0 <= t_cool <= 1e9.
            k: int, index of the measured nuclide, with lam[k] > 0.
            activity: measured activity lam[k] * x[k] of nuclide k at the end of the cooling, in Bq, > 0.
            flux_lo, flux_hi: the flux lies in [flux_lo, flux_hi], 1e-2 <= flux_lo < flux_hi <= 1e18, and the
                 caller guarantees that the activity A(flux) is strictly increasing on this interval.

          Output:
            flux: Python float, the flux in neutrons / (cm^2 s) with A(flux) = activity, A computed with
                  activation_inventory (step 3); relative error below 1e-8 wherever d ln A / d ln flux >= 0.5
                  at the solution, for activities of any size within the domain.

          Raises:
            ValueError for nuclide data as in step 3, for times, k, activity or flux bounds outside these
            ranges (NaN and infinite values included), if A(flux_lo) < lam[k] * max(1e-250 * sum(n0), 1e-300)
            (at flux_lo the measured nuclide must hold at least 1e-250 of the initial atoms and at least 1e-300
            atoms; for x[k](flux_lo) within a relative 1e-10 of this bound, the accuracy of step 3,
            ValueError and a result are both correct), or if activity lies outside [A(flux_lo), A(flux_hi)]
            by more than a relative 1e-9.
            An activity with |ln(activity / A(end))| <= 1e-9 for an end of the interval, on either side of
            it, gives that end (flux_lo is checked first); the end is returned as the given bound itself, equal
            to it to a relative 1e-11. A is known to a relative 1e-10 (the accuracy of step 3), so the
            tolerance holds up to 1e-10 in ln: for 1e-9 - 1e-10 < |ln| <= 1e-9 + 1e-10 the end, the root and
            (outside the interval) ValueError are all correct.
          '''
    return_line: return flux
    step_background: |-
      Gold and cobalt foils are standard flux monitors. The 198Au or 60Co activity measured after the
      irradiation gives the flux. At low fluence the activity is proportional to the flux, but burnup of a
      large-cross-section product makes the response saturate and turn over. Second-order products such
      as 199Au grow like phi**2.
    n_test_cases: 6
    contract:
      quantity: "Neutron flux that reproduces a measured activation activity after irradiation and cooling."
      assumptions: "Constant flux during the irradiation, none during cooling; A(phi) strictly increasing on the given interval."
      result_kind: exact
      valid_input_ranges: "Nuclide data of step 3; 0 < t_irr <= 1e9 s; 0 <= t_cool <= 1e9 s; k an integer (not bool) with lam[k] > 0; activity > 0 and finite; 1e-2 <= flux_lo < flux_hi <= 1e18 with A strictly increasing on [flux_lo, flux_hi]; A(flux_lo) >= lam[k] * max(1e-250 * sum(n0), 1e-300), with ValueError and a result both correct when x[k](flux_lo) is within a relative 1e-10 of max(1e-250 * sum(n0), 1e-300)."
      units: "Neutrons / (cm^2 s)."
      output_shape: "One Python float."
      step_dependencies: [3]
    mutants:
      - name: linear_response
        description: "Assumes the activity is proportional to the flux and scales from its value at flux_lo."
        file: mutants/step_4_linear_response.py
