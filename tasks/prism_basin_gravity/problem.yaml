  expert_time_estimate_hours: 14
  difficulty_explanation: >-
    The closed forms of the prism potential, attraction and gradient tensor (Nagy, Papp and Benedek 2000) are
    exact, but their corner terms grow like the square of the distance while the field decays, so evaluated as
    written they lose about (distance / size)^2 of their digits far away (for a 100 m x 200 m x 250 m prism, U
    is off by a median 6.5e-9 relative at 100 diagonals, 9e-6 at 1000 and 1e-2 at 1e4, and has the wrong sign
    in most directions at a million; a thin plate is a hundred to a thousand times worse) and, for a rod or a
    plate, already within two diagonals (about 1e-8 for aspect ratio 1000), while the stated accuracy must
    hold up to a million diagonals and for aspect ratios up to 1000; the solver has to change method far away
    and handle elongated prisms near them. Near and on the prism it must take the right limits of 0 ln 0 and
    atan(0/0) on faces, edges and corners, rewrite ln(a + r) for a < 0 to avoid cancellation, and refuse the
    gradient tensor on the surface where it jumps or diverges. A column whose density contrast decays as drho0
    exp(-lam z) has no closed-form attraction; its lamina term varies on the scale of the station's distance
    to the column edges (one 64-point Gauss-Legendre rule over the depth of a 3 km column is off by up to 1e-3
    relative for a station a metre from an edge, and 1024 points still by 6e-6 a millimetre from one) and its
    four arctangents cancel far from the column (about 1e-7 relative lost 5000 widths away, every digit 2e5
    widths away), while 1e-10 is required at every distance up to 1e7 m. The last step inverts the anomaly of
    up to 100 such columns, from a thousandth of a cell width to three cell widths deep, for their depths to
    1e-8 relative: over that domain the depths amplify relative data errors by up to about 8e5 (a basin three
    widths deep everywhere with lam depth = 2; up to about 3e4 for a column a thousandth of a width deep amid
    deep ones, an amplification that grows like the width over the depth below that bound), so the forward
    model must be accurate to about 1e-14, and Newton's method with step halving stalls on rough basins
    (shallow columns beside deep ones), so the iteration needs a trust region, a damping strategy or another
    globalization.
  solution_explanation: >-
    prism_gravity and prism_gradients evaluate the corner sums of Nagy et al. (terms such as x y ln(z + r) and
    z^2 atan(x y / (z r)) and their derivatives), vectorised over the points, within two diagonals of the
    prism centre, with ln(a + r) computed as ln((b^2 + c^2) / (r - a)) for a < 0, the ln(b^2 + c^2) part
    dropped on the line of an edge where it cancels between the two corners, 0 ln 0 = 0 and atan(n / 0) =
    sign(n) pi / 2; beyond two diagonals both use a 16^3-point Gauss-Legendre volume rule of 1/r and its
    derivatives, and prism_gradients rejects points on the closed surface. A prism whose diag^3 / volume
    exceeds 200 (a rod or a plate) is cut into equal pieces below that ratio, each taken by its corner sums
    within two of its own diagonals and by a Gauss-Legendre rule of distance-dependent order beyond, the cuts
    being shifted by half a piece for points close to one. column_gz integrates G drho0 exp(-lam z) Omega(z)
    over depth, Omega the solid angle of a horizontal lamina, with 20-point Gauss-Legendre panels on a
    geometric grid from the top (ratio 2, down to 2^-60 of the depth); Omega is the corner sum of atan2(x y, Z
    r) near the column and, beyond a horizontal distance of the larger width, the Van Oosterom-Strackee
    formula for the two triangles of the lamina, which does not cancel. invert_basin_depths validates the
    data, starts from the infinite-slab thickness under each station (-ln(1 - lam d) / lam with d = gz / (2 pi
    G drho0), or d for lam = 0), runs scipy's trust-region reflective least squares on the depths (bounded by
    1.5 times the largest depth of the stated domain) with the analytic Jacobian dg_i / dh_j = G drho0
    exp(-lam h_j) Omega_ij(h_j), and finishes with Newton's method until the relative depth update is below
    1e-13; its forward model sums, for every column, 20-point Gauss-Legendre panels over depth that start at a
    sixty-fourth of the smallest cell width and double.
  verification_explanation: >-
    The prism targets of steps 1 and 2 are the closed forms evaluated with mpmath at 60 digits (90 digits for
    the rod and the plate of aspect ratio 1000), with the same limit conventions; the column targets of step 3
    are 30- to 70-digit mpmath tanh-sinh quadratures of the lamina term over depth, or the 60- and 90-digit
    prism closed forms for lam = 0, from 1e-6 m to 1e7 m from the column; the basin anomalies of step 4 and
    tests/general.py are 25- and 30-digit quadratures of every station-column pair or, for the 100-cell basin
    with lam = 0, sums of 60-digit prism closed forms, and the one-cell basin of general case 1 uses the
    60-digit closed form of its prism, confirmed to 30 digits by a 50-digit quadrature over depth; two stations
    of the basin with columns at both depth limits (1e-3 and 3 cell widths) were recomputed by a different
    formula (a two-dimensional quadrature of z / r^3 integrated in closed form along y) and agree to 20 digits;
    the depths are the known inputs; the one-cell basin 5e4 m deep (the depth limit) has 40-digit quadrature data
    (60-digit closed form for lam = 0) and the one-row and one-column basins 30-digit quadrature or 60-digit
    closed-form data, each confirmed by a second quadrature. Analytic checks complement them: the cube at its
    centre and corners (U from (3/2) ln(2 + sqrt 3) - pi/4, g from 2 ln(1 + sqrt 2) - ln(2 + sqrt 3) + pi/6),
    the tensor at the centre of a prism (-8 G rho diag(atan(b c / (a r)), ...)), Poisson's and Laplace's
    equations, the jump -4 pi G rho n n^T across a face, a column with lam = 0 equal to the prism, and exact
    scaling, superposition, translation, symmetry and density-linearity identities applied to stored
    targets. second_solution.py uses different methods in every step: for
    the prism, beyond three diagonals, the multipole (Cartesian Taylor) expansion of 1/r with the exact moments
    of the box and, closer, a reduction to one dimension (the two-dimensional closed forms of the laminae along
    one axis, or a Gauss-Legendre rule for laminae far from the point, integrated along the axis on
    Gauss-Legendre panels that shrink geometrically toward the plane of the point, T_ww from Poisson's
    equation); adaptive QUADPACK over depth for the column; for the basin, a tanh-sinh rule over depth in the
    forward model and Levenberg-Marquardt iterations on the depths, projected on the admissible box (or
    reflected at its bounds if that stalls), run to convergence. It passes every case. Each step has named
    scientific mutants (corner sums as written at every point, ln(x + r) evaluated directly, no cutting of
    elongated prisms, one 64-point depth rule, the density decay ignored, the lamina corner sum far away,
    infinite-slab thicknesses returned as depths, Newton with step halving only) and a whole-task mutant that
    handles the attraction in mGal throughout (its inverted depths are at least 1e5 times too small); each fails
    at least one case of its target tests. tools/crown_check.py ran every test case alone in a fresh process
    (step k with the reference steps 1..k-1 as context, general cases with solution.py) for the reference, the
    second solution and the mutants, checked that every general case calls invert_basin_depths, that perturbing
    every reference output by a relative +-1e-12 (in the general cases, every evaluated function shifted) still
    passes every case, and that all-None and all-zero controls pass no case. Outside the tests: both solutions
    against 90-digit closed forms (g and T by mpmath differentiation) on 28 random prisms of aspect ratio up to
    1000 at points inside, on the surface, near and up to a million diagonals away (worst error 4.3e-3 of a
    tolerance for the reference, 9.2e-4 for the second solution); 240 random basins (smooth, random, bimodal and
    rough depths, up to 100 cells) and 240 more with columns at or within ten times the lower depth limit 1e-3
    w_min beside columns at 0.7 to 1 times the upper limit (or all near the lower one), each inverted by the
    reference from data of the second solution's forward model and by the second solution from data of the
    reference's (no failure, worst depth error 1.5e-11); the amplification of relative data errors into relative
    depths, from the Jacobian, is at most 7.9e5 over the stated domain in structured, random and greedy
    searches; both solutions were run twice in clean processes and with one and two BLAS threads, with identical
    outputs.

# On a new version of an uploaded task only, what kind of edit it is.
edit_label: grading_fix

required_dependencies: |-
  import numpy as np
  import math
  from scipy.integrate import quad
  from scipy.optimize import least_squares

problem_description_main: |-
  Gravity surveys map the density of the subsurface. The building block of most forward models is the
  right rectangular prism of uniform density, whose potential, attraction and gravity gradients have
  closed forms (Nagy, Papp and Benedek 2000), and sedimentary basins are commonly modelled as columns
  whose density contrast with the basement decays with depth as the sediments compact. We compute the
  potential and attraction of a prism (its longest edge at most 1000 times its shortest) at any point, its
  gravity-gradient tensor, the attraction of a column with an exponentially decaying density contrast, and
  finally the depths of a basin from its gravity anomaly.

  Conventions used in every step. Coordinates x, y (horizontal) and z (positive downward, depth) in
  metres; G = 6.6743e-11 m^3 kg^-1 s^-2. A density rho (kg m^-3) in a volume V produces the potential
  U(P) = G int_V rho / |Q - P| dV(Q) (m^2 s^-2) and the attraction g = grad U at P (m s^-2), which points
  toward the mass for rho > 0; its z component is positive downward. The gravity-gradient tensor is
  T_ij = d g_i / d x_j at P (s^-2).

problem_io: |-
  def invert_basin_depths(x_edges, y_edges, gz_obs, drho0, lam):
      """Depths of a basin of columns (density contrast drho0 exp(-lam z)) from its gravity anomaly.

      Inputs:
        x_edges, y_edges: 1-D float arrays of nx + 1 and ny + 1 entries (nx, ny >= 1), strictly increasing,
          nx ny <= 100.
        gz_obs: float array (nx, ny), the vertical attraction (m s^-2) of all columns at the cell centres on
          the surface z = 0; it is that of a basin whose every depth satisfies 1e-3 w_min <= depth <= 3 w_min
          (w_min the smallest cell width, in x or y), depth <= 5e4 m and lam depth <= 2.
        drho0: float, nonzero density contrast at the surface (kg m^-3).
        lam: float, 0 <= lam <= 1e-2 (per m).

      Output:
        depths: numpy array (nx, ny) in m (also when nx or ny is 1), each with a relative error below 1e-8.

      Raises:
        ValueError for edges that are not strictly increasing, nx ny > 100, gz_obs of the wrong shape,
        drho0 = 0, lam outside [0, 1e-2], an observation that is zero or of the sign opposite to drho0,
        or (lam > 0) an observation of at least 2 pi G |drho0| / lam.
      """

general_tests: tests/general.py

second_solution: second_solution.py

mutants:
  - name: whole_task_mgal
    description: "Handles the attraction in mGal (1e-5 m s^-2, the unit in which gravity anomalies are reported) instead of m s^-2: prism_gravity and column_gz return it in mGal and invert_basin_depths reads gz_obs as mGal, so the inverted basin is at least 1e5 times too shallow."
    file: mutants/whole_task_mgal.py

sub_steps:

  - step_number: 1
    scaffold: steps/step_1.py
    solution: solution/step_1.py
    tests: tests/step_1.py
    step_description_prompt: |-
      Potential and attraction of a right rectangular prism x1 <= x <= x2, y1 <= y <= y2, z1 <= z <= z2 of
      uniform density rho at observation points P (see the conventions). bounds = (x1, x2, y1, y2, z1, z2).
      Return (U, g): U = G rho int 1/|Q - P| dV and g = grad U at P.

      Accuracy: U with a relative error below 1e-10; every component of g within 1e-10 |g| + 1e-14 G |rho| L
      of its exact value, where |g| is the Euclidean norm of the exact attraction and L the longest edge of
      the prism. This holds for every prism whose longest edge is at most 1000 times its shortest edge (rods
      and plates included), at every point: outside the prism at any distance (up to a million times the
      diagonal of the prism, where |g| falls below 1e-12 G |rho| L), on its faces, edges and corners, and
      inside it.
      Inputs: points, a float array of shape (3,) or (n, 3), up to 1000 points per call; bounds, with the
      longest edge at most 1000 times the shortest; rho (float, nonzero).
      Output: for points of shape (3,), a Python float U and a numpy array g of shape (3,); for shape (n, 3)
      (n = 1 included), numpy arrays U of shape (n,) and g of shape (n, 3).
      Errors: raise ValueError if bounds are not six numbers with x1 < x2, y1 < y2, z1 < z2, if rho is zero,
      or if points do not have shape (3,) or (n, 3) with n >= 1.
    function_header: |-
      def prism_gravity(points, bounds, rho):
          """Potential and attraction of a right rectangular prism of uniform density.

          Inputs:
            points: float array of shape (3,) or (n, 3), up to 1000 points, observation points (x, y, z) in m,
              z positive down.
            bounds: (x1, x2, y1, y2, z1, z2), the prism x1 <= x <= x2, y1 <= y <= y2, z1 <= z <= z2 (m), its
              longest edge at most 1000 times its shortest.
            rho: float, nonzero density (kg m^-3).

          Output:
            (U, g): U = G rho int dV / |Q - P| (m^2 s^-2) and g = grad U (m s^-2, toward the mass for rho > 0,
              z component positive down). Python float and array (3,) for one point, arrays (n,) and (n, 3)
              for points of shape (n, 3), n = 1 included. U with a relative error below 1e-10; each
              component of g within 1e-10 |g| + 1e-14 G |rho| L (L the longest edge), at every point, inside,
              on the surface or outside at any distance up to a million times the diagonal of the prism.

          Raises:
            ValueError for invalid bounds (not six numbers with x1 < x2, y1 < y2, z1 < z2), rho = 0, or
            points of the wrong shape.
          """
    return_line: return result
    step_background: |-
      Nagy (1966) and Nagy, Papp and Benedek (2000) gave the potential and attraction of a right rectangular prism as
      sums over its eight corners of terms such as x y ln(z + r) and z^2 atan(x y / (z r)). These sums are exact,
      but their terms grow like the square of the distance while the potential falls like 1/distance and the
      attraction like 1/distance^2, so far from the prism they are small differences of large numbers. At the
      faces, edges and corners some terms take limiting values (0 ln 0, atan of 0/0).
    n_test_cases: 8
    contract:
      quantity: "Potential and attraction of a uniform right rectangular prism."
      assumptions: "Newtonian gravity, uniform density, z positive downward, G = 6.6743e-11."
      result_kind: exact
      valid_input_ranges: "Any point up to a million diagonals from the prism, at most 1000 points per call; nonzero rho; x1 < x2, y1 < y2, z1 < z2, longest edge at most 1000 times the shortest."
      units: "m^2 s^-2 and m s^-2."
      output_shape: "(float, array (3,)) or (array (n,), array (n, 3)), n >= 1."
      step_dependencies: []
    mutants:
      - name: closed_form_everywhere
        description: "Evaluates the corner sums of the whole prism as written at every point (no far-field quadrature, no cutting of elongated prisms); far from the prism they cancel (relative error of U about 1e-8 at 100 diagonals, 1e-5 at 1000, wrong sign at a million) and near a rod they lose about 1e-8."
        file: mutants/step_1_closed_form_everywhere.py
      - name: direct_log
        description: "Evaluates ln(x + r) directly also for x < 0, where it cancels."
        file: mutants/step_1_direct_log.py
      - name: no_subdivision
        description: "Uses the corner sums of the whole prism within two diagonals whatever its shape; near a rod of aspect ratio 1000 they lose up to 1e-8 relative."
        file: mutants/step_1_no_subdivision.py

  - step_number: 2
    scaffold: steps/step_2.py
    solution: solution/step_2.py
    tests: tests/step_2.py
    step_description_prompt: |-
      Gravity-gradient tensor of the right rectangular prism of prism_gravity (step 1): T_ij = d g_i / d x_j
      at P (s^-2), a symmetric 3 x 3 matrix. Inside the prism it satisfies Poisson's equation
      T_xx + T_yy + T_zz = -4 pi G rho; outside, Laplace's equation. It is discontinuous across the faces and
      singular on the edges, so it is not defined on the surface of the prism.

      Accuracy: every component within 1e-9 ||T|| of its exact value, ||T|| the Frobenius norm of the exact
      tensor, for every prism whose longest edge is at most 1000 times its shortest edge, at every point that
      is not on the surface of the prism: outside at any distance (up to a million times the diagonal of the
      prism), including points in the planes of the faces, and inside.
      Inputs: points, a float array of shape (3,) or (n, 3) (n >= 1), up to 1000 points per call;
      bounds = (x1, x2, y1, y2, z1, z2) with x1 < x2, y1 < y2, z1 < z2 and the longest edge at most 1000
      times the shortest; rho (float, nonzero).
      Output: a numpy array of shape (3, 3) for points of shape (3,), of shape (n, 3, 3) for shape (n, 3)
      (n = 1 included).
      Errors: raise ValueError if a point lies on the surface of the prism (on a face, an edge or a corner).
    function_header: |-
      def prism_gradients(points, bounds, rho):
          """Gravity-gradient tensor T_ij = d g_i / d x_j of a right rectangular prism of uniform density.

          Inputs:
            points: float array of shape (3,) or (n, 3), n >= 1, up to 1000 points, observation points (m),
              not on the prism surface.
            bounds: (x1, x2, y1, y2, z1, z2) (m), x1 < x2, y1 < y2, z1 < z2, the longest edge at most 1000
              times the shortest.
            rho: float, nonzero density (kg m^-3).

          Output:
            T: numpy array of shape (3, 3) (one point) or (n, 3, 3) (n >= 1), in s^-2; each component within
              1e-9 ||T|| (Frobenius norm of the exact tensor), inside or outside at any distance up to a million
              times the diagonal of the prism.

          Raises:
            ValueError for a point on the surface of the prism (on a face, an edge or a corner).
          """
    return_line: return T
    step_background: |-
      Gravity gradiometry (airborne and satellite, GOCE) measures the tensor T_ij = d^2 U / dx_i dx_j. For the prism
      its components are corner sums of atan(y z / (x r)) and ln(x + r) terms (Nagy et al. 2000). Across a face
      the component normal-normal to it jumps by 4 pi G rho (the others are continuous there), and the
      off-diagonal components diverge logarithmically along the edges.
    n_test_cases: 8
    contract:
      quantity: "Gravity-gradient tensor of a uniform right rectangular prism."
      assumptions: "As in step 1."
      result_kind: exact
      valid_input_ranges: "Any point not on the surface of the prism (a point on it raises ValueError), up to a million diagonals from it, n >= 1 and at most 1000 points per call; bounds (x1 < x2, y1 < y2, z1 < z2, longest edge at most 1000 times the shortest) and nonzero rho as in step 1."
      units: "s^-2."
      output_shape: "Array (3, 3) or (n, 3, 3), n >= 1."
      step_dependencies: [1]
    mutants:
      - name: closed_form_everywhere
        description: "Evaluates the corner sums of the gradients of the whole prism as written at every point (no far-field quadrature, no cutting of elongated prisms)."
        file: mutants/step_2_closed_form_everywhere.py
      - name: no_subdivision
        description: "Uses the corner sums of the whole prism within two diagonals whatever its shape; near a rod of aspect ratio 1000 the gradients are off by several times the tolerance."
        file: mutants/step_2_no_subdivision.py

  - step_number: 3
    scaffold: steps/step_3.py
    solution: solution/step_3.py
    tests: tests/step_3.py
    step_description_prompt: |-
      Vertical attraction of a sedimentary column whose density contrast with the basement decreases with
      depth as the sediments compact. The column occupies x1 <= x <= x2, y1 <= y <= y2, 0 <= z <= depth (the
      top at the surface z = 0) and has the density contrast drho0 exp(-lam z) (kg m^-3). Return the z
      component of its attraction (m s^-2, positive downward for drho0 > 0; see the conventions) at stations
      at or above the surface (z <= 0).

      Accuracy: a relative error below 1e-10 at every station with z <= 0 up to 1e7 m from the column,
      whatever the column's width: above the column or beside it, on the surface directly above an edge or
      a corner of the column, and at any horizontal distance from its edges, however small.
      Inputs: stations, a float array of shape (3,) or (n, 3) with z <= 0, up to 1000 stations per call;
      x1 < x2, y1 < y2 (floats); depth (float, 0 < depth <= 5e4); drho0 (float, nonzero); lam (float,
      0 <= lam <= 1e-2 per m).
      Output: a Python float for stations of shape (3,), a numpy array of shape (n,) for shape (n, 3)
      (n = 1 included).
      Errors: raise ValueError if stations do not have shape (3,) or (n, 3) or contain a z > 0, if drho0 is
      zero, if x1 >= x2 or y1 >= y2, if depth is not in (0, 5e4] or if lam is not in [0, 1e-2].
    function_header: |-
      def column_gz(stations, x1, x2, y1, y2, depth, drho0, lam):
          """Vertical attraction of a column with density contrast drho0 exp(-lam z), 0 <= z <= depth.

          Inputs:
            stations: float array of shape (3,) or (n, 3), up to 1000 stations (x, y, z) in m with z <= 0.
            x1, x2, y1, y2: floats, the column x1 <= x <= x2, y1 <= y <= y2 (m), x1 < x2, y1 < y2.
            depth: float, 0 < depth <= 5e4 (m).
            drho0: float, nonzero density contrast at the surface (kg m^-3).
            lam: float, 0 <= lam <= 1e-2 (per m).

          Output:
            gz: z component of the attraction (m s^-2, positive down for drho0 > 0); a Python float for one
              station of shape (3,), a numpy array (n,) for stations of shape (n, 3), n = 1 included; relative
              error below 1e-10 at every station up to 1e7 m from the column.

          Raises:
            ValueError for stations of the wrong shape or with z > 0, drho0 = 0, x1 >= x2 or y1 >= y2, depth
            outside (0, 5e4] or lam outside [0, 1e-2].
          """
    return_line: return gz
    step_background: |-
      Sediments compact with burial, so their density contrast with the basement decreases with depth; an
      exponential law drho0 exp(-lam z) (Cordell 1973; Chakravarthi and Sundararajan 2007) is the classical
      model. A column of such sediment has no closed-form attraction; the attraction of a horizontal lamina of the
      column is the sum of atan(x y / (z r)) over its corners.
    n_test_cases: 7
    contract:
      quantity: "Vertical attraction of a column with density contrast decaying exponentially with depth."
      assumptions: "The conventions of problem_description_main (Newtonian gravity, z positive downward, G = 6.6743e-11); column from z = 0 to depth, density contrast drho0 exp(-lam z)."
      result_kind: exact
      valid_input_ranges: "Stations with z <= 0 up to 1e7 m from the column (inclusive), at most 1000 per call; x1 < x2, y1 < y2; 0 < depth <= 5e4 m; nonzero drho0; 0 <= lam <= 1e-2 per m."
      units: "m s^-2."
      output_shape: "Float for one station of shape (3,), array (n,) for shape (n, 3), n >= 1."
      step_dependencies: []
    mutants:
      - name: uniform_gauss_legendre
        description: "Integrates over depth with one 64-point Gauss-Legendre rule, which misses the sharp variation of the lamina term near the top for stations close to an edge."
        file: mutants/step_3_uniform_gauss_legendre.py
      - name: uniform_density
        description: "Ignores the decay of the density contrast with depth."
        file: mutants/step_3_uniform_density.py
      - name: corner_sum_far
        description: "Takes the lamina term as the corner sum of arctangents at every distance; far from the column the four terms cancel (1e-7 relative lost 1e4 widths away)."
        file: mutants/step_3_corner_sum_far.py

  - step_number: 4
    scaffold: steps/step_4.py
    solution: solution/step_4.py
    tests: tests/step_4.py
    step_description_prompt: |-
      Depths of a sedimentary basin from its gravity anomaly. The basin is a grid of nx x ny columns: column
      (i, j) occupies x_edges[i] <= x <= x_edges[i + 1], y_edges[j] <= y <= y_edges[j + 1] and
      0 <= z <= depth[i, j], all with the density contrast drho0 exp(-lam z) of column_gz (step 3). The
      anomaly gz_obs[i, j] is the total vertical attraction of all columns (the sum of their column_gz values)
      at the station at the centre of cell (i, j) on the surface,
      ((x_edges[i] + x_edges[i + 1]) / 2, (y_edges[j] + y_edges[j + 1]) / 2, 0).
      The anomaly is that of such a basin whose every depth satisfies 1e-3 w_min <= depth <= 3 w_min,
      depth <= 5e4 and lam depth <= 2 (all inclusive), where w_min is the smallest cell width in x or in y;
      the depths are then determined by the anomaly to well within the required accuracy. No smoothness of
      the basin is assumed: shallow columns may lie beside deep ones. Find the depths (m) that reproduce it;
      return them as a numpy array of shape (nx, ny) (also when nx or ny is 1) with a relative error below
      1e-8 each.
      Inputs: x_edges and y_edges, 1-D arrays of nx + 1 and ny + 1 floats (nx, ny >= 1), strictly
      increasing, nx ny <= 100; gz_obs, a float array of shape (nx, ny) (m s^-2); drho0 (float, nonzero);
      lam (float, 0 <= lam <= 1e-2).
      Errors: raise ValueError if an edge array is not strictly increasing, if nx ny > 100, if gz_obs does
      not have shape (nx, ny), if drho0 is zero, if lam is not in [0, 1e-2], if an observation is zero or
      of the sign opposite to drho0, or (for lam > 0) if an observation is at least the attraction of an
      infinite slab, 2 pi G |drho0| / lam.
    function_header: |-
      def invert_basin_depths(x_edges, y_edges, gz_obs, drho0, lam):
          """Depths of a basin of columns (density contrast drho0 exp(-lam z)) from its gravity anomaly.

          Inputs:
            x_edges, y_edges: 1-D float arrays of nx + 1 and ny + 1 entries (nx, ny >= 1), strictly increasing,
              nx ny <= 100.
            gz_obs: float array (nx, ny), the vertical attraction (m s^-2) of all columns at the cell centres on
              the surface z = 0; it is that of a basin whose every depth satisfies 1e-3 w_min <= depth <= 3 w_min
              (w_min the smallest cell width, in x or y), depth <= 5e4 m and lam depth <= 2.
            drho0: float, nonzero density contrast at the surface (kg m^-3).
            lam: float, 0 <= lam <= 1e-2 (per m).

          Output:
            depths: numpy array (nx, ny) in m (also when nx or ny is 1), each with a relative error below 1e-8.

          Raises:
            ValueError for edges that are not strictly increasing, nx ny > 100, gz_obs of the wrong shape,
            drho0 = 0, lam outside [0, 1e-2], an observation that is zero or of the sign opposite to drho0,
            or (lam > 0) an observation of at least 2 pi G |drho0| / lam.
          """
    return_line: return depths
    step_background: |-
      Basin depth from gravity (Bott 1960; Cordell and Henderson 1968; Chakravarthi and Sundararajan 2007): with
      one station above each column the anomaly determines the depths. For columns no deeper than a few cell
      widths and a density contrast that has not decayed much, the system is well conditioned and can be
      solved to high accuracy from exact data; deeper columns are seen alike from neighbouring stations and
      the depths become ill determined. So does a column very much shallower than a cell width beside deep
      ones: its own attraction is then a vanishing part of the anomaly at its station, and relative errors
      of the data are amplified in its depth roughly in proportion to the cell width over its depth.
    n_test_cases: 10
    contract:
      quantity: "Depths of a basin of exponential-density columns from its gravity anomaly at the cell centres."
      assumptions: "As in step 3; one station at the centre of each cell on the surface."
      result_kind: exact
      valid_input_ranges: "1-D strictly increasing edge arrays (nx, ny >= 1), at most 100 cells; nonzero drho0; 0 <= lam <= 1e-2 per m; gz_obs of a basin whose depths satisfy 1e-3 w_min <= depth <= 3 w_min (w_min the smallest cell width), depth <= 5e4 m and lam depth <= 2 (all inclusive)."
      units: "m."
      output_shape: "Array (nx, ny), also when nx or ny is 1."
      step_dependencies: [3]
    mutants:
      - name: slab_thickness
        description: "Returns the infinite-slab (Bouguer) thickness under each station."
        file: mutants/step_4_slab_thickness.py
      - name: newton_step_halving
        description: "Runs Newton's method from the infinite-slab thicknesses with the step only halved until the residual decreases; on a rough basin it overshoots deep columns and stalls."
        file: mutants/step_4_newton_step_halving.py
