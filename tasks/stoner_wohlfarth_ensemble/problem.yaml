# problem.yaml: one per task folder. File paths are relative to this folder.

domain: materials

subfield: "Magnetism of fine particles: Stoner-Wohlfarth hysteresis, Neel-Brown thermal switching and Brown relaxation"

tags:
  - Stoner-Wohlfarth model
  - magnetic hysteresis
  - thermal activation
  - dynamic coercivity
  - Fokker-Planck equation
  - Neel-Brown relaxation

expert_time_estimate_hours: 12

relevant_experience: "TODO(author): describe your own relevant experience truthfully before upload"

difficulty_explanation: |-
  The task chains the zero-temperature metastable branch of a Stoner-Wohlfarth particle (the
  local, not the global, energy minimum, followed down to the astroid switching field), the two
  escape barriers from the occupied minimum, the survival probability under a linear field sweep
  with Arrhenius escape over both maxima and the median and mean switching fields, and ends with
  the dynamic coercive field of a weighted ensemble, which needs the branch, the barriers and the
  survival probability of every particle together. The branch must be chosen correctly at every
  field angle, including the degenerate end points psi = 0 and psi = pi/2, where a floating-point
  h_sw slightly below 1 already matters for f0 / rate up to 1e13. The survival probability needs a
  quadrature with a purely relative tolerance, because only an escape integral of order rate / f0
  matters, and the mean switching field follows from the identity E[H_s] = h_sw - int P dh rather
  than from a density that is sharply peaked. Step 5 stands apart from the chain and computes the
  exact relaxation from Brown's Fokker-Planck equation; it is hard because of exponential scale
  separation, not because of extra digits: lam1 falls to about 1e-24 at sigma = 60 next to
  eigenvalues of order 100, and in a strong field the shallow well holds a Boltzmann weight near
  1e-94, so a double-precision matrix eigensolver or a smooth starting vector loses the slow mode
  unless the formulation keeps relative accuracy in both wells.

solution_explanation: |-
  Step 1 brackets the followed minimum between its fold angle -arctan(tan(psi)**(1/3)) and psi with
  Brent's method, with h_sw = (cos(psi)**(2/3) + sin(psi)**(2/3))**(-3/2), and uses the map
  theta -> theta + pi (field h to -h) beyond -h_sw. Step 2 gets the four extrema from a quartic in a
  shifted tan(theta/2) (companion-matrix eigenvalues polished by Newton steps), separates minima from
  maxima by the alternating sign of e'' and measures both barriers from the minimum with cos(theta) > 0.
  Step 3 integrates exp(-2 a low) + exp(-2 a high) from h to h_sw with an adaptive quadrature at
  relative tolerance 1e-12 and returns exp(-(f0 / rate) I); step 4 solves (f0 / rate) I = ln 2 for the
  median with Brent's method and evaluates E[H_s] = h_sw - int P dh on a composite Gauss-Legendre window
  sized from the local escape rate. Step 5 writes Brown's equation in Sturm-Liouville form with the
  Boltzmann weight w, represents functions by piecewise Chebyshev interpolation in theta, and runs
  inverse iteration in which every step is two cumulative integrals (the flux taken from the nearer end
  on each side of the barrier, the start vector a step at the barrier); lam1 is the Rayleigh quotient
  of positive integrals and tau_int comes from Garanin's quadrature. The final step 6 builds the
  expected ensemble magnetization and switched weight from steps 1 and 3 (the other minimum's
  magnetization is minus the branch value at -h) and finds both zero crossings with Brent's method.

verification_explanation: |-
  Every test case computes its own target without calling the reference: steps 1 and 2 use a
  20000-point grid search for the extrema of e on the circle refined by bisection, with h_sw from a
  golden-section search along the equilibrium curve (no astroid formula), plus the closed-form barriers
  at psi = 0 and pi/2; steps 3 and 4 use the closed erfc / inverse-erfc forms at psi = 0 and pi/2 and,
  at other angles, an adaptive quadrature or one ODE run on the grid barriers and a Newton step that
  must not move the returned median; step 5 uses an extended-precision (mpmath) Legendre-polynomial
  expansion of Brown's operator solved by banded elimination, independent of the Chebyshev
  Sturm-Liouville reference. Step 6 and the whole-task tests (ensemble_switching of solution.py) use a
  Newton step with analytic derivatives on the independently computed ensemble magnetization and
  switched weight and, for a particle at psi = 0 alone or paired with a hard-axis particle at
  psi = pi/2, closed forms built on the erfc survival probability. second_solution.py changes the
  method step by step: quartic roots in tan(theta/2) with h_sw from the fold of the equilibrium curve
  instead of bracketing with the astroid formula (step 1), bracketing of each extremum instead of the
  companion-matrix quartic (step 2), one DOP853 ODE run instead of adaptive quadrature (step 3), one ODE
  run with dense output and bisection instead of Brent's method and a composite Gauss-Legendre window
  (step 4), and per-particle ODE runs with bisection instead of Brent's method over nested quadratures
  (step 6); for step 5 it uses the same Legendre/mpmath code as the test oracle, so the independent
  comparison there is reference against oracle. tools/crown_check.py ran every case alone in a fresh
  process: each reference step with the earlier reference steps as context, solution.py on the
  whole-task and all step tests, the second solution on every case, ten step mutants and one whole-task
  mutant (each fails at least one case), the reference outputs scaled by 1 + 1e-12 and by 1 - 1e-12
  (every case passes), and all-None and all-zero stubs (no case passes). Each solution was also run
  twice in clean processes on the same inputs and gave identical outputs.

author: "Ayoub Bousfiha"

affiliation: "Independent Researcher"

required_dependencies: |-
  import numpy as np
  from scipy.optimize import brentq
  from scipy.integrate import quad
  from scipy.integrate import solve_ivp
  import mpmath as mp

problem_description_main: |-
  The Stoner-Wohlfarth model describes a small magnetic particle that is a single
  domain. Its magnetization has a fixed length M_s and can only turn. The particle has
  one easy axis (uniaxial anisotropy constant K) and volume V. A field H is applied
  along an axis that makes an angle psi with the easy axis, 0 <= psi <= pi/2. Let theta
  be the angle of the magnetization from the easy axis, in the plane of the easy axis
  and the field, measured in the same sense as psi. In reduced units h = H / H_K, with
  H_K = 2K / (mu0 M_s), the energy of the particle is E(theta) = 2 K V e(theta) with

    e(theta) = (1/2) sin(theta)**2 - h cos(theta - psi).

  A negative h means the field points the other way along the same axis. At zero
  temperature the magnetization stays in a local minimum of e and follows it while the
  field changes slowly, until that minimum disappears; then it jumps to the other
  minimum, which gives hysteresis. At a temperature T > 0 it can also leave its minimum
  earlier, by thermal activation over an energy barrier. We follow particles during a
  descending field sweep, from a very large positive field down at a constant rate, and
  compute the zero-temperature branch, the energy barriers, the probability that a
  particle has not switched yet and the statistics of its switching field; the final step
  combines the branch, the barriers and the survival probability into the dynamic coercive
  field of a small ensemble. Step 5 stands apart from this chain and goes beyond the
  Arrhenius picture: the exact relaxation of a particle whose field lies along its easy axis,
  with the slowest relaxation rate and the integral relaxation time from Brown's Fokker-Planck
  equation for the magnetization direction. All fields are in units of H_K and all magnetizations in units of M_s.

problem_io: |-
  def ensemble_switching(psis, weights, a, f0, rate):
      '''Dynamic coercive field and half-switching field of an ensemble during the sweep.

      Inputs:
        psis: 1-D array of easy-axis angles in radians, each in [0, pi/2].
        weights: 1-D array of the same length, nonnegative, not all zero (normalized by
                 their sum).
        a: float, thermal stability ratio K V / (k_B T), 40 <= a <= 1000.
        f0: float, attempt frequency in 1/s, > 0.
        rate: float, sweep rate |dh/dt| in units of H_K per second, > 0, with
              1e5 <= f0 / rate <= 1e13.

      Output:
        (h_c, h_half): tuple of two floats, absolute errors below 1e-6.
          h_c: the ensemble magnetization is zero at h = -h_c during the sweep.
          h_half: half of the total weight has left its original minimum at h = -h_half.

      Raises:
        ValueError if psis and weights are not 1-D arrays of the same nonzero length, if
        a psi is outside [0, pi/2], if a weight is negative or not finite, if the weights
        add up to zero, if a, f0 or rate is not a positive finite number, if a is outside
        [40, 1000] or if f0 / rate is outside [1e5, 1e13].
      '''

general_tests: tests/general.py

second_solution: second_solution.py

mutants:
  - name: whole_task_barriers_from_global_minimum
    description: "Measures the escape barriers from the deeper (global) energy minimum instead of the original minimum the particle occupies; the survival probability built on them and both ensemble fields of the final step inherit the error (the particle hardly ever escapes before its minimum disappears)."
    file: mutants/whole_task_barriers_from_global_minimum.py

# On a new version of an uploaded task only, what kind of edit it is.
edit_label: grading_fix

sub_steps:
  - step_number: 1
    scaffold: steps/step_1.py
    solution: solution/step_1.py
    tests: tests/step_1.py
    step_description_prompt: |-
      Zero temperature. Return the magnetization component along the field,
      m = cos(theta - psi), on the descending branch of one particle at field h (h may be
      positive or negative). The particle starts at a very large positive field, where
      theta is close to psi, and the field is lowered slowly to h. The magnetization stays
      in its local energy minimum (not the global minimum) until that minimum disappears
      at the field h = -h_sw(psi), where it merges with a maximum (e'(theta) = 0 and
      e''(theta) = 0 at the same angle). After that it is in the other minimum. At psi = 0
      and at psi = pi/2 the merging is degenerate; there h_sw = 1. The function must work
      for every psi in [0, pi/2], including the two end points.

      Inputs: h (float) and psi (float, radians, 0 <= psi <= pi/2). Return m as a Python
      float with an absolute error below 1e-8 for every h with |h + h_sw(psi)| >= 1e-3;
      closer to the jump no accuracy is required.
      Errors: raise ValueError if psi is outside [0, pi/2] or h is not finite.
    function_header: |-
      def branch_magnetization(h, psi):
          '''Magnetization along the field on the zero-temperature descending branch of one particle.

          Inputs:
            h: float, reduced field along the field axis (negative means reversed field).
            psi: float, angle in radians between the field axis and the easy axis, 0 <= psi <= pi/2.

          Output:
            m: float, cos(theta - psi), where theta is the magnetization angle (from the easy
               axis) of the state reached when the field comes down from large positive values
               to h, the particle staying in its local energy minimum until that minimum
               disappears at h = -h_sw(psi). Absolute error below 1e-8 when
               |h + h_sw(psi)| >= 1e-3.

          Raises:
            ValueError if psi is outside [0, pi/2] or h is not finite.
          '''
    return_line: return m
    step_background: |-
      Eliminating theta from e' = 0 and e'' = 0 gives a closed curve in the plane of the
      field components along and across the easy axis, the Stoner-Wohlfarth astroid.
      Inside it there are two energy minima, outside only one. The curve is symmetric
      under exchanging the two components, so h_sw(psi) = h_sw(pi/2 - psi), and h_sw is
      smallest, 0.5, at psi = pi/4. The map theta -> theta + pi turns the energy at field
      h into the energy at field -h. For psi > pi/4 the component m already becomes
      negative before the jump.
    n_test_cases: 5
    contract:
      quantity: Component of the reduced magnetization along the field on the zero-temperature descending hysteresis branch.
      assumptions: Quasi-static field change, the particle follows its local minimum until it vanishes, no thermal jumps.
      result_kind: exact
      valid_input_ranges: Any real h with |h + h_sw(psi)| >= 1e-3; 0 <= psi <= pi/2.
      units: Units of M_s.
      output_shape: One Python float in [-1, 1].
      step_dependencies: []
    mutants:
      - name: global_minimum
        description: Puts the particle in the global energy minimum instead of the local minimum it follows.
        file: mutants/step_1_global_minimum.py
      - name: wrong_astroid_power
        description: Uses the outer power -2/3 instead of -3/2 in the switching field, so the particle jumps at the wrong field.
        file: mutants/step_1_wrong_astroid_power.py

  - step_number: 2
    scaffold: steps/step_2.py
    solution: solution/step_2.py
    tests: tests/step_2.py
    step_description_prompt: |-
      For fields where both energy minima exist, |h| < h_sw(psi), a particle on the
      descending branch sits in its original minimum, the one followed from large positive
      fields (branch_magnetization, step 1). To leave it, the magnetization must pass over
      one of the two energy maxima of e(theta) on the circle. Return the two reduced
      barriers, Delta_e = e(theta_max) - e(theta_min) from the original minimum over each
      of the two maxima, as a tuple (low, high) with low <= high.

      h may be a float or a numpy array of any shape. Return two values with the shape of
      np.asarray(h) (float numpy arrays, or float scalars, Python float or numpy floating,
      for a scalar h), each entry with an absolute error below 1e-8 whenever
      h_sw(psi) - |h| >= 1e-3.
      Errors: raise ValueError if psi is outside [0, pi/2], if any h is not finite, or if
      any h has |h| >= h_sw(psi) (only one minimum exists there).
    function_header: |-
      def escape_barriers(h, psi):
          '''Reduced energy barriers that keep a particle in its original minimum.

          Inputs:
            h: float or numpy array (any shape), reduced field with |h| < h_sw(psi).
            psi: float, angle in radians between the field axis and the easy axis, 0 <= psi <= pi/2.

          Output:
            (low, high): two values with the shape of np.asarray(h): float numpy arrays, or float
            scalars (Python float or numpy floating) for a scalar h. low <= high are
            e(theta_max) - e(theta_min) for the two energy maxima, theta_min being the original
            minimum of the descending branch. Absolute error below 1e-8 when
            h_sw(psi) - |h| >= 1e-3.

          Raises:
            ValueError if psi is outside [0, pi/2], if any h is not finite, or if any
            |h| >= h_sw(psi).
          '''
    return_line: return low, high
    step_background: |-
      Inside the astroid, e(theta) has exactly two minima and two maxima on the circle,
      and they alternate, so each maximum separates the two minima. At h = 0 both
      barriers are 1/2 (the energy K V of the hard axis). When h approaches -h_sw(psi) the
      original minimum merges with one maximum and the lower barrier goes to zero.
    n_test_cases: 5
    contract:
      quantity: The two reduced energy barriers between the original minimum of the descending branch and the two energy maxima.
      assumptions: Same model as step 1; both minima exist.
      result_kind: exact
      valid_input_ranges: 0 <= psi <= pi/2; |h| < h_sw(psi), accuracy required for h_sw(psi) - |h| >= 1e-3.
      units: Units of 2 K V (reduced energy).
      output_shape: Tuple of two float numpy arrays with the shape of np.asarray(h), or two float scalars (Python float or numpy floating) for a scalar h.
      step_dependencies: [1]
    mutants:
      - name: barrier_from_global_minimum
        description: Measures the barriers from the deepest minimum instead of the original minimum the particle occupies.
        file: mutants/step_2_barrier_from_global_minimum.py

  - step_number: 3
    scaffold: steps/step_3.py
    solution: solution/step_3.py
    tests: tests/step_3.py
    step_description_prompt: |-
      Thermal activation. While both minima exist, a particle in its original minimum
      jumps over energy maximum k (k = 1, 2) at the rate f0 * exp(-dE_k / (k_B T)), where
      dE_k is that barrier in joules (the energy E at the maximum minus E at the original
      minimum, see escape_barriers, step 2) and f0 is the attempt frequency in 1/s; the
      two escape routes add. The thermal stability ratio is a = K V / (k_B T). There are no
      jumps while only the original minimum exists and no jumps back once the particle has
      left, and the particle has surely left once the original minimum disappears
      (h <= -h_sw(psi)). The field starts at a very large positive value and decreases at
      the constant rate `rate`, in units of H_K per second.

      Return the probability that the particle is still in its original minimum when the
      field reaches h, as a Python float with an absolute error below 1e-8. The domain is
      40 <= a <= 1000 and 1e5 <= f0 / rate <= 1e13 (bounds included); there the particle has
      left with a probability far above 1/2 before its original minimum disappears.
      Errors: raise ValueError if psi is outside [0, pi/2], if h is not finite, if a, f0 or
      rate is not a positive finite number, if a is outside [40, 1000] or if f0 / rate is
      outside [1e5, 1e13].
    function_header: |-
      def survival_probability(h, psi, a, f0, rate):
          '''Probability that a particle has not left its original minimum when the sweep reaches h.

          Inputs:
            h: float, reduced field reached by the descending sweep.
            psi: float, easy-axis angle in radians, 0 <= psi <= pi/2.
            a: float, thermal stability ratio K V / (k_B T), 40 <= a <= 1000.
            f0: float, attempt frequency in 1/s, > 0.
            rate: float, sweep rate |dh/dt| in units of H_K per second, > 0, with
                  1e5 <= f0 / rate <= 1e13.

          Output:
            P: float in [0, 1], P = 1 for h >= h_sw(psi) and P = 0 for h <= -h_sw(psi).
               Absolute error below 1e-8.

          Raises:
            ValueError if psi is outside [0, pi/2], if h is not finite, if a, f0 or rate is
            not a positive finite number, if a is outside [40, 1000] or if f0 / rate is
            outside [1e5, 1e13].
          '''
    return_line: return P
    step_background: |-
      This is the Neel-Brown picture of thermal switching: escape is a Poisson process
      whose rate depends on the field, and time and field are tied by the constant sweep
      rate. The rate grows by many orders of magnitude as the lower barrier shrinks, so
      almost all switching happens in a narrow field window well before the
      zero-temperature switching field (Sharrock 1994); slower sweeps and higher
      temperatures switch at smaller fields.
    n_test_cases: 6
    contract:
      quantity: Survival probability of the original minimum during a descending field sweep with thermally activated escape.
      assumptions: Arrhenius escape over both maxima with attempt frequency f0, no back jumps, no escape outside the astroid, certain switching when the original minimum vanishes, constant sweep rate.
      result_kind: exact
      valid_input_ranges: 0 <= psi <= pi/2; any real h; 40 <= a <= 1000; 1e5 <= f0 / rate <= 1e13.
      units: Probability (dimensionless).
      output_shape: One Python float in [0, 1].
      step_dependencies: [2]
    mutants:
      - name: lower_route_only
        description: Keeps only the escape over the lower barrier and drops the second route.
        file: mutants/step_3_lower_route_only.py

  - step_number: 4
    scaffold: steps/step_4.py
    solution: solution/step_4.py
    tests: tests/step_4.py
    step_description_prompt: |-
      In the sweep of survival_probability (step 3), with the escape rate built from
      escape_barriers (step 2), the switching field of one particle is the field at which
      it leaves its original minimum; it is a random variable.
      Return the tuple (h_median, h_mean) of two Python floats: h_median is the field at
      which the particle has left with probability 1/2, and h_mean is the mean switching
      field. Give both with an absolute error below 1e-7. The domain is that of step 3,
      40 <= a <= 1000 and 1e5 <= f0 / rate <= 1e13, for every psi in [0, pi/2] including both
      end points; in it the survival probability falls below 1/2 before -h_sw(psi), so the
      median is a field inside (-h_sw, h_sw).
      Errors: raise ValueError if psi is outside [0, pi/2], if a, f0 or rate is not a
      positive finite number, if a is outside [40, 1000] or if f0 / rate is outside
      [1e5, 1e13].
    function_header: |-
      def switching_field_statistics(psi, a, f0, rate):
          '''Median and mean switching field of one particle in the descending sweep.

          Inputs:
            psi: float, easy-axis angle in radians, 0 <= psi <= pi/2.
            a: float, thermal stability ratio K V / (k_B T), 40 <= a <= 1000.
            f0: float, attempt frequency in 1/s, > 0.
            rate: float, sweep rate |dh/dt| in units of H_K per second, > 0, with
                  1e5 <= f0 / rate <= 1e13.

          Output:
            (h_median, h_mean): tuple of two floats, the median and the mean of the field at
            which the particle leaves its original minimum. Absolute errors below 1e-7.

          Raises:
            ValueError if psi is outside [0, pi/2], if a, f0 or rate is not a positive finite
            number, if a is outside [40, 1000] or if f0 / rate is outside [1e5, 1e13].
          '''
    return_line: return result
    step_background: |-
      The switching field is spread over a narrow window; its distribution is skewed
      because the escape rate rises steeply as the field falls. Sharrock-type formulas
      give the median only approximately; here it must follow from the full field
      dependence of both barriers.
    n_test_cases: 5
    contract:
      quantity: Median and mean of the random switching field of one particle under thermally activated escape.
      assumptions: Same model as step 3.
      result_kind: exact
      valid_input_ranges: 0 <= psi <= pi/2; 40 <= a <= 1000; 1e5 <= f0 / rate <= 1e13.
      units: Units of H_K.
      output_shape: Tuple of two Python floats.
      step_dependencies: [2, 3]
    mutants:
      - name: wrong_mean_formula
        description: Takes the mean switching field as the integral of the survival probability minus h_sw instead of h_sw minus that integral.
        file: mutants/step_4_wrong_mean_formula.py

  - step_number: 5
    scaffold: steps/step_5.py
    solution: solution/step_5.py
    tests: tests/step_5.py
    step_description_prompt: |-
      Leave the Arrhenius rate with its assumed attempt frequency f0 and treat thermal switching
      exactly for one particle whose field is along its easy axis (psi = 0). With
      z = cos(theta), the distribution W(z, t) of the magnetization direction (normalized,
      int_{-1}^{1} W dz = 1) obeys Brown's Fokker-Planck equation, which for this axially
      symmetric case reads

        2 tau_N dW/dt = d/dz [ (1 - z**2) ( dW/dz + W d(beta E)/dz ) ],
        beta E(z) = sigma (1 - z**2 - 2 h z),

      with sigma = K V / (k_B T) (the a of the earlier steps), h = H / H_K along the easy axis and
      tau_N the free-diffusion time of the magnetization (its value does not matter here; all
      times are in units of tau_N). Its stationary solution is the Boltzmann distribution
      exp(-beta E) / Z. Compute

        lam1: the smallest nonzero eigenvalue of this Fokker-Planck operator, i.e. the slowest
              relaxation rate of any initial distribution towards equilibrium, in units of 1/tau_N;
        tau_int: the integral relaxation time of z, int_0^inf C(t) dt / C(0) with the equilibrium
              correlation function C(t) = <z(t) z(0)> - <z>**2, in units of tau_N.

      At sigma = 0 both equal 1. For large sigma lam1 is exponentially small (about 1e-24 at
      sigma = 60, h = 0) and must still have the stated relative accuracy. In a strong field one
      well holds only a tiny part of the equilibrium probability (a relative Boltzmann weight near
      exp(-4 sigma |h|), about 1e-94 at sigma = 60, |h| = 0.9), yet the slowest mode can live in
      it, and tau_int then differs from 1 / lam1 by orders of magnitude.

      Useful exact forms: with the Boltzmann weight w(z) = exp(-beta E(z)) and W = w g, the equation
      becomes the self-adjoint Sturm-Liouville form 2 tau_N dg/dt = (1 / w) d/dz[(1 - z**2) w dg/dz],
      so lam1 is the smallest positive lam with d/dz[(1 - z**2) w dg/dz] = -2 lam w g for a g that stays
      bounded at z = -1 and z = 1. The integral relaxation time has the exact quadrature (Garanin)
        tau_int = 2 int_{-1}^{1} Q(z)**2 / ((1 - z**2) w(z)) dz / int_{-1}^{1} (z - <z>)**2 w(z) dz,
        Q(z) = int_{-1}^{z} (z' - <z>) w(z') dz',
      with <z> the equilibrium mean of z.

      Inputs: sigma (float, 0 <= sigma <= 60) and h (float, -0.9 <= h <= 0.9). Return the tuple
      (lam1, tau_int) of two Python floats, each with a relative error below 1e-5 on the whole domain,
      the hardest corner sigma = 60 with |h| = 0.9 included.
      Errors: raise ValueError if sigma or h is not finite, if sigma is outside [0, 60] or if
      |h| > 0.9.
    function_header: |-
      def brown_relaxation(sigma, h):
          '''Exact thermal relaxation of one particle with its field along the easy axis (Brown's equation).

          Inputs:
            sigma: float, K V / (k_B T), 0 <= sigma <= 60.
            h: float, reduced field H / H_K along the easy axis, -0.9 <= h <= 0.9.

          Output:
            (lam1, tau_int): tuple of two Python floats, in units of 1/tau_N and tau_N, respectively.
              lam1: smallest nonzero eigenvalue of the Fokker-Planck operator (relaxation rate times
                    tau_N), relative error below 1e-5.
              tau_int: integral relaxation time of z = cos(theta) divided by tau_N,
                       int_0^inf C(t) dt / C(0) with C(t) = <z(t) z(0)> - <z>**2 in equilibrium,
                       relative error below 1e-5.

          Raises:
            ValueError if sigma or h is not finite, if sigma is outside [0, 60] or if |h| > 0.9.
          '''
    return_line: return result
    step_background: |-
      Brown (1963) derived the Fokker-Planck equation for the magnetization of a single-domain
      particle; for an axially symmetric potential it reduces to one variable z = cos(theta). Its
      eigenvalues are the relaxation rates; the smallest nonzero one is the switching rate, which
      Brown's high-barrier formula approximates by (2 / sqrt(pi)) sigma**1.5 exp(-sigma) at h = 0.
      The integral relaxation time weights all modes by their contribution to z; at strong fields
      the intrawell modes of the deep well dominate it (Coffey, Kalmykov and Garanin). Matrix
      methods in Legendre polynomials and integral formulas with Boltzmann weights are both used;
      in double precision a plain matrix eigensolver cannot resolve an eigenvalue 1e-24 next to
      eigenvalues of order 100, and representations that mix the two wells lose the shallow one.
    n_test_cases: 6
    contract:
      quantity: "Smallest nonzero eigenvalue and integral relaxation time of Brown's Fokker-Planck equation for a uniaxial particle with its field along the easy axis."
      assumptions: "Axially symmetric Brown equation in z = cos(theta), beta E = sigma (1 - z^2 - 2 h z), time in units of tau_N; exact, no high-barrier approximation."
      result_kind: exact
      valid_input_ranges: "0 <= sigma <= 60, -0.9 <= h <= 0.9."
