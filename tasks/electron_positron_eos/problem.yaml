difficulty_explanation: >-
  Every quantity must be delivered with a relative error below 1e-10 (c_V below 1e-8; a density below
  1e-250 cm^-3 to within 1e-250 cm^-3) for 1e7 <= T <= 1e11 K and psi from about 2e-21 to 1e6, a
  domain that spans classical and completely degenerate, non-relativistic and ultra-relativistic, and
  pair-dominated gases, so no single textbook formula or fixed grid works. Three of the wanted quantities are tiny differences of large ones: in a pair plasma at
  rho Ye = 1e-10 g cm^-3, T = 1e11 K the net electron density is 4e-21 of n_minus, so n_minus - n_plus
  has no correct digit; the entropy of a degenerate gas is about 6e-10 of (u + P) / T, so the Euler
  relation gives it with a relative error of 1.6e-5 at psi = 1.3e5, T = 1e7 K; and c_V of a degenerate
  gas is smaller than the energy and number fluctuations it is built from by (k T / E_F)^2, so the
  textbook Schur form <dE^2> - <dE dN>^2 / <dN^2> loses 2.8e-6 at rho Ye = 1e13 g cm^-3, T = 1e7 K. The
  solver has to recast each of them without subtraction, integrate across a Fermi edge only k T wide at an
  energy up to 1e6 k T with the occupation argument taken relative to the edge, invert n_net(psi) to full
  relative precision when psi is 2e-21 (which requires working in psi, rest energy included, rather than
  mu / k T), and differentiate the energy at constant net density so that pair creation enters c_V. The
  complete equation of state must meet these bounds with respect to the exact values at (rho, T, Ye),
  and n_minus, n_plus, P, u and s amplify a relative error of psi up to about 600 times (in a cool
  classical gas d ln n / d ln psi is about psi, close to m_e c^2 / k T), so psi has to be converged to
  about 1e-13; in a degenerate, non-relativistic gas near 1e7 K the slope of ln n_net against ln psi
  falls from several hundred to below 20 across the bracket, where plain false position stalls.

solution_explanation: >-
  The reference integrates over the kinetic energy E with composite 24-point Gauss-Legendre rules: below
  the Fermi edge in t = sqrt(E) on doubling panels, and over the window E_F +- 60 k T in y = (E - E_F) /
  (k T) on unit panels, so the electron occupation argument is y itself and the integrands stay accurate
  even at psi = 1e6. The net electron density uses the identity f(b - psi) - f(b + psi) = sinh(psi) /
  (cosh b + cosh psi) (b = eps / theta), a positive integrand summed in logarithms; the entropy uses the
  positive integrand log1p(e^{-|x|}) + |x| / (e^{|x|} + 1). degeneracy_parameter solves ln n_net(ln psi)
  = ln(rho_Ye N_A) by bisection-safeguarded false position with the Illinois modification in ln psi,
  stopped when the bracket is below 1e-14 or the residual below 1e-15, well inside the about 1e-13 that
  the complete equation of state needs. specific_heat evaluates the
  grand-canonical fluctuation formula c_V = det / (k T^2 <dN^2>) with det = <dE^2><dN^2> - <dE dN>^2
  written as 1/2 sum_ij w_i w_j (e_i n_j - e_j n_i)^2, i.e. two-pass centred second moments for
  same-species pairs and (e_i + e_j)^2 > 0 for electron-positron pairs, so nothing cancels.
  electron_positron_eos validates rho, T and Ye and chains the four functions at rho_Ye = rho Ye.

verification_explanation: >-
  The test targets do not come from the solution code: classical-gas states use the Maxwell-Juettner
  closed forms with modified Bessel functions in 40-digit mpmath (only where the Fermi corrections are
  below 1e-11), twelve (T, psi) states use 40-digit mpmath tanh-sinh quadrature of the defining integrals
  with breakpoints every k T over the Fermi edge, and twelve (rho_Ye, T) and four (rho, T, Ye) states take
  psi from an mpmath root search on those integrals and c_V from a centred difference of u at constant
  n_net (T +- 1e-7 T, psi re-solved at each temperature), a different route from the fluctuation formula of
  the reference; three of the twelve (T, psi) states (T = 1e7, 1e9, 1e11 K) were re-checked with mpmath
  Gauss-Legendre quadrature of the same integrals. The two (rho_Ye, T) states added in version 3
  (1e5 g cm^-3 at 1e7 K and 4e5 g cm^-3 at 1.2e7 K) were computed with both tanh-sinh and Gauss-Legendre
  quadrature, which agree to 30 digits, and their centred-difference c_V agrees with the 40-digit
  fluctuation formula to 1e-17; the two step 5 corner states at the domain endpoints use the stored psi and
  c_V with P, u, s and the densities from the same 40-digit quadratures (n_minus of the degenerate corner
  from n_minus = rho Ye N_A + n_plus). second_solution.py uses different numerics (adaptive
  QUADPACK quadrature in E with an edge window in y, Brent's method for psi, centred moments by the same
  adaptive quadrature) and passes every test case. Each step has a named scientific mutant (net density
  by subtraction, entropy from the Euler relation, positrons ignored in the density equation, Schur-form
  c_V and c_V without positron fluctuations, c_V at constant psi) and the whole-task mutant uses Boltzmann
  occupation numbers; each fails at least one case of its target tests. tools/crown_check.py ran every
  test case alone in a fresh process for the reference, the second solution and the mutants, checked that
  scaling every reference output by 1 +- 1e-12 still passes every case, and checked that all-None and
  all-zero controls pass no case; both solutions were run three times in clean processes (once with one
  BLAS/OpenMP thread) and gave identical outputs, and on a 240-state (rho_Ye, T) grid with Ye = 1 the
  complete equations of state of the two solutions agree to 5e-12.

required_dependencies: |-
  import numpy as np
  import math
  import warnings
  from scipy.integrate import quad, IntegrationWarning
  from scipy.optimize import brentq

problem_description_main: |-
  In the hot, dense interiors of stars, white dwarfs and supernova cores the electrons form an ideal
  Fermi gas that can be anywhere between classical and completely degenerate, and between
  non-relativistic and ultra-relativistic; above about 10^9 K, electron-positron pairs appear and at
  low density they outnumber the electrons left over from the ions by many decades. We compute the
  equation of state of this gas from first principles: the number densities of electrons and
  positrons, the pressure, the internal energy and the entropy for a given temperature and chemical
  potential, the chemical potential that reproduces a given electron density, the specific heat at
  constant density, and finally the complete equation of state for a given mass density, temperature
  and electron fraction. The quantities wanted are often tiny differences of large ones (the net
  electron density in a pair plasma, the entropy and the specific heat of a degenerate gas), and each
  must be delivered with a small relative error.

  Conventions used in every step. The particles have spin 1/2 (two states per momentum). Momenta p are
  in units of m_e c, energies in units of m_e c^2: the total energy of a particle is eps = sqrt(1 + p^2)
  and its kinetic energy is eps - 1. theta = k T / (m_e c^2). The state of the gas is given by T and
  psi = (mu + m_e c^2) / (k T), where mu is the electron chemical potential without the rest mass; the
  occupation numbers are f_-(p) = 1 / (exp(eps / theta - psi) + 1) for electrons and
  f_+(p) = 1 / (exp(eps / theta + psi) + 1) for positrons (pairs are in equilibrium with radiation, so
  the positron chemical potential is minus that of the electrons). psi > 0 means more electrons than
  positrons. Number densities are n = (1 / (pi^2 lambda^3)) int_0^inf p^2 f(p) dp with
  lambda = hbar / (m_e c). Constants (CGS, exact as given): m_e c^2 = 8.1871057769e-7 erg,
  k = 1.380649e-16 erg/K, lambda = 3.8615926796e-11 cm, Avogadro's number N_A = 6.02214076e23 per mol.

problem_io: |-
  def electron_positron_eos(rho, T, Ye):
      '''Equation of state of the electron-positron gas for a mass density, temperature and electron fraction.

      Inputs:
        rho: float, mass density in g cm^-3.
        T: float, temperature in K, 1e7 <= T <= 1e11.
        Ye: float, electrons per baryon, 0 < Ye <= 1; 1e-10 <= rho Ye <= 1e13.

      Output:
        dict with the Python floats "psi", "n_minus", "n_plus", "P", "u", "s", "cv" (units as in steps
          1-4). Accuracy with respect to the exact values for the given (rho, T, Ye): psi, n_minus, P, u, s
          relative 1e-10; n_plus relative 1e-10 when at least 1e-250 cm^-3, otherwise within 1e-250 cm^-3;
          cv relative 1e-8. This includes the error propagated from psi, which n_minus, n_plus, P, u and s
          amplify up to about 600 times, so psi must be found to about 1e-13 relative.

      Raises:
        ValueError if rho, T or Ye is not finite, if Ye is not in (0, 1], or if T or rho Ye is outside
        its range.
      '''

